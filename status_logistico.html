<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Logístico — TWM Datalink</title>
<style>
  :root {
    --bg:        #0f0f1a;
    --surface:   #1a1a2e;
    --surface2:  #16213e;
    --border:    #2a2a4a;
    --text:      #e8e8f0;
    --muted:     #7070a0;
    --purple:    #7c3aed;
    --purple-lt: #a78bfa;
    --orange:    #f59e0b;
    --green:     #10b981;
    --gray:      #6b7280;

    --viagem-bg:    #2d1b6b;
    --viagem-icon:  #7c3aed;
    --desc-bg:      #3d2200;
    --desc-icon:    #f59e0b;
    --retorno-bg:   #0d3320;
    --retorno-icon: #10b981;
    --garagem-bg:   #1e1e2e;
    --garagem-icon: #6b7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 0 0 40px;
  }

  /* ── HEADER ─────────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-back {
    width: 36px; height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    text-decoration: none;
  }
  .header-title h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .header-title p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  .header-badge {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--green);
  }
  .header-badge .dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  /* ── UPLOAD AREA ─────────────────────────────── */
  .upload-zone {
    margin: 16px 16px 0;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .upload-zone:hover { border-color: var(--purple-lt); }
  .upload-zone.drag  { border-color: var(--purple); background: #1e1040; }
  .upload-icon {
    width: 44px; height: 44px;
    background: var(--viagem-bg);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .upload-text h3 { font-size: 14px; font-weight: 600; }
  .upload-text p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #fileInput { display: none; }

  /* ── KPI CARDS ───────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 16px 16px 0;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
  }
  .kpi-number {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .kpi-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
  }
  .kpi-viagem  .kpi-number { color: var(--purple-lt); }
  .kpi-desc    .kpi-number { color: var(--orange); }
  .kpi-retorno .kpi-number { color: var(--green); }
  .kpi-garagem .kpi-number { color: var(--gray); }

  /* ── SECTIONS ────────────────────────────────── */
  .sections { padding: 20px 16px 0; }

  .section { margin-bottom: 24px; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .section-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
  }
  .section-count {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }

  /* ── TRUCK GRID ──────────────────────────────── */
  .truck-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .truck-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    position: relative;
  }
  .truck-card:hover {
    border-color: var(--purple-lt);
    transform: translateY(-1px);
  }
  .truck-card:active { transform: scale(.97); }

  .truck-icon-wrap {
    width: 48px; height: 48px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 8px;
    font-size: 22px;
  }
  .truck-plate {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .truck-driver {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* icon colors per status */
  .icon-viagem  { background: var(--viagem-bg);  color: var(--viagem-icon); }
  .icon-desc    { background: var(--desc-bg);    color: var(--desc-icon); }
  .icon-retorno { background: var(--retorno-bg); color: var(--retorno-icon); }
  .icon-garagem { background: var(--garagem-bg); color: var(--garagem-icon); }

  .dot-viagem  { background: var(--purple-lt); }
  .dot-desc    { background: var(--orange); }
  .dot-retorno { background: var(--green); }
  .dot-garagem { background: var(--gray); }

  /* ── EMPTY / LOADING ─────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .empty-state p  { font-size: 13px; line-height: 1.5; }

  /* ── MODAL ───────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%; max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .modal-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .modal-title h2 { font-size: 20px; font-weight: 800; }
  .modal-title p  { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .modal-status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .badge-viagem  { background: var(--viagem-bg);  color: var(--purple-lt); }
  .badge-desc    { background: var(--desc-bg);    color: var(--orange); }
  .badge-retorno { background: var(--retorno-bg); color: var(--green); }
  .badge-garagem { background: var(--garagem-bg); color: var(--gray); }

  .modal-rows { display: flex; flex-direction: column; gap: 12px; }
  .modal-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .modal-row span  { font-size: 13px; font-weight: 600; text-align: right; max-width: 60%; }

  .modal-close {
    width: 100%; margin-top: 18px;
    padding: 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .modal-close:hover { border-color: var(--purple-lt); }

  /* ── TIMESTAMP ───────────────────────────────── */
  .timestamp {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-top: 12px;
  }

  /* ── ALERTAS DE MANUTENÇÃO ─── */
  .alert-badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 10px;
    margin-top: 4px;
  }
  .alert-os   { background: rgba(239,68,68,.2);  color: #ef4444; }
  .alert-pend { background: rgba(245,158,11,.2); color: #f59e0b; }
  .truck-alerts { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 2px; }


  /* ── ALERT MODAL ITEMS ─── */
  .alert-item {
    background: var(--bg);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .alert-item-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .alert-item-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  .alert-item-row:last-child { border-bottom: none; }
  .alert-item-label { color: var(--muted); }
  .alert-item-value { font-weight: 500; text-align: right; max-width: 60%; }
  .alert-badge-click { cursor: pointer; }
  .alert-badge-click:active { opacity: 0.7; transform: scale(0.95); }


  /* ══ BARRA DE FILTROS ══════════════════════════════════ */
  .filtros { padding: 0 16px 12px; }
  .f-busca {
    width: 100%; padding: 10px 12px; margin-bottom: 8px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 13px;
    font-family: inherit; outline: none; -webkit-appearance: none;
  }
  .f-busca:focus { border-color: var(--purple-lt); }
  .f-linha { display: flex; gap: 8px; align-items: stretch; }
  .f-select {
    flex: 1; padding: 9px 10px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 12px;
    font-family: inherit; outline: none; -webkit-appearance: none; cursor: pointer;
  }
  .f-chip {
    display: flex; align-items: center; white-space: nowrap;
    padding: 9px 12px; border-radius: 12px; cursor: pointer;
    background: var(--surface); border: 1.5px solid var(--border);
    color: var(--muted); font-size: 12px; font-weight: 600; transition: all .15s;
  }
  .f-chip.on { background: rgba(239,68,68,.15); border-color: #ef4444; color: #ef4444; }
  .f-ativo {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 8px; padding: 7px 12px;
    background: rgba(175,82,222,.12); border: 1px solid rgba(175,82,222,.3);
    border-radius: 10px; font-size: 11px; color: var(--purple-lt); font-weight: 600;
  }
  .f-ativo button {
    background: none; border: none; color: var(--purple-lt);
    font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; padding: 2px 4px;
  }

  /* KPI clicável funciona como filtro de status */
  .kpi-card { cursor: pointer; transition: all .15s; }
  .kpi-card.filtro-on { box-shadow: 0 0 0 2px currentColor inset; transform: translateY(-2px); }

  /* Data/hora de carregamento no card */
  .truck-driver { font-size: 9.5px; }
  .truck-load {
    font-size: 9px; color: var(--muted); margin-top: 3px;
    letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .truck-load.urgente { color: #f59e0b; font-weight: 700; }
</style>
</head>
<body>
<script>
// ══ ABERTURA DO APP SEMPRE NA CENTRAL ══════════════════════════
// O PWA restaura a última página aberta. Se o app foi iniciado
// direto neste módulo (sem ter vindo da Central), volta para ela.
// Navegação normal (clique na Central) e reload do Service Worker
// não são afetados.
(function(){
  try {
    var standalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;
    if (!standalone) return;                       // no navegador, link direto é válido

    var nav  = (performance.getEntriesByType('navigation') || [])[0];
    var tipo = nav ? nav.type : 'navigate';
    if (tipo === 'reload' || tipo === 'back_forward') return;   // recarregou/voltou: fica

    var veioDeDentro = document.referrer &&
                       document.referrer.indexOf(location.origin) === 0;
    if (!veioDeDentro) location.replace('index.html');
  } catch(e){}
})();
</script>


<!-- HEADER -->
<div class="header">
  <a class="header-back" onclick="history.back()">←</a>
  <div class="header-title">
    <h1>Status Logístico</h1>
    <p>Atualizado em tempo real</p>
  </div>
  <div class="header-badge">
    <span class="dot"></span>
    <span id="liveLabel">ONLINE</span>
  </div>
</div>

<!-- STATUS CARREGAMENTO -->
<div id="loadingState" style="text-align:center;padding:40px 20px;color:var(--muted)">
  <div style="font-size:32px;margin-bottom:12px">⏳</div>
  <p id="loadingMsg">Carregando dados da frota...</p>
</div>

<!-- KPIs -->
<div class="kpi-grid" id="kpiGrid" style="display:none">
  <div class="kpi-card kpi-viagem" data-fstatus="viagem" onclick="toggleStatus('viagem')">
    <div class="kpi-number" id="kpiViagem">0</div>
    <div class="kpi-label">Em Viagem</div>
  </div>
  <div class="kpi-card kpi-desc" data-fstatus="desc" onclick="toggleStatus('desc')">
    <div class="kpi-number" id="kpiDesc">0</div>
    <div class="kpi-label">Descarregando</div>
  </div>
  <div class="kpi-card kpi-retorno" data-fstatus="retorno" onclick="toggleStatus('retorno')">
    <div class="kpi-number" id="kpiRetorno">0</div>
    <div class="kpi-label">Retorno</div>
  </div>
  <div class="kpi-card kpi-garagem" data-fstatus="garagem" onclick="toggleStatus('garagem')">
    <div class="kpi-number" id="kpiGaragem">0</div>
    <div class="kpi-label">Na Garagem</div>
  </div>
</div>

<!-- BARRA DE FILTROS -->
<div class="filtros" id="filtros" style="display:none">
  <input id="busca" class="f-busca" type="search" placeholder="🔍 Buscar frota, placa, motorista, rota, cliente…" oninput="renderDashboard()">

  <div class="f-linha">
    <select id="ordem" class="f-select" onchange="salvarPrefs();renderDashboard()">
      <option value="carregamento">⏱️ Ordenar: Carregamento</option>
      <option value="frota">🚛 Ordenar: Nº de frota</option>
      <option value="manutencao">🔧 Ordenar: Manutenção</option>
      <option value="rota">🗺️ Ordenar: Rota</option>
      <option value="cliente">🏭 Ordenar: Cliente</option>
      <option value="motorista">👤 Ordenar: Motorista</option>
    </select>
    <div class="f-chip" id="chipManut" onclick="toggleManut()">🔧 Só c/ manutenção</div>
  </div>

  <div class="f-ativo" id="filtroAtivo" style="display:none">
    <span id="filtroAtivoTxt"></span>
    <button onclick="limparFiltros()">✕ Limpar</button>
  </div>
</div>

<!-- SECTIONS -->
<div class="sections" id="sections">
  <div class="empty-state" id="emptyState">
    <div class="big-icon">🚛</div>
    <h3>Nenhuma frota carregada</h3>
    <p>Carregue a planilha TWM_Frota_Status<br>para visualizar o painel em tempo real.</p>
  </div>
</div>

<div class="timestamp" id="timestamp"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">
      <div class="modal-icon" id="modalIcon"></div>
      <div>
        <h2 id="modalPlate"></h2>
        <p id="modalDriver"></p>
      </div>
    </div>
    <div id="modalBadge"></div>
    <div class="modal-rows" id="modalRows"></div>
    <button class="modal-close" onclick="closeModal()">Fechar</button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
const FROTA_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQx62CxMqSchj3wdG83U48YiyM8eH9vIj8Jv7Gg1QVWm0Ow7abDlyYWtAEecM4iCPWTvH8e5Y84jJdf/pub?gid=644783428&single=true&output=csv&_=' + Date.now();
const REFRESH_MS = 2 * 60 * 1000; // 2 minutos

// ── STATUS MAPPING ──────────────────────────────────────────────
const STATUS_MAP = {
  // Valores exatos usados pela equipe TWM
  'A CAMINHO DA ENTREGA': 'viagem',
  'A CAMINHO':            'viagem',
  'EM VIAGEM':            'viagem',
  'VIAGEM':               'viagem',
  'CARREGADO':            'viagem',
  'PROGRAMADO':           'viagem',
  'DESCARREGANDO':        'desc',
  'DESCARREG':            'desc',
  'DESCARGA':             'desc',
  'VOLTANDO DA ENTREGA':  'retorno',
  'VOLTANDO':             'retorno',
  'RETORNO':              'retorno',
  'RETORNANDO':           'retorno',
  'NA GARAGEM':           'garagem',
  'GARAGEM':              'garagem',
  'DISPONIVEL':           'garagem',
  'DISPONÍVEL':           'garagem',
};

const STATUS_META = {
  viagem:  { label:'EM VIAGEM',    color:'var(--purple-lt)', icon:'🚛', iconClass:'icon-viagem',  dotClass:'dot-viagem',  badgeClass:'badge-viagem' },
  desc:    { label:'DESCARREGANDO',color:'var(--orange)',    icon:'📦', iconClass:'icon-desc',    dotClass:'dot-desc',    badgeClass:'badge-desc' },
  retorno: { label:'RETORNO',      color:'var(--green)',     icon:'🔄', iconClass:'icon-retorno', dotClass:'dot-retorno', badgeClass:'badge-retorno' },
  garagem: { label:'NA GARAGEM',   color:'var(--gray)',      icon:'🏠', iconClass:'icon-garagem', dotClass:'dot-garagem', badgeClass:'badge-garagem' },
};

// ── STATE ──────────────────────────────────────────────────────
var fleetData   = [];
var manutOS     = {};   // { frota: [os, ...] }
var pendencias  = {};   // { frota: [pend, ...] }
var placaParaVP = {};   // { 'RML0I14': 'VP183' }  → normalizado, p/ cruzar alertas
var placaParaVPLabel = {}; // { 'RML0I14': 'VP-183' } → formatado, p/ exibir no card
var vpCarretas = {};       // { 'V183': ['RB-175','RB-176'] } carretas do conjunto

// ── STATUS RESOLVER ────────────────────────────────────────────
function resolveStatus(raw) {
  if (!raw) return 'garagem';
  const s = String(raw).trim().toUpperCase();
  if (STATUS_MAP[s]) return STATUS_MAP[s];
  for (const k of Object.keys(STATUS_MAP)) {
    if (s.includes(k)) return STATUS_MAP[k];
  }
  return 'garagem';
}

function shortName(full) {
  if (!full) return '—';
  const parts = full.trim().split(/[/,\s]+/);
  return parts[0] || full;
}

// ── DATA/HORA DE CARREGAMENTO ─────────────────────────────────
// A planilha traz "02/06/2026 01:00". Se a coluna CARREGAMENTO
// estiver vazia, cai para AGENDAMENTO (o horário agendado p/ carregar).
function parseDataHora(s) {
  if (!s) return 0;
  var t = String(s).trim();
  var m = t.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[\s,]+(\d{1,2}):(\d{2}))?/);
  if (m) {
    var ano = m[3].length === 2 ? 2000 + parseInt(m[3],10) : parseInt(m[3],10);
    return new Date(ano, parseInt(m[2],10)-1, parseInt(m[1],10),
                    parseInt(m[4]||'0',10), parseInt(m[5]||'0',10)).getTime();
  }
  var d = Date.parse(t);
  return isNaN(d) ? 0 : d;
}

// Compacto p/ caber no card: "02/06 · 01:00"
function fmtCarregamento(s) {
  var t = parseDataHora(s);
  if (!t) return '';
  var d = new Date(t);
  function z(n){ return (n < 10 ? '0' : '') + n; }
  return z(d.getDate()) + '/' + z(d.getMonth()+1) + ' · ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

// ── ESTADO DOS FILTROS ────────────────────────────────────────

// ── CSV PARSER ─────────────────────────────────────────────────
function parseCsv(txt) {
  var rows = [];
  var lines = txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  var headers = [];
  for (var li = 0; li < lines.length; li++) {
    var line = lines[li]; if (!line.trim()) continue;
    var cols = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    if (li === 0) { headers = cols; continue; }
    if (!cols[7] && !cols[11]) continue;
    var obj = {};
    headers.forEach(function(h, idx) { obj[h] = cols[idx] || ''; });
    rows.push(obj);
  }
  return rows;
}

// URL base do Apps Script (checklist/manutenção/pendências)
var SCRIPT_BASE = 'https://script.google.com/macros/s/AKfycbwAGLjEDNVAJk9nGujpVd6hTl3QY9Ss9Wl0Sm14TqCHBhdAFEPglhcXSzoN7ktSQjoa/exec';

// Escapa HTML (descrições vêm da planilha, podem ter < > &)
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

// Normaliza chave de frota: "VP-183" / "vp 183" / "VP183" → "VP183"
function chaveFrota(v) {
  return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

// ── CHAVE FLEXÍVEL DE VEÍCULO ─────────────────────────────────
// Identificadores da TWM:
//   Cavalos  → VP (próprio) · VPL (alugado) · VA (terceirizado)
//   Carretas → RB (própria) · RBL (alugada) · RA (terceirizada)
// O NÚMERO é o que identifica o veículo de verdade; o prefixo varia
// conforme quem cadastra (o encarregado costuma abrir a OS como
// "VP-313" mesmo quando na planilha está "VPL-313" — é o mesmo caminhão).
// Por isso a chave de cruzamento é TIPO (V=cavalo / R=carreta) + NÚMERO.
//   VP-313 · VPL-313 · VA-313  → "V313"
//   RB-175 · RBL-175 · RA-175  → "R175"
function chaveFlex(v) {
  var s = chaveFrota(v);                  // VPL313
  var m = s.match(/^([A-Z]+)0*(\d+)$/);   // prefixo + número (sem zeros à esquerda)
  if (!m) return s;
  var p = m[1].charAt(0);
  var tipo = (p === 'R') ? 'R' : (p === 'V' ? 'V' : p);
  return tipo + m[2];
}

// Separa "RB-175 / RB-176" em ['RB-175','RB-176']
function listaCarretas(txt) {
  return String(txt || '')
    .split(/[\/,;+]/)
    .map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length > 0; });
}

// Uma OS conta como "aberta" se NÃO estiver concluída/cancelada.
// (O status na planilha varia: "aberta", "Aberta", "em_andamento"...
//  comparar exato com 'aberta' fazia OS sumirem.)
function osEstaAberta(st) {
  var s = String(st || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (!s) return true;
  if (s.indexOf('conclu')  >= 0) return false;
  if (s.indexOf('finaliz') >= 0) return false;
  if (s.indexOf('cancel')  >= 0) return false;
  if (s.indexOf('fechad')  >= 0) return false;
  return true;
}

// ── CARREGAR MAPEAMENTO PLACA → FROTA + CARRETAS ──────────────
function carregarMapeamentoFrota() {
  return fetch(SCRIPT_BASE + '?action=getFrotasChecklist&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res) {
      placaParaVP = {};
      placaParaVPLabel = {};
      vpCarretas = {};
      if (res.ok && Array.isArray(res.frotas)) {
        res.frotas.forEach(function(f) {
          if (!f.vp) return;
          if (f.placa) {
            var kp = chaveFrota(f.placa);
            placaParaVP[kp]      = chaveFlex(f.vp);     // V183  → cruzar alertas
            placaParaVPLabel[kp] = String(f.vp).trim(); // VP-183 → exibir no card
          }
          // Carretas acopladas a este cavalo (coluna F da aba FROTA)
          var cs = listaCarretas(f.carreta);
          if (cs.length) vpCarretas[chaveFlex(f.vp)] = cs;
        });
      }
    }).catch(function(){});
}

// Nº de frota para exibir (VP-183). Se o caminhão não estiver
// cadastrado na planilha FROTA, mostra a placa como fallback.
function frotaLabel(placa) {
  return placaParaVPLabel[chaveFrota(placa)] || placa || '—';
}

// ── CARREGAR OS DE MANUTENÇÃO ──────────────────────────────────
function carregarManutencao() {
  return fetch(SCRIPT_BASE + '?action=getManutencoes&status=all&_=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(res) {
      manutOS = {};
      if (res.ok && Array.isArray(res.ordens)) {
        res.ordens.forEach(function(os) {
          if (!osEstaAberta(os.status)) return;
          var k = chaveFlex(os.frota);   // aceita VP-313 e VPL-313 como o mesmo
          if (!k) return;
          if (!manutOS[k]) manutOS[k] = [];
          manutOS[k].push(os);
        });
      }
    }).catch(function(){});
}

// ── CARREGAR PENDÊNCIAS ────────────────────────────────────────
function carregarPendencias() {
  return fetch(SCRIPT_BASE + '?action=getPendencias&_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(res) {
      pendencias = {};
      if (res.ok && Array.isArray(res.pendencias)) {
        res.pendencias.forEach(function(p) {
          var k = chaveFlex(p.frota);
          if (!k) return;
          if (!pendencias[k]) pendencias[k] = [];
          pendencias[k].push(p);
        });
      }
    }).catch(function(){});
}

// ── VERIFICAR ALERTAS (cavalo + carretas) ─────────────────────
// O card mostra a PLACA, mas as OS são cadastradas pelo Nº DE FROTA.
// Um conjunto tem cavalo (VP/VPL/VA) e carreta(s) (RB/RBL/RA) — a OS
// pode estar em qualquer um deles, então checa todos e marca a origem.
function getAlertas(v) {
  var placa = (typeof v === 'string') ? v : (v && v.cavalo) || '';
  var vpLabel = placaParaVPLabel[chaveFrota(placa)] || '';

  // Monta a lista de veículos do conjunto
  var alvos = [];
  function addAlvo(label, tipo) {
    if (!label) return;
    var ch = chaveFlex(label);
    if (!ch) return;
    for (var i = 0; i < alvos.length; i++) if (alvos[i].chave === ch) return; // já existe
    alvos.push({ label: String(label).trim(), chave: ch, tipo: tipo });
  }

  addAlvo(vpLabel, 'cavalo');

  // Carretas do cadastro (aba FROTA, coluna CARRETA)
  if (vpLabel) {
    (vpCarretas[chaveFlex(vpLabel)] || []).forEach(function(c){ addAlvo(c, 'carreta'); });
  }
  // Carretas informadas na própria planilha logística
  if (typeof v === 'object' && v) {
    listaCarretas(v.carreta1).forEach(function(c){ addAlvo(c, 'carreta'); });
    listaCarretas(v.carreta2).forEach(function(c){ addAlvo(c, 'carreta'); });
  }

  var os = [], pends = [];
  alvos.forEach(function(a) {
    (manutOS[a.chave] || []).forEach(function(o) {
      var copia = {};
      for (var kk in o) copia[kk] = o[kk];
      copia._orig = a.label; copia._tipo = a.tipo;
      os.push(copia);
    });
    (pendencias[a.chave] || []).forEach(function(p) {
      var copia = {};
      for (var kk in p) copia[kk] = p[kk];
      copia._orig = a.label; copia._tipo = a.tipo;
      pends.push(copia);
    });
  });

  return { os: os, pends: pends, alvos: alvos };
}

// ── CARREGAR FROTA (CSV da planilha logística) ────────────────
function carregarFrota() {
  var url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQx62CxMqSchj3wdG83U48YiyM8eH9vIj8Jv7Gg1QVWm0Ow7abDlyYWtAEecM4iCPWTvH8e5Y84jJdf/pub?gid=644783428&single=true&output=csv&_=' + Date.now();

  return fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(txt) {
      var raw = parseCsv(txt);
      fleetData = raw.map(function(r) {
        return {
          status:    resolveStatus(r['STATUS']),
          cavalo:    String(r['CAVALO/BI-TRI'] || r['CAVALO'] || '').trim().toUpperCase() || 'SEM PLACA',
          motorista: String(r['MOTORISTA'] || '').trim(),
          rota:      String(r['ROTA'] || '').trim(),
          cliente:   String(r['CLIENTE RECEBEDOR'] || '').trim(),
          material:  String(r['DESC. MATERIAL'] || '').trim(),
          qt:        r['QT DA ORDEM'] || '',
          carreta1:  String(r['CARRETA 1'] || '').trim(),
          carreta2:  String(r['CARRETA 2'] || '').trim(),
          agend:     r['AGENDAMENTO'] || '',
          // Carregamento: usa a coluna própria; se vazia, cai p/ agendamento
          carreg:    r['CARREGAMENTO'] || r['AGENDAMENTO'] || '',
          raw:       r,
        };
      });
    })
    .catch(function(err) {
      var el = document.getElementById('loadingMsg');
      if (el) el.textContent = '❌ Erro ao carregar: ' + err.message + ' — verifique se a planilha está publicada.';
    });
}

// ── CARREGAR TUDO E SÓ ENTÃO RENDERIZAR ───────────────────────
// Antes, o mapa placa→VP chegava DEPOIS do render, então getAlertas()
// não conseguia converter a placa e nenhum alerta aparecia.
function carregarTudo() {
  var msg = document.getElementById('loadingMsg');
  if (msg) msg.textContent = 'Carregando dados da frota...';

  return Promise.all([
    carregarFrota(),
    carregarMapeamentoFrota(),
    carregarManutencao(),
    carregarPendencias()
  ]).then(function() {
    var ls = document.getElementById('loadingState');
    if (ls) ls.style.display = 'none';
    renderDashboard();
  });
}

// ── RENDER ──────────────────────────────────────────────────────
function renderDashboard() {
  _alertasCache = [];

  var busca = ((document.getElementById('busca') || {}).value || '')
                .trim().toLowerCase();
  var ordem = (document.getElementById('ordem') || {}).value || 'carregamento';

  // Alertas calculados uma vez por viagem (usado no filtro e na ordenação)
  var itens = fleetData.map(function(v) {
    var a = getAlertas(v);
    return { v: v, alertas: a, nAlertas: a.os.length + a.pends.length };
  });

  // KPIs sempre mostram o total geral (panorama da operação)
  var totais = { viagem:0, desc:0, retorno:0, garagem:0 };
  itens.forEach(function(it){ totais[it.v.status]++; });
  document.getElementById('kpiGrid').style.display  = 'grid';
  document.getElementById('filtros').style.display  = 'block';
  document.getElementById('kpiViagem').textContent  = totais.viagem;
  document.getElementById('kpiDesc').textContent    = totais.desc;
  document.getElementById('kpiRetorno').textContent = totais.retorno;
  document.getElementById('kpiGaragem').textContent = totais.garagem;

  // Destaque do KPI usado como filtro
  document.querySelectorAll('.kpi-card').forEach(function(el) {
    el.classList.toggle('filtro-on', el.getAttribute('data-fstatus') === filtroStatus);
  });
  var chip = document.getElementById('chipManut');
  if (chip) chip.classList.toggle('on', filtroManut);

  // ── FILTRAR ──
  var vis = itens.filter(function(it) {
    if (filtroStatus && it.v.status !== filtroStatus) return false;
    if (filtroManut  && !it.nAlertas) return false;
    if (busca) {
      var alvo = [
        frotaLabel(it.v.cavalo), it.v.cavalo, it.v.motorista,
        it.v.rota, it.v.cliente, it.v.material, it.v.carreta1, it.v.carreta2
      ].join(' ').toLowerCase();
      if (alvo.indexOf(busca) < 0) return false;
    }
    return true;
  });

  // ── ORDENAR ──
  function txt(s){ return String(s || '').toLowerCase(); }
  function numFrota(v){
    var m = chaveFlex(frotaLabel(v.cavalo)).match(/\d+/);
    return m ? parseInt(m[0],10) : 999999;
  }
  var sorters = {
    // Mais próximo de carregar primeiro (sem data vai pro fim)
    carregamento: function(a,b){
      var ta = parseDataHora(a.v.carreg) || Infinity;
      var tb = parseDataHora(b.v.carreg) || Infinity;
      return ta - tb;
    },
    frota:      function(a,b){ return numFrota(a.v) - numFrota(b.v); },
    manutencao: function(a,b){ return b.nAlertas - a.nAlertas; }, // com alerta primeiro
    rota:       function(a,b){ return txt(a.v.rota).localeCompare(txt(b.v.rota)); },
    cliente:    function(a,b){ return txt(a.v.cliente).localeCompare(txt(b.v.cliente)); },
    motorista:  function(a,b){ return txt(a.v.motorista).localeCompare(txt(b.v.motorista)); },
  };
  vis.sort(sorters[ordem] || sorters.carregamento);

  // ── AVISO DE FILTRO ATIVO ──
  var fa = document.getElementById('filtroAtivo');
  var desc = [];
  if (filtroStatus) desc.push(STATUS_META[filtroStatus].label);
  if (filtroManut)  desc.push('com manutenção');
  if (busca)        desc.push('"' + busca + '"');
  if (desc.length) {
    fa.style.display = 'flex';
    document.getElementById('filtroAtivoTxt').textContent =
      'Filtrando: ' + desc.join(' · ') + ' — ' + vis.length + ' de ' + itens.length;
  } else {
    fa.style.display = 'none';
  }

  // ── AGRUPAR POR STATUS (mantendo a ordem escolhida dentro do grupo) ──
  var groups = { viagem: [], desc: [], retorno: [], garagem: [] };
  vis.forEach(function(it){ groups[it.v.status].push(it); });

  var sections = document.getElementById('sections');
  sections.innerHTML = '';

  if (!vis.length) {
    sections.innerHTML = '<div class="empty-state"><div class="big-icon">🔍</div>'
      + '<h3>Nenhum caminhão encontrado</h3><p>Ajuste os filtros para ver mais resultados.</p></div>';
    document.getElementById('timestamp').textContent =
      'Última atualização: ' + new Date().toLocaleString('pt-BR');
    return;
  }

  ['viagem','desc','retorno','garagem'].forEach(function(key) {
    var list = groups[key];
    if (!list.length) return;
    var meta = STATUS_META[key];

    var sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = '<div class="section-header"><div class="section-label">'
      + '<span class="section-dot ' + meta.dotClass + '"></span>' + meta.label
      + '</div><span class="section-count">' + list.length + '</span></div>'
      + '<div class="truck-grid" id="grid-' + key + '"></div>';
    sections.appendChild(sec);

    var grid = sec.querySelector('#grid-' + key);
    list.forEach(function(it) {
      var v = it.v, alertas = it.alertas;
      var _idx = _alertasCache.length;
      _alertasCache.push(alertas);

      var alertHtml = '';
      if (alertas.os.length) {
        alertHtml += '<span class="alert-badge alert-os alert-badge-click" onclick="event.stopPropagation();abrirAlertaOS(' + _idx + ')" style="cursor:pointer">🔧 ' + alertas.os.length + ' OS</span>';
      }
      if (alertas.pends.length) {
        alertHtml += '<span class="alert-badge alert-pend alert-badge-click" onclick="event.stopPropagation();abrirAlertaPend(' + _idx + ')" style="cursor:pointer">⚠️ ' + alertas.pends.length + ' Pend.</span>';
      }

      // Carregamento: destaca em laranja se for nas próximas 6h
      var carreg = fmtCarregamento(v.carreg);
      var tC = parseDataHora(v.carreg);
      var urgente = tC && (tC - Date.now()) > 0 && (tC - Date.now()) < 6*3600*1000;

      var card = document.createElement('div');
      card.className = 'truck-card card-' + key;
      card.onclick = function() { openModal(v); };
      card.innerHTML = '<div class="truck-icon-wrap ' + meta.iconClass + '">' + meta.icon + '</div>'
        + '<div class="truck-plate">' + esc(frotaLabel(v.cavalo)) + '</div>'
        + '<div class="truck-driver">' + esc(shortName(v.motorista)) + '</div>'
        + (carreg ? '<div class="truck-load' + (urgente ? ' urgente' : '') + '">🕐 ' + carreg + '</div>' : '')
        + (alertHtml ? '<div class="truck-alerts">' + alertHtml + '</div>' : '');
      grid.appendChild(card);
    });
  });

  document.getElementById('timestamp').textContent =
    'Última atualização: ' + new Date().toLocaleString('pt-BR');
}

// ── MODAL ───────────────────────────────────────────────────────
function openModal(v) {
  const meta = STATUS_META[v.status];
  document.getElementById('modalIcon').className = 'modal-icon ' + meta.iconClass;
  document.getElementById('modalIcon').textContent = meta.icon;
  document.getElementById('modalPlate').textContent = frotaLabel(v.cavalo);
  document.getElementById('modalDriver').textContent = v.motorista || '—';

  document.getElementById('modalBadge').innerHTML = '<div class="modal-status-badge ' + meta.badgeClass + '"><span>⬤</span> ' + meta.label + '</div>';

  var alertas = getAlertas(v);
  var alertSection = '';
  if (alertas.os.length || alertas.pends.length) {

    // Agrupa por veículo de origem (VP-306, RB-125...) — a OS pode ser
    // do cavalo ou de uma das carretas do conjunto.
    var grupos = [];
    function grupo(label, tipo) {
      for (var i = 0; i < grupos.length; i++) if (grupos[i].label === label) return grupos[i];
      var g = { label: label, tipo: tipo, os: [], pends: [] };
      grupos.push(g);
      return g;
    }
    alertas.os.forEach(function(o){ grupo(o._orig, o._tipo).os.push(o); });
    alertas.pends.forEach(function(p){ grupo(p._orig, p._tipo).pends.push(p); });
    // Cavalo primeiro, carretas depois
    grupos.sort(function(a,b){ return (a.tipo === 'cavalo' ? 0 : 1) - (b.tipo === 'cavalo' ? 0 : 1); });

    alertSection = '<div style="margin:12px 0;padding:12px;background:rgba(239,68,68,.08);border-radius:12px;border:1px solid rgba(239,68,68,.2)">';
    alertSection += '<div style="font-weight:800;color:#ef4444;margin-bottom:10px;font-size:14px">'
      + '⚠️ Manutenção — ' + alertas.os.length + ' OS · ' + alertas.pends.length + ' pendência(s)</div>';

    grupos.forEach(function(g, gi) {
      var ehCavalo = g.tipo === 'cavalo';
      var cor  = ehCavalo ? '#AF52DE' : '#32ADE6';
      var tag  = ehCavalo ? 'CAVALO'  : 'CARRETA';

      alertSection += '<div style="' + (gi ? 'margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);' : '') + '">';
      alertSection += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
        + '<span style="font-weight:800;font-size:13px;color:' + cor + '">' + esc(g.label) + '</span>'
        + '<span style="font-size:9px;font-weight:700;letter-spacing:.5px;color:' + cor + ';background:' + cor + '22;padding:2px 6px;border-radius:6px">' + tag + '</span>'
        + '</div>';

      // OS — cada uma com TODOS os seus serviços
      g.os.forEach(function(os) {
        alertSection += '<div style="margin-bottom:8px">'
          + '<div style="font-size:11px;color:#ef4444;font-weight:700">🔧 ' + esc(os.id || 'OS')
          + (os.status ? ' <span style="color:var(--muted);font-weight:500">· ' + esc(os.status) + '</span>' : '')
          + '</div>';
        var svs = os.servicos || [];
        if (svs.length) {
          svs.forEach(function(sv) {
            var txt = sv.descricao || sv.tipo || '';
            if (!txt) return;
            alertSection += '<div style="font-size:12px;color:var(--text);padding-left:14px;margin-top:2px">• ' + esc(txt) + '</div>';
          });
        } else {
          alertSection += '<div style="font-size:12px;color:var(--muted);padding-left:14px">• (sem serviços detalhados)</div>';
        }
        alertSection += '</div>';
      });

      // Pendências do mesmo veículo
      g.pends.forEach(function(p) {
        alertSection += '<div style="font-size:12px;color:var(--text);margin-bottom:3px">'
          + '<span style="color:#f59e0b;font-weight:700">⚠️</span> ' + esc(p.descricao || p.tipo || 'Pendência')
          + (p.pend_nota || p.motivo ? '<span style="color:var(--muted)"> — ' + esc(p.pend_nota || p.motivo) + '</span>' : '')
          + '</div>';
      });

      alertSection += '</div>';
    });

    alertSection += '</div>';
  }

  const fmtDate = function(d) {
    if (!d) return '—';
    return String(d);
  };

  const rows = [
    ['Placa',       v.cavalo   || '—'],
    ['Rota',        v.rota     || '—'],
    ['Cliente',     v.cliente  || '—'],
    ['Material',    v.material || '—'],
    ['Quantidade',  v.qt ? Number(String(v.qt).replace(/[^\d.]/g,'')).toLocaleString('pt-BR') + ' L' : '—'],
    ['Carreta',     [v.carreta1, v.carreta2].filter(Boolean).join(' / ') || '—'],
    ['Carregamento',fmtCarregamento(v.carreg) || '—'],
    ['Agendamento', fmtDate(v.agend)],
  ];

  document.getElementById('modalRows').innerHTML = alertSection + rows.map(function(r) {
    return '<div class="modal-row"><label>' + r[0] + '</label><span>' + r[1] + '</span></div>';
  }).join('');

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}


// ── CACHE DE ALERTAS ────────────────────────────────────────────
var _alertasCache = [];

// ── MODAL DE ALERTAS ────────────────────────────────────────────
function abrirAlertaOS(idx) {
  var alertas = _alertasCache[idx];
  if (!alertas || !alertas.os.length) return;
  document.getElementById('alertModalTitle').textContent =
    '🔧 Ordens de Serviço em Aberto (' + alertas.os.length + ')';
  var html = '';
  alertas.os.forEach(function(os) {
    var ehCavalo = os._tipo === 'cavalo';
    var cor = ehCavalo ? '#AF52DE' : '#32ADE6';
    var tag = ehCavalo ? 'CAVALO' : 'CARRETA';
    var alvo = os._orig || os.frota || '';

    html += '<div class="alert-item" style="border-left:3px solid ' + cor + '">';
    html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
      + '<span style="font-weight:800;font-size:14px;color:' + cor + '">' + esc(alvo) + '</span>'
      + '<span style="font-size:9px;font-weight:700;letter-spacing:.5px;color:' + cor + ';background:' + cor + '22;padding:2px 6px;border-radius:6px">' + tag + '</span>'
      + '</div>';
    html += '<div class="alert-item-title" style="color:#ef4444">' + esc(os.id || 'OS') + '</div>';

    [['Status', os.status || '—'],
     ['Prioridade', os.prioridade || '—'],
     ['Motorista', os.motorista || '—'],
     ['Abertura', os.data || '—']
    ].forEach(function(r) {
      html += '<div class="alert-item-row"><span class="alert-item-label">' + r[0]
        + '</span><span class="alert-item-value">' + esc(r[1] || '—') + '</span></div>';
    });

    // TODOS os serviços da OS (antes só o primeiro aparecia)
    var svs = os.servicos || [];
    html += '<div class="alert-item-row" style="flex-direction:column;align-items:flex-start;gap:4px">'
      + '<span class="alert-item-label" style="margin-bottom:4px">Serviços (' + svs.length + ')</span>';
    if (svs.length) {
      svs.forEach(function(sv) {
        var txt = sv.descricao || sv.tipo || '';
        if (!txt) return;
        html += '<span style="font-size:12px;background:rgba(239,68,68,.1);padding:4px 8px;border-radius:6px;color:#ef4444;display:block;width:100%">• ' + esc(txt) + '</span>';
      });
    } else {
      html += '<span style="font-size:12px;color:var(--muted)">(sem serviços detalhados)</span>';
    }
    html += '</div></div>';
  });
  document.getElementById('alertModalBody').innerHTML = html;
  document.getElementById('alertModal').style.display = 'flex';
}

function abrirAlertaPend(idx) {
  var alertas = _alertasCache[idx];
  if (!alertas || !alertas.pends.length) return;
  document.getElementById('alertModalTitle').textContent =
    '⚠️ Pendências de Manutenção (' + alertas.pends.length + ')';
  var html = '';
  alertas.pends.forEach(function(p) {
    var ehCavalo = p._tipo === 'cavalo';
    var cor = ehCavalo ? '#AF52DE' : '#32ADE6';
    var tag = ehCavalo ? 'CAVALO' : 'CARRETA';
    var alvo = p._orig || p.frota || '';

    html += '<div class="alert-item" style="border-left:3px solid ' + cor + '">';
    html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
      + '<span style="font-weight:800;font-size:14px;color:' + cor + '">' + esc(alvo) + '</span>'
      + '<span style="font-size:9px;font-weight:700;letter-spacing:.5px;color:' + cor + ';background:' + cor + '22;padding:2px 6px;border-radius:6px">' + tag + '</span>'
      + '</div>';
    html += '<div class="alert-item-title" style="color:#f59e0b">' + esc(p.tipo || p.servico || 'Pendência') + '</div>';

    [['Descrição', p.descricao || '—'],
     ['Motivo',    p.pend_nota || p.motivo || '—'],
     ['Mecânico',  p.mecanico  || '—'],
     ['Data',      p.data_pend || p.data || '—']
    ].forEach(function(r) {
      if (!r[1] || r[1] === '—') return;
      html += '<div class="alert-item-row"><span class="alert-item-label">' + r[0]
        + '</span><span class="alert-item-value">' + esc(r[1]) + '</span></div>';
    });
    html += '</div>';
  });
  document.getElementById('alertModalBody').innerHTML = html;
  document.getElementById('alertModal').style.display = 'flex';
}

function fecharAlertaModal(e) {
  if (!e || e.target === document.getElementById('alertModal')) {
    document.getElementById('alertModal').style.display = 'none';
  }
}

// ── INIT & AUTO-REFRESH ────────────────────────────────────────
carregarPrefs();   // restaura filtro/ordenação escolhidos antes
carregarTudo();
setInterval(carregarTudo, 120000);

// Atualiza também ao voltar para o app (ex: depois de criar uma OS)
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) carregarTudo();
});
</script>

<!-- ══ ALERT MODAL ══════════════════════════════════════════════ -->
<div class="modal-overlay" id="alertModal" onclick="fecharAlertaModal(event)" style="display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);align-items:flex-end">
  <div class="modal" onclick="event.stopPropagation()" style="background:var(--card);border-radius:18px 18px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:20px 20px calc(env(safe-area-inset-bottom)+24px)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:18px;font-weight:800;color:var(--text)" id="alertModalTitle">Detalhes</div>
      <button onclick="fecharAlertaModal()" style="background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--muted)">✕</button>
    </div>
    <div id="alertModalBody"></div>
  </div>
</div>

<script>
// ══ SERVICE WORKER + AUTO-ATUALIZAÇÃO SILENCIOSA ══
// Garante que o usuário SEMPRE tenha a versão mais recente,
// sem precisar limpar cache ou fechar o app.
if ('serviceWorker' in navigator) {
  var _swReloaded = false;

  // Quando um novo SW assume o controle, recarrega 1x automaticamente
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (_swReloaded) return;
    _swReloaded = true;
    window.location.reload();
  });

  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').then(function(reg) {
      // Força verificação de atualização toda vez que abre
      reg.update();

      // Se já existe um SW esperando, ativa na hora
      if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');

      // Detecta quando uma nova versão termina de baixar
      reg.addEventListener('updatefound', function() {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function() {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage('SKIP_WAITING'); // ativa → dispara controllerchange → reload
          }
        });
      });

      // Verifica atualização também quando o app volta ao foco
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) reg.update();
      });
    }).catch(function(){});
  });
}
</script>
