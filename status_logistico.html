<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Logístico — TWM Datalink</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg:        #0f0f1a;
    --surface:   #1a1a2e;
    --surface2:  #16213e;
    --border:    #2a2a4a;
    --text:      #e8e8f0;
    --muted:     #7070a0;
    --purple:    #7c3aed;
    --purple-lt: #a78bfa;
    --orange:    #f59e0b;
    --green:     #10b981;
    --gray:      #6b7280;

    --viagem-bg:    #2d1b6b;
    --viagem-icon:  #7c3aed;
    --desc-bg:      #3d2200;
    --desc-icon:    #f59e0b;
    --retorno-bg:   #0d3320;
    --retorno-icon: #10b981;
    --garagem-bg:   #1e1e2e;
    --garagem-icon: #6b7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 0 0 40px;
  }

  /* ── HEADER ─────────────────────────────────── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-back {
    width: 36px; height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    text-decoration: none;
  }
  .header-title h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .header-title p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  .header-badge {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--green);
  }
  .header-badge .dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  /* ── UPLOAD AREA ─────────────────────────────── */
  .upload-zone {
    margin: 16px 16px 0;
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .upload-zone:hover { border-color: var(--purple-lt); }
  .upload-zone.drag  { border-color: var(--purple); background: #1e1040; }
  .upload-icon {
    width: 44px; height: 44px;
    background: var(--viagem-bg);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .upload-text h3 { font-size: 14px; font-weight: 600; }
  .upload-text p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #fileInput { display: none; }

  /* ── KPI CARDS ───────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 16px 16px 0;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
  }
  .kpi-number {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .kpi-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
  }
  .kpi-viagem  .kpi-number { color: var(--purple-lt); }
  .kpi-desc    .kpi-number { color: var(--orange); }
  .kpi-retorno .kpi-number { color: var(--green); }
  .kpi-garagem .kpi-number { color: var(--gray); }

  /* ── SECTIONS ────────────────────────────────── */
  .sections { padding: 20px 16px 0; }

  .section { margin-bottom: 24px; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .section-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
  }
  .section-count {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }

  /* ── TRUCK GRID ──────────────────────────────── */
  .truck-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .truck-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    position: relative;
  }
  .truck-card:hover {
    border-color: var(--purple-lt);
    transform: translateY(-1px);
  }
  .truck-card:active { transform: scale(.97); }

  .truck-icon-wrap {
    width: 48px; height: 48px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 8px;
    font-size: 22px;
  }
  .truck-plate {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .truck-driver {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* icon colors per status */
  .icon-viagem  { background: var(--viagem-bg);  color: var(--viagem-icon); }
  .icon-desc    { background: var(--desc-bg);    color: var(--desc-icon); }
  .icon-retorno { background: var(--retorno-bg); color: var(--retorno-icon); }
  .icon-garagem { background: var(--garagem-bg); color: var(--garagem-icon); }

  .dot-viagem  { background: var(--purple-lt); }
  .dot-desc    { background: var(--orange); }
  .dot-retorno { background: var(--green); }
  .dot-garagem { background: var(--gray); }

  /* ── EMPTY / LOADING ─────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .empty-state p  { font-size: 13px; line-height: 1.5; }

  /* ── MODAL ───────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    width: 100%; max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    animation: slideUp .2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .modal-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .modal-title h2 { font-size: 20px; font-weight: 800; }
  .modal-title p  { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .modal-status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .badge-viagem  { background: var(--viagem-bg);  color: var(--purple-lt); }
  .badge-desc    { background: var(--desc-bg);    color: var(--orange); }
  .badge-retorno { background: var(--retorno-bg); color: var(--green); }
  .badge-garagem { background: var(--garagem-bg); color: var(--gray); }

  .modal-rows { display: flex; flex-direction: column; gap: 12px; }
  .modal-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .modal-row:last-child { border-bottom: none; }
  .modal-row label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .modal-row span  { font-size: 13px; font-weight: 600; text-align: right; max-width: 60%; }

  .modal-close {
    width: 100%; margin-top: 18px;
    padding: 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .modal-close:hover { border-color: var(--purple-lt); }

  /* ── TIMESTAMP ───────────────────────────────── */
  .timestamp {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-top: 12px;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <a class="header-back" onclick="history.back()">←</a>
  <div class="header-title">
    <h1>Status Logístico</h1>
    <p>Atualizado em tempo real</p>
  </div>
  <div class="header-badge">
    <span class="dot"></span>
    <span id="liveLabel">ONLINE</span>
  </div>
</div>

<!-- UPLOAD -->
<div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()"
     ondragover="event.preventDefault();this.classList.add('drag')"
     ondragleave="this.classList.remove('drag')"
     ondrop="handleDrop(event)">
  <div class="upload-icon">📊</div>
  <div class="upload-text">
    <h3>Carregar planilha da frota</h3>
    <p id="uploadHint">Selecione ou arraste o arquivo .xlsx / .xlsm</p>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls,.csv" onchange="handleFile(this.files[0])">
</div>

<!-- KPIs -->
<div class="kpi-grid" id="kpiGrid" style="display:none">
  <div class="kpi-card kpi-viagem">
    <div class="kpi-number" id="kpiViagem">0</div>
    <div class="kpi-label">Em Viagem</div>
  </div>
  <div class="kpi-card kpi-desc">
    <div class="kpi-number" id="kpiDesc">0</div>
    <div class="kpi-label">Descarregando</div>
  </div>
  <div class="kpi-card kpi-retorno">
    <div class="kpi-number" id="kpiRetorno">0</div>
    <div class="kpi-label">Retorno</div>
  </div>
  <div class="kpi-card kpi-garagem">
    <div class="kpi-number" id="kpiGaragem">0</div>
    <div class="kpi-label">Na Garagem</div>
  </div>
</div>

<!-- SECTIONS -->
<div class="sections" id="sections">
  <div class="empty-state" id="emptyState">
    <div class="big-icon">🚛</div>
    <h3>Nenhuma frota carregada</h3>
    <p>Carregue a planilha TWM_Frota_Status<br>para visualizar o painel em tempo real.</p>
  </div>
</div>

<div class="timestamp" id="timestamp"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">
      <div class="modal-icon" id="modalIcon"></div>
      <div>
        <h2 id="modalPlate"></h2>
        <p id="modalDriver"></p>
      </div>
    </div>
    <div id="modalBadge"></div>
    <div class="modal-rows" id="modalRows"></div>
    <button class="modal-close" onclick="closeModal()">Fechar</button>
  </div>
</div>

<script>
// ── STATUS MAPPING ──────────────────────────────────────────────
// Maps values from column STATUS (and keywords) to display buckets
const STATUS_MAP = {
  'EM VIAGEM':    'viagem',
  'VIAGEM':       'viagem',
  'CARREGADO':    'viagem',
  'PROGRAMADO':   'viagem',     // default fallback for loaded orders
  'DESCARREGANDO':'desc',
  'DESCARREG':    'desc',
  'DESCARGA':     'desc',
  'RETORNO':      'retorno',
  'RETORNANDO':   'retorno',
  'GARAGEM':      'garagem',
  'NA GARAGEM':   'garagem',
  'MANUTENÇÃO':   'garagem',
  'MANUTENCAO':   'garagem',
  'PARADO':       'garagem',
};

const STATUS_META = {
  viagem:  { label:'EM VIAGEM',    color:'var(--purple-lt)', icon:'🚛', iconClass:'icon-viagem',  dotClass:'dot-viagem',  badgeClass:'badge-viagem' },
  desc:    { label:'DESCARREGANDO',color:'var(--orange)',    icon:'📦', iconClass:'icon-desc',    dotClass:'dot-desc',    badgeClass:'badge-desc' },
  retorno: { label:'RETORNO',      color:'var(--green)',     icon:'🔄', iconClass:'icon-retorno', dotClass:'dot-retorno', badgeClass:'badge-retorno' },
  garagem: { label:'NA GARAGEM',   color:'var(--gray)',      icon:'🏠', iconClass:'icon-garagem', dotClass:'dot-garagem', badgeClass:'badge-garagem' },
};

// ── PARSE STATUS ────────────────────────────────────────────────
function resolveStatus(raw) {
  if (!raw) return 'garagem';
  const s = String(raw).toUpperCase().trim();
  if (STATUS_MAP[s]) return STATUS_MAP[s];
  for (const [key, val] of Object.entries(STATUS_MAP)) {
    if (s.includes(key)) return val;
  }
  return 'viagem'; // default to "em viagem" for active orders
}

// ── PARSE DRIVER (short first name) ────────────────────────────
function shortName(full) {
  if (!full) return '—';
  const name = String(full).trim();
  // "GERRY/ FILIPE OLIVEIRA" → first token
  const first = name.split(/[\/\s]/)[0];
  return first.charAt(0) + first.slice(1).toLowerCase();
}

// ── LOAD XLSX ───────────────────────────────────────────────────
let fleetData = [];

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
}

function handleFile(file) {
  if (!file) return;
  const hint = document.getElementById('uploadHint');
  hint.textContent = `Carregando ${file.name}…`;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      // Try "Frota" sheet first, then first sheet
      const sheetName = wb.SheetNames.includes('Frota') ? 'Frota' : wb.SheetNames[0];
      const ws  = wb.Sheets[sheetName];
      const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });

      // Normalize column names
      fleetData = raw
        .filter(r => r['CAVALO/BI-TRI'] || r['MOTORISTA'])
        .map(r => ({
          status:    resolveStatus(r['STATUS']),
          cavalo:    String(r['CAVALO/BI-TRI'] || '').trim().toUpperCase() || 'SEM PLACA',
          motorista: String(r['MOTORISTA']      || '').trim(),
          rota:      String(r['ROTA']           || '').trim(),
          cliente:   String(r['CLIENTE RECEBEDOR'] || '').trim(),
          material:  String(r['DESC. MATERIAL']    || '').trim(),
          qt:        r['QT DA ORDEM'] || '',
          carreta1:  String(r['CARRETA 1'] || '').trim(),
          agend:     r['AGENDAMENTO'] || '',
          raw:       r,
        }));

      hint.textContent = `✅ ${file.name} — ${fleetData.length} viagens`;
      renderDashboard();
    } catch(err) {
      hint.textContent = `❌ Erro ao ler o arquivo: ${err.message}`;
    }
  };
  reader.readAsArrayBuffer(file);
}

// ── RENDER ──────────────────────────────────────────────────────
function renderDashboard() {
  const groups = { viagem: [], desc: [], retorno: [], garagem: [] };
  fleetData.forEach(v => groups[v.status].push(v));

  // KPIs
  document.getElementById('kpiGrid').style.display = 'grid';
  document.getElementById('kpiViagem').textContent  = groups.viagem.length;
  document.getElementById('kpiDesc').textContent    = groups.desc.length;
  document.getElementById('kpiRetorno').textContent = groups.retorno.length;
  document.getElementById('kpiGaragem').textContent = groups.garagem.length;

  // Sections
  const sections = document.getElementById('sections');
  sections.innerHTML = '';

  const order = ['viagem','desc','retorno','garagem'];
  order.forEach(key => {
    const list = groups[key];
    if (!list.length) return;
    const meta = STATUS_META[key];

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `
      <div class="section-header">
        <div class="section-label">
          <span class="section-dot ${meta.dotClass}"></span>
          ${meta.label}
        </div>
        <span class="section-count">${list.length}</span>
      </div>
      <div class="truck-grid" id="grid-${key}"></div>
    `;
    sections.appendChild(sec);

    const grid = sec.querySelector(`#grid-${key}`);
    list.forEach(v => {
      const card = document.createElement('div');
      card.className = 'truck-card';
      card.onclick = () => openModal(v);
      card.innerHTML = `
        <div class="truck-icon-wrap ${meta.iconClass}">${meta.icon}</div>
        <div class="truck-plate">${v.cavalo}</div>
        <div class="truck-driver">${shortName(v.motorista)}</div>
      `;
      grid.appendChild(card);
    });
  });

  // Timestamp
  const now = new Date();
  document.getElementById('timestamp').textContent =
    `Última atualização: ${now.toLocaleString('pt-BR')}`;
}

// ── MODAL ───────────────────────────────────────────────────────
function openModal(v) {
  const meta = STATUS_META[v.status];
  document.getElementById('modalIcon').className = `modal-icon ${meta.iconClass}`;
  document.getElementById('modalIcon').textContent = meta.icon;
  document.getElementById('modalPlate').textContent = v.cavalo;
  document.getElementById('modalDriver').textContent = v.motorista || '—';

  document.getElementById('modalBadge').innerHTML = `
    <div class="modal-status-badge ${meta.badgeClass}">
      <span>⬤</span> ${meta.label}
    </div>
  `;

  const fmtDate = (d) => {
    if (!d) return '—';
    if (d instanceof Date) return d.toLocaleString('pt-BR');
    return String(d);
  };

  const rows = [
    ['Rota',       v.rota     || '—'],
    ['Cliente',    v.cliente  || '—'],
    ['Material',   v.material || '—'],
    ['Quantidade', v.qt ? Number(v.qt).toLocaleString('pt-BR') + ' L' : '—'],
    ['Carreta',    v.carreta1 || '—'],
    ['Agendamento',fmtDate(v.agend)],
  ];

  document.getElementById('modalRows').innerHTML = rows.map(([label, val]) => `
    <div class="modal-row">
      <label>${label}</label>
      <span>${val}</span>
    </div>
  `).join('');

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

// ── AUTO-REFRESH ─────────────────────────────────────────────────
// Re-renders every 60s if data exists (for live file-watch integration)
setInterval(() => {
  if (fleetData.length) renderDashboard();
}, 60000);
</script>
</body>
</html>
