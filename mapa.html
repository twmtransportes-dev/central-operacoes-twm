<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TWM • Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- plugin de rotação do mapa (gesto de dois dedos) -->
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:#8E8E93;
    --brand:#7C3AED; --brand2:#0A84FF; --line:#E5E5EA;
    --ok:#30D158; --warn:#FF9F0A; --off:#8E8E93; --radius:16px;
    --sfont:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--sfont);background:var(--bg);color:var(--ink);position:fixed;inset:0;width:100%;
    display:flex;flex-direction:column}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;z-index:1000;flex:none}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  .brand h1{font-size:20px;letter-spacing:.5px}
  .back{color:var(--muted);text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px}
  .wrap{padding:16px;max-width:900px;margin:0 auto}
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;color:var(--brand2);letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--brand2);color:#fff;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.ghost{background:#EFEFF4;color:var(--ink)}
  .btn.stop{background:#FF453A}
  .btn:active{opacity:.85}
  .btn+.btn{margin-top:10px}
  /* MAPA EM TELA CHEIA */
  #tab-frota{position:relative;flex:1;min-height:0;display:flex}
  #mapFull{position:relative;width:100%;flex:1;min-height:0}
  #map{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:pan-x pan-y;overscroll-behavior:none}

  /* status minúsculo e discreto no canto inferior esquerdo */
  #statusChip{position:absolute;bottom:8px;left:8px;z-index:1000;background:rgba(255,255,255,.85);border-radius:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.15);display:flex;align-items:center;gap:4px;padding:3px 7px;font-size:9px;font-weight:600;color:var(--muted);max-width:120px}
  #statusChip #meStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #statusChip .dot{width:6px;height:6px}

  /* LUPA: botão pequeno que expande */
  #searchBar{position:absolute;top:14px;right:14px;z-index:1001;background:#fff;border-radius:26px;
    box-shadow:0 2px 10px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;height:48px;
    transition:width .28s ease, padding .28s ease;overflow:hidden}
  #searchBar.collapsed{width:48px;padding:0;justify-content:center;cursor:pointer}
  #searchBar.expanded{width:calc(100vw - 28px);max-width:420px;padding:0 14px}
  #searchIcon{font-size:18px;opacity:.75;flex:none;cursor:pointer}
  #searchBar.collapsed #searchIcon{margin:0}
  #searchInput{flex:1;border:none;outline:none;font-size:15px;font-family:var(--sfont);background:transparent;color:var(--ink);min-width:0;width:0}
  #searchBar.collapsed #searchInput{display:none}
  #searchClear{font-size:15px;color:var(--muted);cursor:pointer;flex:none;display:none;padding:4px}
  #searchResults{position:absolute;top:68px;right:12px;left:12px;max-width:420px;margin-left:auto;z-index:1001;background:#fff;border-radius:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
  .sr-item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:10px}
  .sr-item:last-child{border-bottom:none}
  .sr-item:active{background:#F2F2F7}
  .sr-ic{font-size:16px;flex:none;width:22px;text-align:center}
  .sr-tx{flex:1;min-width:0}
  .sr-tx .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-tx .t2{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr-empty{padding:14px 16px;color:var(--muted);font-size:13px;text-align:center}

  /* BOTÃO E PAINEL DA FROTA (admin) */
  /* botão recentralizar (meu local) */
  #recenterBtn{position:absolute;right:14px;bottom:88px;z-index:1200;
    background:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.28);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
  #recenterBtn:active{background:#f0f0f0}
  #statusChip #cfgAbrir{cursor:pointer;font-size:10px;opacity:.75;padding-left:2px}
  /* modal de configuração do tablet */
  #cfgOverlay{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #cfgBox{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:380px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:90vh;overflow-y:auto}
  #cfgBox h3{font-size:17px;margin-bottom:6px;color:var(--ink)}
  #cfgBox .cfg-atual{font-size:13px;color:var(--ink);margin-bottom:2px}
  #cfgBox .cfg-hint{font-size:12px;color:var(--muted);margin-bottom:16px}
  #cfgBox label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px;letter-spacing:.4px}
  #cfgBox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:var(--sfont);background:#fff;color:var(--ink)}
  #cfgMsg{font-size:12px;color:#D70015;min-height:16px;margin-top:10px}
  .cfg-remover{width:100%;margin-top:12px;padding:11px;border:1px solid #FFD3D0;border-radius:12px;
    background:#FFF5F5;color:#D70015;font-size:14px;font-weight:600;cursor:pointer}
  .cfg-remover:active{background:#FFE8E6}
  .cfg-btns{display:flex;gap:10px;margin-top:14px}
  .cfg-btns button{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .cfg-cancel{background:#EFEFF4;color:var(--ink)}
  .cfg-ok{background:var(--brand2);color:#fff}
  /* CARTÃO DE DESTINO (estilo Google Maps) */
  #destCard{position:absolute;left:14px;right:14px;bottom:28px;z-index:1003;background:#fff;border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.28);padding:14px 16px;display:flex;align-items:center;gap:12px;max-width:460px;margin:0 auto}
  #destInfo{flex:1;min-width:0}
  #destTitulo{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  #destSub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #destBtns{display:flex;align-items:center;gap:8px;flex:none}
  #destNavegar{background:#0A84FF;color:#fff;border:none;border-radius:22px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
  #destNavegar:active{opacity:.85}
  #destFechar{background:#EFEFF4;color:var(--muted);border:none;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
  #fleetToggle{position:absolute;right:14px;bottom:24px;z-index:1200;
    background:var(--brand);color:#fff;border:none;
    border-radius:24px;padding:12px 18px;font-size:14px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.3);cursor:pointer}
  #fleetPanel{position:absolute;left:0;right:0;bottom:0;z-index:1002;background:#fff;border-radius:18px 18px 0 0;
    box-shadow:0 -4px 20px rgba(0,0,0,.25);max-height:60%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s ease}
  #fleetPanel.open{transform:translateY(0)}
  #fleetPanelHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;color:var(--brand2)}
  .fp-btn{background:#EFEFF4;border:none;border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer;margin-left:6px}
  #fleetPanel .fleet-list{overflow-y:auto;padding:12px 14px;min-height:120px}
  #fleetPanel .empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px;line-height:1.6}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.5px}
  .field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:var(--sfont)}
  .banner{padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
  .banner.warn{background:#FFF4E5;color:#8A5A00;border:1px solid #FFE0B2}
  .banner.info{background:#E8F1FF;color:#0A4A8A;border:1px solid #CCE0FF}
  .banner.live{background:#E9FBEF;color:#1B7A3D;border:1px solid #C3F0D2}
  .status-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
  .dot.live{background:var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
  .fleet-list{margin-top:12px}
  .fleet-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .fleet-item:active{background:#F7F7FA}
  .fleet-ava{width:40px;height:40px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
  .fleet-info{flex:1;min-width:0}
  .fleet-info .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fleet-info .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;flex:none}
  .badge.on{background:#E9FBEF;color:#1B7A3D}
  .badge.off{background:#F0F0F3;color:#8E8E93}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 16px;line-height:1.6}
  .hidden{display:none!important}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:5000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .count{font-size:12px;color:var(--muted);font-weight:600}
  .leaflet-container{font-family:var(--sfont)}
  /* atribuição do mapa: obrigatória por licença, mas bem discreta */
  .leaflet-control-attribution{background:rgba(255,255,255,.55)!important;font-size:7px!important;
    padding:0 4px!important;color:#9a9a9e!important;line-height:12px!important;border-radius:6px 0 0 0;
    margin:0!important;position:absolute;bottom:0;right:0}
  .leaflet-control-attribution a{color:#9a9a9e!important;text-decoration:none!important}
  .leaflet-control-attribution svg{display:none!important}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">TWM</div>
    <h1>MAPA</h1>
  </div>
  <a class="back" href="index.html">← CENTRAL</a>
</div>

<!-- ======================= MAPA ======================= -->
<div id="tab-frota">
  <div id="mapFull">
    <div id="map"></div>

    <!-- status compacto flutuante (canto superior esquerdo) -->
    <div id="statusChip">
      <span class="dot" id="meDot"></span>
      <span id="meStatus">iniciando</span>
      <span id="cfgAbrir" title="Configurar VP deste tablet">⚙️</span>
    </div>

    <!-- lupa: botão pequeno que expande ao tocar -->
    <div id="searchBar" class="collapsed">
      <span id="searchIcon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar VP, placa ou endereço" autocomplete="off">
      <span id="searchClear" title="Limpar">✕</span>
    </div>
    <div id="searchResults"></div>

    <!-- botão recentralizar no meu local -->
    <button id="recenterBtn" title="Meu local">🎯</button>

    <!-- cartão de destino (aparece ao escolher um local) -->
    <div id="destCard" class="hidden">
      <div id="destInfo">
        <div id="destTitulo"></div>
        <div id="destSub"></div>
      </div>
      <div id="destBtns">
        <button id="destNavegar">🧭 Navegar</button>
        <button id="destFechar">✕</button>
      </div>
    </div>

    <!-- botão da frota (só admin) abre painel deslizante -->
    <button id="fleetToggle" class="hidden">👥 <span id="fleetToggleCount"></span></button>

    <!-- painel deslizante da frota (admin) -->
    <div id="fleetPanel" class="hidden">
      <div id="fleetPanelHead">
        <span>👥 FROTA <span class="count" id="fleetCount"></span></span>
        <div>
          <button class="fp-btn" id="btnAtualizarFrota">🔄</button>
          <button class="fp-btn" id="fleetPanelClose">✕</button>
        </div>
      </div>
      <div class="fleet-list" id="fleetList"></div>
    </div>
    <div id="adminControls" class="hidden"></div>
  </div>
</div>

<!-- MODAL: configuração da VP deste tablet -->
<div id="cfgOverlay" class="hidden">
  <div id="cfgBox">
    <h3>🚛 VP deste tablet</h3>
    <p class="cfg-atual">Atual: <b id="cfgVpAtual">—</b></p>
    <p class="cfg-hint" id="cfgQuem"></p>

    <label>VP do caminhão</label>
    <input type="text" id="cfgFrota" list="listaFrotas" placeholder="Ex: VP-183" autocomplete="off">
    <datalist id="listaFrotas"></datalist>

    <div id="cfgMsg"></div>
    <button class="cfg-remover" id="cfgRemover">🗑️ Remover VP deste tablet</button>
    <div class="cfg-btns">
      <button class="cfg-cancel" id="cfgCancelar">Cancelar</button>
      <button class="cfg-ok" id="cfgSalvar">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
// MESMA URL do Web App da Jornada (que já grava a aba LOCALIZACAO)
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0wK7f3lJvahV8LvsKOwNN_iu9Txo7grisBi2SvLRdVzAIG4lVom_yxXw2rYhjZhEeTA/exec';

var ENVIO_INTERVALO_MS   = 30000;  // envia a cada 30s
var REFRESH_INTERVALO_MS = 30000;  // admin recarrega a cada 30s
var ONLINE_LIMITE_MIN    = 3;      // "online" se reportou nos últimos 3 min

/* ============================================================
   SESSÃO / PERMISSÕES  (mesmo padrão dos outros módulos)
   ============================================================ */
function _sessao(){
  try { return JSON.parse(localStorage.getItem('twm_sessao') || localStorage.getItem('twm_usuario') || '{}'); }
  catch(e){ return {}; }
}
function _perm(){
  try { return JSON.parse(localStorage.getItem('twm_permissoes') || '{}'); }
  catch(e){ return {}; }
}
function _isAdmin(){
  var p = _perm();
  return !!(p.admin || p.admin_master);
}
function _nomeUsuario(){
  var s = _sessao();
  return s.nome || s.usuario || s.motorista || s.name || 'Usuário';
}
/* A VP vem do APARELHO (tablet fixo no caminhão), configurada uma vez.
   É a fonte mais confiável: o tablet está no veículo, então se ele se move,
   aquele veículo se move — independente de quem está dirigindo. */
function _frotaUsuario(){
  var doTablet = (localStorage.getItem('twm_vp_tablet') || '').toString().toUpperCase();
  if(doTablet) return doTablet;
  var s = _sessao();
  return (s.frota || s.veiculo || localStorage.getItem('twm_frota') || '').toString().toUpperCase();
}
function _placaTablet(){
  return (localStorage.getItem('twm_placa_tablet') || '').toString().toUpperCase();
}
function _placaUsuario(){
  var pt = _placaTablet();
  if(pt) return pt;
  var s = _sessao();
  return (s.placa || s.placa_cav || localStorage.getItem('twm_placa') || '').toString().toUpperCase();
}

/* ============================================================
   UTILS
   ============================================================ */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function iniciais(nome){
  var p = (nome||'').trim().split(/\s+/);
  if(p.length===1) return (p[0]||'?').substring(0,2).toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}
function minutosDesde(iso){
  if(!iso) return 99999;
  var t = new Date(iso).getTime();
  if(isNaN(t)) return 99999;
  return (Date.now()-t)/60000;
}
function tempoRelativo(iso){
  var m = minutosDesde(iso);
  if(m<1) return 'agora mesmo';
  if(m<60) return Math.floor(m)+' min atrás';
  var h = Math.floor(m/60);
  if(h<24) return h+'h atrás';
  return Math.floor(h/24)+'d atrás';
}

/* ============================================================
   MAPA  (Leaflet com tiles estilo Google)
   ============================================================ */
var map, marcadores = {};
var frotaAtual = [];
var TILE_URL = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
var TILE_ATTR = '© OpenStreetMap © CARTO';
var CENTRO_PADRAO = [-19.9668, -44.1985]; // Betim/MG (ajuste se quiser)

function initMapaFrota(){
  if(map) return;
  map = L.map('map', {
    zoomControl:false,
    attributionControl:false,
    rotate:true,              // habilita rotação do mapa
    touchRotate:true,         // girar com dois dedos na tela
    rotateControl:false       // sem botão de bússola (só o gesto)
  }).setView(CENTRO_PADRAO, 12);
  L.control.attribution({prefix:false, position:'bottomright'}).addTo(map);
  L.tileLayer(TILE_URL, {attribution:TILE_ATTR, maxZoom:20, subdomains:'abcd'}).addTo(map);
  centralizarNoUsuario();
}

// Centraliza o mapa na posição atual do usuário (igual Google Maps ao abrir).
// Tenta GPS preciso; se falhar/demorar, aceita a posição APROXIMADA que o
// próprio navegador calcula por Wi-Fi e torres de celular (GSM).
var meMarker = null;
function centralizarNoUsuario(){
  if(!navigator.geolocation) return;

  function mostrar(pos, aproximada){
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    var acc = pos.coords.accuracy || 0;
    // zoom menor quando a posição é aproximada (torre/Wi-Fi)
    var zoom = acc > 300 ? 13 : 15;
    map.setView([lat,lng], zoom, {animate:true});
    if(meMarker) map.removeLayer(meMarker);
    meMarker = L.marker([lat,lng], {icon: iconeMeuPonto()}).addTo(map);
    meMarker.bindPopup('<b>Você está aqui</b>' + (aproximada ? '<br><small>posição aproximada (~'+Math.round(acc)+'m)</small>' : ''));
    setTimeout(function(){ map.invalidateSize(); }, 200);
  }

  // 1ª tentativa: GPS preciso
  navigator.geolocation.getCurrentPosition(function(pos){
    mostrar(pos, false);
  }, function(){
    // 2ª tentativa: posição APROXIMADA (Wi-Fi / torres de celular)
    navigator.geolocation.getCurrentPosition(function(pos){
      mostrar(pos, true);
    }, function(){
      // sem nenhuma fonte disponível — mantém o centro padrão, sem travar
    }, {enableHighAccuracy:false, timeout:12000, maximumAge:60000});
  }, {enableHighAccuracy:true, timeout:7000, maximumAge:15000});
}

// Ícone customizado (pin com iniciais) estilo rastreador
function iconePessoa(txt, online){
  var cor = online ? '#30D158' : '#8E8E93';
  var html =
    '<div style="position:relative;width:36px;height:44px">'+
      '<div style="width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);'+
        'background:'+cor+';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>'+
      '<div style="position:absolute;top:6px;left:0;width:36px;height:32px;display:flex;'+
        'align-items:center;justify-content:center;color:#fff;font-weight:800;'+
        'font-size:11px;font-family:var(--sfont)">'+txt+'</div>'+
    '</div>';
  return L.divIcon({html:html, className:'', iconSize:[36,44], iconAnchor:[18,44], popupAnchor:[0,-42]});
}

// Ponto azul estilo Google Maps para "minha posição"
function iconeMeuPonto(heading){
  // caminhãozinho que gira conforme a direção (heading em graus, 0=norte)
  var rot = (heading!=null && !isNaN(heading)) ? heading : 0;
  var html =
    '<div style="position:relative;width:44px;height:44px">'+
      '<div style="position:absolute;top:2px;left:2px;width:40px;height:40px;border-radius:50%;'+
        'background:rgba(66,133,244,.18)"></div>'+
      '<div style="position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;'+
        'background:#4285F4;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);'+
        'display:flex;align-items:center;justify-content:center;font-size:15px;'+
        'transform:rotate('+rot+'deg);transition:transform .3s ease">🚚</div>'+
    '</div>';
  return L.divIcon({html:html, className:'', iconSize:[44,44], iconAnchor:[22,22], popupAnchor:[0,-20]});
}

/* ============================================================
   ENVIO DA MINHA LOCALIZAÇÃO  (tempo real, a cada 30s)
   ============================================================ */
var watchId = null, envioTimer = null, ultimaPos = null, compartilhando = false;

function iniciarCompartilhamento(){
  if(!navigator.geolocation){
    document.getElementById('meStatus').textContent = 'GPS não suportado neste aparelho';
    return;
  }
  if(compartilhando) return;   // evita iniciar duas vezes
  compartilhando = true;
  document.getElementById('meDot').classList.add('live');
  document.getElementById('meStatus').textContent = 'iniciando';

  // watchPosition mantém a posição sempre atualizada.
  // enableHighAccuracy:false deixa o navegador usar GPS, Wi-Fi OU torre de
  // celular (o que estiver disponível) — não trava se o GPS estiver desligado.
  watchId = navigator.geolocation.watchPosition(function(pos){
    ultimaPos = {lat:pos.coords.latitude, lng:pos.coords.longitude, acc:pos.coords.accuracy};
    document.getElementById('meStatus').textContent = 'ao vivo';
    // move e gira o caminhãozinho no mapa
    if(map){
      var ll = [pos.coords.latitude, pos.coords.longitude];
      var head = pos.coords.heading; // graus (pode vir null se parado)
      if(!meMarker){
        meMarker = L.marker(ll, {icon: iconeMeuPonto(head)}).addTo(map);
      } else {
        meMarker.setLatLng(ll);
        if(head!=null && !isNaN(head)) meMarker.setIcon(iconeMeuPonto(head));
      }
    }
  }, function(err){
    if(err.code === 1){ // permissão negada
      document.getElementById('meDot').classList.remove('live');
      document.getElementById('meStatus').textContent = 'GPS bloqueado';
    } else {
      document.getElementById('meStatus').textContent = 'buscando GPS';
    }
  }, {enableHighAccuracy:true, maximumAge:15000, timeout:25000});

  // primeiro envio rápido + timer de 30s
  setTimeout(enviarMinhaPos, 3000);
  envioTimer = setInterval(enviarMinhaPos, ENVIO_INTERVALO_MS);
  localStorage.setItem('twm_compartilhar_loc', '1');
}

function pararCompartilhamento(silencioso){
  compartilhando = false;
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(envioTimer){ clearInterval(envioTimer); envioTimer=null; }
  document.getElementById('meDot').classList.remove('live');
  document.getElementById('meStatus').textContent = 'Compartilhamento desligado';
  localStorage.removeItem('twm_compartilhar_loc');
  if(!silencioso) toast('Compartilhamento parado');
}

function enviarMinhaPos(){
  if(!ultimaPos) return;
  var nome  = _nomeUsuario();
  var frota = _frotaUsuario();
  var params = new URLSearchParams({
    action:'salvarLocalizacao',
    nome: nome,
    frota: frota,
    placa: _placaUsuario(),
    lat: ultimaPos.lat,
    lng: ultimaPos.lng,
    precisao: Math.round(ultimaPos.acc||0),
    ts: new Date().toISOString()
  });
  // GET simples evita preflight CORS no Apps Script
  fetch(SCRIPT_URL+'?'+params.toString(), {method:'GET', cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(){ /* ok silencioso */ })
    .catch(function(){ /* rede instável — tenta no próximo ciclo */ });
}

/* ============================================================
   ADMIN: CARREGAR POSIÇÕES DA FROTA
   ============================================================ */
var refreshTimer = null;

function carregarFrota(){
  if(!_isAdmin()) return;
  fetch(SCRIPT_URL+'?action=getLocalizacoes&_t='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(res){
      var lista = (res && res.ok && res.localizacoes) ? res.localizacoes : [];
      renderFrota(lista);
    })
    .catch(function(){ toast('Falha ao carregar posições'); });
}

function renderFrota(lista){
  frotaAtual = lista || [];
  var box = document.getElementById('fleetList');
  var cnt = document.getElementById('fleetCount');
  box.innerHTML = '';

  // remove marcadores antigos
  Object.keys(marcadores).forEach(function(k){ map.removeLayer(marcadores[k]); });
  marcadores = {};

  if(!lista.length){
    box.innerHTML = '<div class="empty">Ninguém compartilhando localização no momento.<br><br>As posições aparecem automaticamente quando alguém abre o app com o GPS liberado.</div>';
    cnt.textContent = '';
    var tc0 = document.getElementById('fleetToggleCount');
    if(tc0) tc0.textContent = '0';
    return;
  }

  var online = 0;
  var bounds = [];
  lista.sort(function(a,b){ return minutosDesde(a.ts)-minutosDesde(b.ts); });

  lista.forEach(function(p){
    var lat = parseFloat(p.lat), lng = parseFloat(p.lng);
    if(isNaN(lat)||isNaN(lng)) return;
    var on = minutosDesde(p.ts) <= ONLINE_LIMITE_MIN;
    if(on) online++;

    // cruza com o cadastro (EQUIPAMENTOS) para mostrar placa/modelo corretos
    var cad = equipPorFrota[chaveFrota(p.frota)] || {};
    var placa = p.placa || cad.placa || '';
    var modelo = cad.modelo || '';

    var rotulo = (p.nome||'—') + (p.frota ? ' • '+p.frota : '');
    var chave = (p.nome||'')+'|'+(p.frota||'');

    // marcador no mapa
    var mk = L.marker([lat,lng], {icon: iconePessoa(iniciais(p.nome||p.frota||'?'), on)}).addTo(map);
    mk.bindPopup('<b>'+rotulo+'</b>'+
                 (placa?'<br>Placa: '+placa:'')+
                 (modelo?'<br>'+modelo:'')+
                 '<br>'+tempoRelativo(p.ts)+'<br>precisão ~'+(p.precisao||'?')+'m');
    marcadores[chave] = mk;
    bounds.push([lat,lng]);

    // item na lista
    var item = document.createElement('div');
    item.className = 'fleet-item';
    item.innerHTML =
      '<div class="fleet-ava">'+iniciais(p.nome||p.frota||'?')+'</div>'+
      '<div class="fleet-info">'+
        '<div class="nm">'+(p.nome||'Sem nome')+'</div>'+
        '<div class="sub">'+(p.frota?p.frota+' • ':'')+(placa?placa+' • ':'')+tempoRelativo(p.ts)+'</div>'+
      '</div>'+
      '<span class="badge '+(on?'on':'off')+'">'+(on?'ONLINE':'offline')+'</span>';
    item.onclick = function(){
      map.setView([lat,lng], 16, {animate:true});
      mk.openPopup();
      window.scrollTo({top:document.getElementById('map').offsetTop-80, behavior:'smooth'});
    };
    box.appendChild(item);
  });

  cnt.textContent = '('+online+' online / '+lista.length+' total)';
  var tc = document.getElementById('fleetToggleCount');
  if(tc) tc.textContent = String(online);
  // Só reenquadra se houver posições; senão mantém a centralização no usuário
  if(bounds.length){
    if(meMarker){ var ll = meMarker.getLatLng(); bounds.push([ll.lat, ll.lng]); }
    map.fitBounds(bounds, {padding:[40,40], maxZoom:15});
  }
}

/* ============================================================
   BUSCA (lupa): VP / RB / placa / nome (cadastro) + endereço
   ============================================================ */
var buscaTimer = null;
var equipamentos = [];      // cadastro completo da frota (aba EQUIPAMENTOS)
var equipPorFrota = {};     // índice frota->dados para cruzar rápido

function normaliza(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
// normaliza frota p/ comparação: VPL-185 -> VP-185, RBL-202 -> RB-202, tira espaços
function chaveFrota(f){
  return normaliza(f).replace(/\s+/g,'').replace(/^vpl/,'vp').replace(/^rbl/,'rb').replace('-','');
}

// carrega o cadastro da frota uma vez (fica em cache)
function carregarEquipamentos(){
  fetch(SCRIPT_URL+'?action=getEquipamentos&_t='+Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(res){
      equipamentos = (res && res.ok && res.equipamentos) ? res.equipamentos : [];
      equipPorFrota = {};
      equipamentos.forEach(function(e){ equipPorFrota[chaveFrota(e.frota)] = e; });
    })
    .catch(function(){ /* segue só com quem está reportando */ });
}

/* ============================================================
   CONFIGURAÇÃO DO TABLET (qual VP este aparelho representa)
   Só pode ser alterada com login e senha de administrador.
   ============================================================ */
function abrirConfigTablet(){
  var atual = _frotaUsuario();
  document.getElementById('cfgVpAtual').textContent = atual || '(não configurado)';
  document.getElementById('cfgFrota').value = atual;      // já vem preenchido
  document.getElementById('cfgMsg').textContent = '';

  // só admin ou administrativo master pode configurar
  var ehAdmin = _isAdmin();
  var quem = document.getElementById('cfgQuem');
  var frotaInput = document.getElementById('cfgFrota');
  var btnSalvar = document.getElementById('cfgSalvar');
  var btnRem = document.getElementById('cfgRemover');

  if(ehAdmin){
    var nome = _nomeUsuario();
    quem.textContent = '✓ Liberado para ' + (nome && nome !== 'Usuário' ? nome : 'administrador');
    quem.style.color = '#1B7A3D';
    frotaInput.disabled = false;
    btnSalvar.style.display = 'block';
    btnRem.style.display = atual ? 'block' : 'none';
  } else {
    quem.textContent = '🔒 Apenas administrador pode configurar a VP. Faça login como admin.';
    quem.style.color = '#D70015';
    frotaInput.disabled = true;
    btnSalvar.style.display = 'none';
    btnRem.style.display = 'none';
  }

  document.getElementById('cfgOverlay').classList.remove('hidden');
  montarListaFrotas();
}
function fecharConfigTablet(){
  document.getElementById('cfgOverlay').classList.add('hidden');
}
// preenche o datalist com as VPs do cadastro
function montarListaFrotas(){
  var dl = document.getElementById('listaFrotas');
  if(!dl) return;
  dl.innerHTML = '';
  equipamentos.forEach(function(e){
    if(!/^VP|^VA/.test(e.frota)) return;           // só cavalos
    var o = document.createElement('option');
    o.value = e.frota;
    o.label = (e.placa||'') + (e.modelo? ' • '+e.modelo : '');
    dl.appendChild(o);
  });
}
// valida no servidor (planilha MOTORISTAS) e salva a VP no aparelho
function salvarConfigTablet(){
  var frota = document.getElementById('cfgFrota').value.trim().toUpperCase();
  var msg   = document.getElementById('cfgMsg');

  if(!_isAdmin()){ msg.textContent = 'Apenas administrador pode configurar.'; return; }
  if(!frota){ msg.textContent = 'Escolha a VP deste caminhão.'; return; }

  localStorage.setItem('twm_vp_tablet', frota);
  var cad = equipPorFrota[chaveFrota(frota)];
  if(cad && cad.placa) localStorage.setItem('twm_placa_tablet', cad.placa);
  msg.textContent = '';
  fecharConfigTablet();
  toast('Tablet configurado como ' + frota);
  if(compartilhando) enviarMinhaPos();   // reenvia já com a VP certa
}


// remove a VP deste tablet (também exige admin)
function removerConfigTablet(){
  var msg = document.getElementById('cfgMsg');
  if(!_isAdmin()){ msg.textContent = 'Apenas administrador pode remover.'; return; }

  localStorage.removeItem('twm_vp_tablet');
  localStorage.removeItem('twm_placa_tablet');
  msg.textContent = '';
  fecharConfigTablet();
  toast('VP removida deste tablet');
  var st = document.getElementById('meStatus');
  if(st) st.textContent = 'sem VP';
  var chip = document.getElementById('statusChip');
  if(chip) chip.style.background = '#FFF4E5';
}

// posição reportada (se houver) para uma frota
function posicaoDaFrota(frota){
  var k = chaveFrota(frota);
  for(var i=0;i<frotaAtual.length;i++){
    if(chaveFrota(frotaAtual[i].frota)===k) return frotaAtual[i];
  }
  return null;
}

function buscarFrotaLocal(termo){
  var t = normaliza(termo);
  if(!t) return [];
  var vistos = {};
  var res = [];

  // 1) procura no CADASTRO completo (VP/RB/placa/modelo/motorista)
  equipamentos.forEach(function(e){
    var alvo = normaliza(e.frota)+' '+normaliza(e.placa)+' '+normaliza(e.modelo)+' '+normaliza(e.motorista);
    if(alvo.indexOf(t)<0) return;
    var k = chaveFrota(e.frota);
    if(vistos[k]) return; vistos[k]=1;

    var pos = posicaoDaFrota(e.frota);
    var online = pos ? (minutosDesde(pos.ts)<=ONLINE_LIMITE_MIN) : false;
    res.push({
      tipo:'frota',
      titulo: e.frota + (e.placa?' • '+e.placa:''),
      sub: (e.modelo||'') + (pos ? ' • '+tempoRelativo(pos.ts) : ' • sem localização recente'),
      lat: pos?parseFloat(pos.lat):NaN,
      lng: pos?parseFloat(pos.lng):NaN,
      temPos: !!pos,
      icon: pos ? (online?'🟢':'⚪') : '🚚'
    });
  });

  // 2) fallback: quem está reportando mas não está no cadastro
  frotaAtual.forEach(function(p){
    var k = chaveFrota(p.frota);
    if(vistos[k]) return;
    var alvo = normaliza(p.nome)+' '+normaliza(p.frota)+' '+normaliza(p.placa);
    if(alvo.indexOf(t)<0) return;
    vistos[k]=1;
    res.push({
      tipo:'frota',
      titulo:(p.frota||p.nome||'—')+(p.placa?' • '+p.placa:''),
      sub:(p.nome?p.nome+' • ':'')+tempoRelativo(p.ts),
      lat:parseFloat(p.lat), lng:parseFloat(p.lng), temPos:true,
      icon: minutosDesde(p.ts)<=ONLINE_LIMITE_MIN?'🟢':'⚪'
    });
  });

  return res.slice(0, 8);
}

function buscarEndereco(termo, cb){
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=br&q='+encodeURIComponent(termo);
  fetch(url, {headers:{'Accept':'application/json'}})
    .then(function(r){ return r.json(); })
    .then(function(arr){
      cb((arr||[]).map(function(a){
        return {tipo:'endereco', titulo:a.display_name.split(',').slice(0,2).join(','),
                sub:a.display_name, lat:parseFloat(a.lat), lng:parseFloat(a.lon), icon:'📍'};
      }));
    })
    .catch(function(){ cb([]); });
}

var destMarker = null, destAtual = null;

// mostra o cartão de destino com botão Navegar
function abrirDestino(it){
  destAtual = it;
  document.getElementById('destTitulo').textContent = it.titulo;
  document.getElementById('destSub').textContent = it.sub || 'Toque em Navegar para iniciar a rota';
  document.getElementById('destCard').classList.remove('hidden');
  // esconde botões flutuantes para não sobrepor o cartão
  document.getElementById('recenterBtn').style.display = 'none';
  var ft = document.getElementById('fleetToggle');
  if(ft) ft.style.visibility = 'hidden';
}
function fecharDestino(){
  document.getElementById('destCard').classList.add('hidden');
  if(destMarker){ map.removeLayer(destMarker); destMarker=null; }
  destAtual = null;
  document.getElementById('recenterBtn').style.display = 'flex';
  var ft = document.getElementById('fleetToggle');
  if(ft) ft.style.visibility = 'visible';
}
// abre o Google Maps com a rota do local do motorista até o destino
function navegarPara(){
  if(!destAtual) return;
  var dst = (!isNaN(destAtual.lat)&&!isNaN(destAtual.lng)) ? (destAtual.lat+','+destAtual.lng)
            : encodeURIComponent(destAtual.titulo);
  function abrir(origem){
    var url = 'https://www.google.com/maps/dir/?api=1'
            + (origem?'&origin='+origem:'')
            + '&destination='+dst+'&travelmode=driving';
    window.open(url,'_blank');
  }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      abrir(pos.coords.latitude+','+pos.coords.longitude);
    }, function(){ abrir(null); }, {enableHighAccuracy:true, timeout:6000});
  } else { abrir(null); }
}

function renderResultados(itens){
  var box = document.getElementById('searchResults');
  if(!itens.length){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = '';
  itens.forEach(function(it){
    var el = document.createElement('div');
    el.className = 'sr-item';
    el.innerHTML =
      '<span class="sr-ic">'+it.icon+'</span>'+
      '<div class="sr-tx"><div class="t1">'+it.titulo+'</div><div class="t2">'+(it.sub||'')+'</div></div>';
    el.onclick = function(){
      if(!isNaN(it.lat) && !isNaN(it.lng)){
        map.setView([it.lat,it.lng], 16, {animate:true});
        if(destMarker) map.removeLayer(destMarker);
        destMarker = L.marker([it.lat,it.lng]).addTo(map);
        abrirDestino(it);
      } else if(it.tipo==='frota' && !it.temPos){
        toast(it.titulo.split('•')[0].trim()+' está sem localização recente');
      }
      box.style.display='none';
      document.getElementById('searchInput').blur();
    };
    box.appendChild(el);
  });
  box.style.display = 'block';
}

function onBusca(){
  var termo = document.getElementById('searchInput').value.trim();
  var clear = document.getElementById('searchClear');
  clear.style.display = termo ? 'block' : 'none';

  clearTimeout(buscaTimer);
  if(!termo){ renderResultados([]); return; }

  // 1) resultados imediatos da frota (local, sem esperar rede)
  var locais = buscarFrotaLocal(termo);
  renderResultados(locais);

  // 2) depois de uma pausa, busca endereço e junta
  buscaTimer = setTimeout(function(){
    buscarEndereco(termo, function(enderecos){
      renderResultados(locais.concat(enderecos));
    });
  }, 500);
}

/* ============================================================
   INIT DO MAPA
   ============================================================ */
function abrirMapa(){
  initMapaFrota();
  setTimeout(function(){ map.invalidateSize(); }, 200);
  if(_isAdmin()) carregarFrota();
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('DOMContentLoaded', function(){
  document.getElementById('btnAtualizarFrota').addEventListener('click', carregarFrota);
  document.getElementById('destNavegar').addEventListener('click', navegarPara);
  document.getElementById('destFechar').addEventListener('click', fecharDestino);
  document.getElementById('cfgAbrir').addEventListener('click', abrirConfigTablet);
  document.getElementById('cfgCancelar').addEventListener('click', fecharConfigTablet);
  document.getElementById('cfgSalvar').addEventListener('click', salvarConfigTablet);
  document.getElementById('cfgRemover').addEventListener('click', removerConfigTablet);
  document.getElementById('recenterBtn').addEventListener('click', function(){
    if(meMarker){ map.setView(meMarker.getLatLng(), 16, {animate:true}); }
    else { centralizarNoUsuario(); }
  });

  // ---- LUPA expansível ----
  var bar = document.getElementById('searchBar');
  var si = document.getElementById('searchInput');
  function expandirLupa(){
    bar.classList.remove('collapsed'); bar.classList.add('expanded');
    setTimeout(function(){ si.focus(); }, 120);
  }
  function colapsarLupa(){
    bar.classList.remove('expanded'); bar.classList.add('collapsed');
    si.value=''; document.getElementById('searchClear').style.display='none';
    renderResultados([]); si.blur();
  }
  // toca na barra colapsada -> expande
  bar.addEventListener('click', function(){
    if(bar.classList.contains('collapsed')) expandirLupa();
  });
  si.addEventListener('input', onBusca);
  si.addEventListener('focus', function(){ if(si.value.trim()) onBusca(); });
  document.getElementById('searchClear').addEventListener('click', function(ev){
    ev.stopPropagation();
    si.value=''; document.getElementById('searchClear').style.display='none';
    renderResultados([]); si.focus();
  });
  // toca fora -> fecha resultados e colapsa (se vazio)
  document.addEventListener('click', function(ev){
    var res = document.getElementById('searchResults');
    if(!bar.contains(ev.target) && !res.contains(ev.target)){
      res.style.display='none';
      if(bar.classList.contains('expanded') && !si.value.trim()) colapsarLupa();
    }
  });

  // ---- PAINEL DA FROTA (admin) ----
  var painel = document.getElementById('fleetPanel');
  var toggle = document.getElementById('fleetToggle');
  toggle.addEventListener('click', function(){
    painel.classList.remove('hidden');   // sem isso o painel fica display:none
    // pequeno atraso para a animação de subida funcionar
    setTimeout(function(){ painel.classList.add('open'); }, 10);
    carregarFrota();                     // atualiza a lista ao abrir
  });
  document.getElementById('fleetPanelClose').addEventListener('click', function(){
    painel.classList.remove('open');
    setTimeout(function(){ painel.classList.add('hidden'); }, 300); // espera a animação
  });

  // admin vê o botão da frota (painel deslizante); motorista não
  if(_isAdmin()){
    document.getElementById('fleetToggle').classList.remove('hidden');
    refreshTimer = setInterval(function(){
      carregarFrota();
    }, REFRESH_INTERVALO_MS);
  }

  abrirMapa();
  carregarEquipamentos();  // cadastro da frota (VP/RB/placa/modelo) para a lupa

  // avisa se este tablet ainda não tem VP configurada
  if(!_frotaUsuario()){
    var chip = document.getElementById('statusChip');
    if(chip) chip.style.background = '#FFF4E5';
    var st = document.getElementById('meStatus');
    if(st) st.textContent = 'sem VP';
    setTimeout(function(){ toast('Este tablet ainda não tem VP configurada — toque na engrenagem'); }, 1500);
  }

  // Compartilhamento AUTOMÁTICO: começa sozinho ao abrir o mapa.
  // (o navegador ainda pede a permissão de GPS na primeira vez — obrigatório)
  iniciarCompartilhamento();

  // pausa/retoma quando o app sai/volta pra tela
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      // mantém watch, apenas não força envio extra
    } else {
      if(compartilhando) enviarMinhaPos();
      if(_isAdmin()) carregarFrota();
    }
  });

  // envia uma última posição ao fechar
  window.addEventListener('pagehide', function(){
    if(compartilhando && ultimaPos && navigator.sendBeacon){
      var params = new URLSearchParams({
        action:'salvarLocalizacao', nome:_nomeUsuario(), frota:_frotaUsuario(),
        lat:ultimaPos.lat, lng:ultimaPos.lng, precisao:Math.round(ultimaPos.acc||0),
        ts:new Date().toISOString(), saindo:'1'
      });
      navigator.sendBeacon(SCRIPT_URL+'?'+params.toString());
    }
  });
});
</script>
