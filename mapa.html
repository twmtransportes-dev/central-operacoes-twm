<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TWM — Mapa</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0A0A0F;--bg2:#0F0F18;--bg3:#13131E;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.14);--text:#F0EEF8;--muted:#7A7890;--green:#10B981;--red:#EF4444;--amber:#F59E0B;--mapa:#0A84FF}
body.light{--bg:#F4F3FF;--bg2:#FFFFFF;--bg3:#FAFAFA;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);--text:#1A1A2E;--muted:#6B6880}
body.light .app-header{box-shadow:0 1px 8px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.app-header{background:var(--bg2);border-bottom:2px solid var(--mapa);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:34px;height:34px;background:linear-gradient(135deg,#7B3FE4,#A855F7);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;color:#fff}
.logo-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.btn-back{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px}

.nav-tabs{background:var(--bg2);border-bottom:1px solid var(--border2);display:flex;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:10px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:5px}
.nav-tab.on{color:var(--mapa);border-bottom-color:var(--mapa)}

.page{display:none;padding:14px;max-width:600px;margin:0 auto;padding-bottom:40px}
.page.on{display:block}

.form-card{background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:14px}
.form-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mapa);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:12px}
.field label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);display:block;margin-bottom:5px}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:11px 13px;outline:none}
.field input:focus{border-color:var(--mapa)}

.btn-reg{width:100%;padding:14px;background:linear-gradient(135deg,#0064D6,#0A84FF);border:none;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(10,132,255,.25)}
.btn-ghost{padding:10px 16px;background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);cursor:pointer;width:100%}

.gps-banner{border-radius:12px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.gps-banner.off{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.gps-banner.on{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3)}
.gps-banner .gi{font-size:20px}
.gps-banner .gt{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.gps-banner.off .gt{color:var(--red)}
.gps-banner.on .gt{color:var(--green)}
.gps-banner .gs{font-size:10px;color:var(--muted);margin-top:1px}

#mapa-frota{width:100%;height:60vh;border-radius:14px;border:1px solid var(--border2);margin-bottom:12px}

.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:12px;line-height:1.6}
.frota-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.frota-item b{font-family:'Barlow Condensed',sans-serif;color:var(--mapa)}
.frota-item span{font-size:10px;color:var(--muted)}

.sync-bar{display:none;text-align:center;padding:6px 16px;font-size:11px;font-weight:600;letter-spacing:.5px;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg2);border-top:1px solid var(--border2)}
.sync-bar.on{display:block}
.sync-bar.ok{color:var(--green)}.sync-bar.err{color:var(--red)}
.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px 20px;font-size:12px;font-weight:600;z-index:999;transition:.3s;white-space:nowrap;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(16,185,129,.4);color:var(--green)}
.toast.err{border-color:rgba(239,68,68,.4);color:var(--red)}
</style>
<script>
(function() {
  var pref = localStorage.getItem('twm_tema') || 'auto';
  var claro;
  if (pref === 'claro') claro = true;
  else if (pref === 'escuro') claro = false;
  else { var h = new Date().getHours(); claro = h >= 6 && h < 18; }
  function aplicar() { if (claro) document.body.classList.add('light'); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', aplicar);
  else aplicar();
})();
</script>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="sync-bar" id="syncBar"></div>

<div class="app-header">
  <div class="logo">
    <div class="logo-badge">TWM</div>
    <div class="logo-title">Mapa</div>
  </div>
  <a class="btn-back" href="index.html">← Central</a>
</div>

<div class="nav-tabs">
  <div class="nav-tab on" id="tab-navegar" onclick="goTab('navegar',this)">🧭 Navegar</div>
  <div class="nav-tab" id="tab-frota" onclick="goTab('frota',this)">🗺️ Frota no Mapa</div>
</div>

<!-- ABA NAVEGAR (todos) -->
<div class="page on" id="page-navegar">
  <div id="gps-banner" class="gps-banner off">
    <div class="gi">📵</div>
    <div>
      <div class="gt" id="gps-titulo">Verificando GPS...</div>
      <div class="gs" id="gps-sub">Aguarde um instante</div>
    </div>
  </div>

  <div class="form-card">
    <div class="form-title">🧭 Traçar Rota</div>
    <div class="field">
      <label>Frota (opcional — usada na Frota no Mapa)</label>
      <input type="text" id="nv-frota" placeholder="Ex: VP-183" oninput="this.value=this.value.toUpperCase()">
    </div>
    <div class="field">
      <label>Motorista (opcional)</label>
      <input type="text" id="nv-motorista" placeholder="Nome do motorista">
    </div>
    <div class="field">
      <label>Destino *</label>
      <input type="text" id="nv-destino" placeholder="Endereço, cidade ou local de entrega">
    </div>
    <button class="btn-reg" onclick="abrirRota()">🧭 Abrir Rota no Google Maps</button>
    <button class="btn-ghost" onclick="verificarGPS()" style="margin-top:8px">🔄 Verificar GPS novamente</button>
  </div>
</div>

<!-- ABA FROTA NO MAPA (admin) -->
<div class="page" id="page-frota">
  <div class="form-card" style="padding:12px 14px">
    <div class="form-title" style="margin-bottom:4px">🗺️ Última posição conhecida</div>
    <button class="btn-ghost" onclick="carregarFrotaMapa()" style="margin-top:6px">🔄 Atualizar</button>
  </div>
  <div id="mapa-frota"></div>
  <div id="lista-frota"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══════════════════════════════════════════════
//  CONSTANTES
// ═══════════════════════════════════════════════
// Mesmo script do módulo Jornada, com as ações atualizarLocalizacao/getLocalizacoes adicionadas.
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0wK7f3lJvahV8LvsKOwNN_iu9Txo7grisBi2SvLRdVzAIG4lVom_yxXw2rYhjZhEeTA/exec';

var posicaoAtual = null;
var mapaLeaflet = null;

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════
function toast(msg, tipo) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on' + (tipo ? ' ' + tipo : '');
  setTimeout(function(){ el.className = 'toast'; }, 3500);
}
function setSyncBar(msg, tipo) {
  var el = document.getElementById('syncBar');
  el.textContent = msg;
  el.className = 'sync-bar on' + (tipo ? ' ' + tipo : '');
  if (tipo === 'ok') setTimeout(function(){ el.className = 'sync-bar'; }, 3000);
}
function _isAdminMaster(){
  try{
    var pStr = localStorage.getItem('twm_permissoes');
    if(pStr){ var p2=JSON.parse(pStr); if(p2.admin_master) return true; }
    var u=JSON.parse(localStorage.getItem('twm_user_cache')||'{}');
    var p=u.permissoes||{};
    return !!(p.admin_master||p.ADMIN_MASTER);
  }catch(e){return false;}
}

// ═══════════════════════════════════════════════
//  GPS
// ═══════════════════════════════════════════════
function verificarGPS() {
  var banner = document.getElementById('gps-banner');
  var titulo = document.getElementById('gps-titulo');
  var sub    = document.getElementById('gps-sub');

  banner.className = 'gps-banner off';
  titulo.textContent = '📵 Verificando GPS...';
  sub.textContent = 'Aguarde um instante';

  if (!navigator.geolocation) {
    banner.className = 'gps-banner off';
    titulo.textContent = '📵 GPS não suportado';
    sub.textContent = 'Este navegador não tem suporte a localização';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      posicaoAtual = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      banner.className = 'gps-banner on';
      document.getElementById('gps-titulo').textContent = '✅ GPS ativado';
      document.getElementById('gps-sub').textContent = 'Localização pronta para traçar a rota';
      enviarLocalizacao();
    },
    function(err) {
      banner.className = 'gps-banner off';
      document.getElementById('gps-titulo').textContent = '⚠️ Ative o GPS / Localização';
      document.getElementById('gps-sub').textContent = 'Vá nas configurações do celular e ative a localização para este app, depois toque em "Verificar GPS novamente"';
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

// Envia um "ping" da posição atual pro backend (opcional — só se frota informada)
function enviarLocalizacao() {
  var frota     = document.getElementById('nv-frota').value.trim().toUpperCase();
  var motorista = document.getElementById('nv-motorista').value.trim();
  if (!frota || !posicaoAtual) return;

  var params = 'action=atualizarLocalizacao' +
    '&frota=' + encodeURIComponent(frota) +
    '&motorista=' + encodeURIComponent(motorista) +
    '&lat=' + posicaoAtual.lat +
    '&lng=' + posicaoAtual.lng;

  var xhr = new XMLHttpRequest();
  xhr.timeout = 10000;
  xhr.open('GET', SCRIPT_URL + '?' + params, true);
  xhr.send();
}

// ═══════════════════════════════════════════════
//  ABRIR ROTA
// ═══════════════════════════════════════════════
function abrirRota() {
  var destino = document.getElementById('nv-destino').value.trim();
  if (!destino) { toast('⚠️ Informe o destino', 'err'); return; }
  if (!posicaoAtual) { toast('⚠️ Ative o GPS primeiro', 'err'); verificarGPS(); return; }

  enviarLocalizacao();

  var url = 'https://www.google.com/maps/dir/?api=1' +
    '&origin=' + posicaoAtual.lat + ',' + posicaoAtual.lng +
    '&destination=' + encodeURIComponent(destino) +
    '&travelmode=driving';
  window.open(url, '_blank');
}

// ═══════════════════════════════════════════════
//  FROTA NO MAPA (admin)
// ═══════════════════════════════════════════════
function carregarFrotaMapa() {
  var elLista = document.getElementById('lista-frota');
  elLista.innerHTML = '<div class="empty">Carregando posições...</div>';

  var xhr = new XMLHttpRequest();
  xhr.timeout = 15000;
  xhr.open('GET', SCRIPT_URL + '?action=getLocalizacoes&_=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      var resp = JSON.parse(xhr.responseText);
      renderFrotaMapa((resp.ok && resp.localizacoes) ? resp.localizacoes : []);
    } catch(e) { elLista.innerHTML = '<div class="empty">Erro ao carregar posições.</div>'; }
  };
  xhr.onerror = xhr.ontimeout = function() { elLista.innerHTML = '<div class="empty">📵 Sem conexão.</div>'; };
  xhr.send();
}

function renderFrotaMapa(locs) {
  var elLista = document.getElementById('lista-frota');

  if (!mapaLeaflet) {
    mapaLeaflet = L.map('mapa-frota').setView([-18.97, -49.47], 6); // centralizado em Ituiutaba/MG por padrão
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(mapaLeaflet);
  }
  // limpa marcadores antigos
  mapaLeaflet.eachLayer(function(layer) { if (layer instanceof L.Marker) mapaLeaflet.removeLayer(layer); });

  if (!locs.length) {
    elLista.innerHTML = '<div class="empty">Nenhuma frota reportou localização ainda. Isso acontece quando um motorista abre a aba "Navegar" com o GPS ativo e a frota preenchida.</div>';
    return;
  }

  var bounds = [];
  var html = '';
  locs.forEach(function(l) {
    L.marker([l.lat, l.lng]).addTo(mapaLeaflet).bindPopup('<b>' + l.frota + '</b><br>' + (l.motorista||'') + '<br>' + l.data_hora);
    bounds.push([l.lat, l.lng]);
    html += '<div class="frota-item"><b>' + l.frota + '</b><span>' + (l.motorista||'') + ' · ' + l.data_hora + '</span></div>';
  });
  if (bounds.length) mapaLeaflet.fitBounds(bounds, { padding: [30,30] });
  elLista.innerHTML = html;
}

// ═══════════════════════════════════════════════
//  NAVEGAÇÃO
// ═══════════════════════════════════════════════
function goTab(id, el) {
  var pages = document.querySelectorAll('.page');
  var tabs  = document.querySelectorAll('.nav-tab');
  for (var i = 0; i < pages.length; i++) pages[i].className = 'page';
  for (var i = 0; i < tabs.length;  i++) tabs[i].className  = 'nav-tab';
  var pg = document.getElementById('page-' + id);
  if (pg) pg.className = 'page on';
  if (el) el.className = 'nav-tab on';
  if (id === 'frota') setTimeout(function(){ carregarFrotaMapa(); if (mapaLeaflet) mapaLeaflet.invalidateSize(); }, 50);
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
window.onload = function() {
  var isM = _isAdminMaster();
  var tabFrota = document.getElementById('tab-frota');
  if (tabFrota) tabFrota.style.display = isM ? '' : 'none';

  verificarGPS();
};
</script>
<script>
// ══ SERVICE WORKER + AUTO-ATUALIZAÇÃO SILENCIOSA ══
// Garante que o usuário SEMPRE tenha a versão mais recente,
// sem precisar limpar cache ou fechar o app.
if ('serviceWorker' in navigator) {
  var _swReloaded = false;

  // Quando um novo SW assume o controle, recarrega 1x automaticamente
  navigator.serviceWorker.addEventListener('controllerchange', function() {
    if (_swReloaded) return;
    _swReloaded = true;
    window.location.reload();
  });

  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').then(function(reg) {
      // Força verificação de atualização toda vez que abre
      reg.update();

      // Se já existe um SW esperando, ativa na hora
      if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');

      // Detecta quando uma nova versão termina de baixar
      reg.addEventListener('updatefound', function() {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function() {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage('SKIP_WAITING'); // ativa → dispara controllerchange → reload
          }
        });
      });

      // Verifica atualização também quando o app volta ao foco
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) reg.update();
      });
    }).catch(function(){});
  });
}
</script>

</body>
</html>
