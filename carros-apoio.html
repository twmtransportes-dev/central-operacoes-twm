<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1d4ed8">
<title>TWM — Carros de Apoio</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){var p=localStorage.getItem('twm_tema')||'auto';var h=new Date().getHours();var claro=p==='claro'||(p!=='escuro'&&h>=6&&h<18);if(claro)document.documentElement.classList.add('light');}());
</script>
<style>
:root{--bg:#0A0A0F;--bg2:#0F0F18;--bg3:#13131E;--brd:rgba(255,255,255,.06);--brd2:rgba(255,255,255,.13);--tx:#F0EEF8;--mu:#7A7890;--blue:#2563EB;--blue2:#3B82F6;--green:#10B981;--red:#EF4444;--go:#F59E0B}
.light{--bg:#F4F3FF;--bg2:#fff;--bg3:#fafafa;--brd:rgba(0,0,0,.07);--brd2:rgba(0,0,0,.13);--tx:#1A1A2E;--mu:#6B6880}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

/* HEADER */
.hd{background:var(--blue);padding:0 14px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--blue2)}
.hd-logo{display:flex;align-items:center;gap:8px}
.hd-badge{width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:900;color:#fff}
.hd-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff}
.hd-back{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.8);text-decoration:none;display:flex;align-items:center;gap:4px}

/* CONTEÚDO */
.content{padding:16px;max-width:600px;margin:0 auto}
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:var(--tx);margin-bottom:2px}
.page-sub{font-size:12px;color:var(--mu);margin-bottom:16px}

/* CARDS */
.carro-card{background:var(--bg2);border:1px solid var(--brd2);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;border-left:4px solid var(--brd2)}
.carro-card:active{opacity:.88}
.carro-card.disponivel{border-left-color:var(--green)}
.carro-card.em-uso{border-left-color:var(--red)}
.carro-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.carro-placa{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--blue2)}
.carro-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;text-transform:uppercase;letter-spacing:.5px}
.carro-status.s-disp{background:rgba(16,185,129,.12);color:var(--green)}
.carro-status.s-uso{background:rgba(239,68,68,.12);color:var(--red)}
.carro-modelo{font-size:12px;color:var(--mu);margin-bottom:4px}
.carro-detalhe{font-size:11px;color:var(--tx);line-height:1.5;margin-top:6px;padding-top:6px;border-top:1px solid var(--brd)}
.carro-hint{font-size:11px;color:var(--mu);margin-top:4px}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:var(--bg3);border-radius:20px 20px 0 0;padding:20px 16px 30px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border-top:3px solid var(--blue2)}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--blue2);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-x{background:none;border:none;color:var(--mu);font-size:20px;cursor:pointer}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--brd);font-size:13px}
.modal-row-label{color:var(--mu);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.modal-row-val{font-weight:600;color:var(--tx)}
.fld{margin-bottom:12px}
.lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mu);display:block;margin-bottom:5px}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--brd2);border-radius:10px;color:var(--tx);font-family:'Barlow',sans-serif;font-size:14px;padding:11px 12px;outline:none;-webkit-appearance:none}
.inp:focus{border-color:var(--blue2)}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-cancel{flex:1;padding:13px;border:1.5px solid var(--brd2);border-radius:12px;background:transparent;color:var(--mu);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;cursor:pointer}
.btn-confirm{flex:1;padding:13px;border:none;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;text-transform:uppercase;color:#fff;cursor:pointer}
.btn-saida{background:linear-gradient(135deg,#2563EB,#3B82F6)}
.btn-retorno{background:linear-gradient(135deg,#DC2626,#EF4444)}
.foto-area{margin-top:8px;border:2px dashed var(--blue2);border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:rgba(37,99,235,.05)}
.foto-preview{width:100%;border-radius:8px;max-height:140px;object-fit:cover;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--brd2);border-radius:12px;padding:10px 20px;font-size:12px;font-weight:600;z-index:999;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(16,185,129,.4);color:var(--green)}
.toast.err{border-color:rgba(239,68,68,.4);color:var(--red)}

.empty{text-align:center;padding:40px 20px;color:var(--mu);font-size:13px;line-height:1.6}
.loading{text-align:center;padding:30px;color:var(--mu);font-size:13px}

/* Abas */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--brd);position:sticky;top:56px;z-index:99}
.tab-btn{flex:1;padding:12px 8px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;border:none;background:none;color:var(--mu);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s}
.tab-btn.on{color:var(--blue2);border-bottom-color:var(--blue2)}

/* Cards histórico */
.hist-card{background:var(--bg2);border:1px solid var(--brd2);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.hist-placa{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;color:var(--blue2);margin-bottom:4px}
.hist-row{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-bottom:3px}
.hist-row b{color:var(--tx)}
.hist-km{font-size:11px;color:var(--green);font-weight:700}

</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="hd">
  <div class="hd-logo">
    <div class="hd-badge">TWM</div>
    <div class="hd-title">Carros de Apoio</div>
  </div>
  <a class="hd-back" href="index.html" onclick="history.length>1?history.back()&&event.preventDefault():null">← Central</a>
</div>

<div class="tabs">
  <button class="tab-btn on" id="tab-carros" onclick="showTab('carros')">🚗 Carros</button>
  <button class="tab-btn" id="tab-hist" onclick="showTab('hist')">📋 Histórico</button>
</div>
<div class="content">
  <div class="page-title">Carros de Serviço</div>
  <div class="page-sub">Controle de saída e retorno dos veículos</div>
  <div id="lista-carros"><div class="loading">⏳ Carregando...</div></div>

<div id="lista-hist" style="display:none">
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <input id="hist-busca" type="text" placeholder="🔍 Buscar placa, motorista, local..." oninput="filtrarHist(this.value)"
      style="width:100%;padding:10px 12px;border:1.5px solid var(--brd2);border-radius:10px;background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;font-size:13px;outline:none">
  </div>
  <div id="hist-cards"><div class="loading">⏳ Carregando histórico...</div></div>
</div>
</div>

<!-- Modal Saída -->
<div class="overlay" id="modal-saida">
  <div class="modal">
    <div class="modal-title"><span id="ms-titulo">Registrar Saída</span><button class="modal-x" onclick="fecharModal('modal-saida')">✕</button></div>
    <div class="fld"><label class="lbl">Motorista *</label><input class="inp" id="ms-motorista" type="text" placeholder="Nome completo"></div>
    <div class="fld"><label class="lbl">Destino / Local *</label><input class="inp" id="ms-local" type="text" placeholder="Para onde vai?"></div>
    <div class="fld"><label class="lbl">KM de Saída *</label><input class="inp" id="ms-km" type="number" placeholder="Ex: 45230"></div>
    <div class="fld">
      <label class="lbl">Foto de Saída</label>
      <div class="foto-area" onclick="document.getElementById('ms-foto-inp').click()">
        <img id="ms-foto-img" class="foto-preview" style="display:none">
        <div id="ms-foto-txt" style="color:var(--blue2);font-size:13px;font-weight:600">📷 Tirar Foto</div>
      </div>
      <input type="file" id="ms-foto-inp" accept="image/*" capture="user" style="display:none" onchange="prevFoto(this,'ms')">
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="fecharModal('modal-saida')">Cancelar</button>
      <button class="btn-confirm btn-saida" onclick="confirmarSaida()">✅ Confirmar Saída</button>
    </div>
  </div>
</div>

<!-- Modal Retorno -->
<div class="overlay" id="modal-retorno">
  <div class="modal">
    <div class="modal-title"><span id="mr-titulo">Registrar Retorno</span><button class="modal-x" onclick="fecharModal('modal-retorno')">✕</button></div>
    <div id="mr-info" style="margin-bottom:12px;font-size:12px;color:var(--mu);line-height:1.6"></div>
    <div class="fld"><label class="lbl">KM de Retorno *</label><input class="inp" id="mr-km" type="number" placeholder="Ex: 45380"></div>
    <div class="fld">
      <label class="lbl">Foto de Retorno</label>
      <div class="foto-area" onclick="document.getElementById('mr-foto-inp').click()">
        <img id="mr-foto-img" class="foto-preview" style="display:none">
        <div id="mr-foto-txt" style="color:var(--red);font-size:13px;font-weight:600">📷 Tirar Foto</div>
      </div>
      <input type="file" id="mr-foto-inp" accept="image/*" capture="user" style="display:none" onchange="prevFoto(this,'mr')">
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="fecharModal('modal-retorno')">Cancelar</button>
      <button class="btn-confirm btn-retorno" onclick="confirmarRetorno()">🏁 Confirmar Retorno</button>
    </div>
  </div>
</div>

<script>
var SCRIPT_URL = (function(){
  // 1. URL hardcoded (principal)
  var url = 'https://script.google.com/macros/s/AKfycbzubtzuifnCgK_POE_fiLr0YKDQyl7dur1EzuX5nmlHTEl4f5UFST8V2t-mkQDeHAJdsg/exec';
  // 2. Sobrescreve se tiver configurado manualmente
  try{
    var cfg = JSON.parse(localStorage.getItem('twm_config')||'{}');
    if(cfg.scriptUrl) url = cfg.scriptUrl;
  }catch(e){}
  return url;
})();

// Dados
var carrosServico   = [];
var registrosServico = [];
var _carroAtual     = null;
var _registroAtual  = null;
var _fotoSaida      = '';
var _fotoRetorno    = '';

// ── TOAST ─────────────────────────────────────────────────────
var _toastT;
function toast(msg, tipo){
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='toast on'+(tipo?' '+tipo:'');
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){ el.className='toast'; },3000);
}

// ── MODAL ──────────────────────────────────────────────────────
function fecharModal(id){ document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('.overlay').forEach(function(el){
  el.addEventListener('click',function(e){ if(e.target===el) el.classList.remove('on'); });
});

// ── DATA BR ────────────────────────────────────────────────────
function agora(){
  var p=function(n){return String(n).padStart(2,'0');};
  var d=new Date();
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

// ── FOTO PREVIEW ───────────────────────────────────────────────
function prevFoto(input, prefix){
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=document.getElementById(prefix+'-foto-img');
    var txt=document.getElementById(prefix+'-foto-txt');
    img.src=e.target.result; img.style.display='block';
    if(txt) txt.style.display='none';
    if(prefix==='ms') _fotoSaida=e.target.result;
    if(prefix==='mr') _fotoRetorno=e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── CARREGAR CARROS ────────────────────────────────────────────
async function carregar(){
  var div=document.getElementById('lista-carros');
  div.innerHTML='<div class="loading">⏳ Carregando carros de apoio...</div>';

  if(!SCRIPT_URL || !navigator.onLine){
    div.innerHTML='<div class="empty">📵 Sem conexão ou sem internet.<br>Verifique sua conexão e tente novamente.</div>';
    return;
  }

  for(var t=1; t<=3; t++){
    try{
      var res=await fetch(SCRIPT_URL+'?action=carros_servico');
      var data=await res.json();
      if(!data.ok){ div.innerHTML='<div class="empty">Erro: '+data.msg+'</div>'; return; }
      carrosServico    = data.carros    || [];
      registrosServico = data.registros || [];
      render();
      return;
    }catch(e){
      if(t===3) div.innerHTML='<div class="empty">❌ Erro de conexão.<br>Verifique o Apps Script.</div>';
      else await new Promise(function(r){ setTimeout(r,1000); });
    }
  }
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  var div=document.getElementById('lista-carros');
  if(!carrosServico.length){
    div.innerHTML='<div class="empty">Nenhum carro cadastrado na planilha.</div>';
    return;
  }
  div.innerHTML=carrosServico.map(function(c){
    var emUso=registrosServico.find(function(r){ return r.placa===c.placa && r.status==='EM USO'; });
    var cls=emUso?'em-uso':'disponivel';
    var statusHtml=emUso
      ? '<span class="carro-status s-uso">🔴 Em Uso</span>'
      : '<span class="carro-status s-disp">🟢 Disponível</span>';
    var detalhe=emUso
      ? '<div class="carro-detalhe">👤 '+emUso.motorista+' &nbsp;·&nbsp; 📍 '+emUso.local+'<br>🕐 Saída: '+emUso.data_saida+' &nbsp;·&nbsp; KM: '+emUso.km_saida+'</div>'
      : '<div class="carro-hint">Toque para registrar saída</div>';
    return '<div class="carro-card '+cls+'" data-placa="'+c.placa+'" onclick="abrirCarro(\''+c.placa+'\')">'+
      '<div class="carro-topo"><div class="carro-placa">🚗 '+c.placa+'</div>'+statusHtml+'</div>'+
      '<div class="carro-modelo">'+c.modelo+(c.cor?' · '+c.cor:'')+(c.ano?' · '+c.ano:'')+'</div>'+
      detalhe+
    '</div>';
  }).join('');
}

// ── ABRIR CARRO ────────────────────────────────────────────────
function abrirCarro(placa){
  var carro=carrosServico.find(function(c){ return c.placa===placa; });
  var emUso=registrosServico.find(function(r){ return r.placa===placa && r.status==='EM USO'; });
  _carroAtual=carro;
  _registroAtual=emUso||null;
  if(emUso){ abrirRetorno(carro,emUso); }
  else      { abrirSaida(carro); }
}

// ── FORM SAÍDA ─────────────────────────────────────────────────
function abrirSaida(carro){
  document.getElementById('ms-titulo').textContent='🚗 '+carro.placa+' — Saída';
  document.getElementById('ms-motorista').value='';
  document.getElementById('ms-local').value='';
  document.getElementById('ms-km').value='';
  document.getElementById('ms-foto-img').style.display='none';
  document.getElementById('ms-foto-txt').style.display='';
  _fotoSaida='';
  document.getElementById('modal-saida').classList.add('on');
}

async function confirmarSaida(){
  var motorista=(document.getElementById('ms-motorista').value||'').trim();
  var local    =(document.getElementById('ms-local').value||'').trim();
  var km       =(document.getElementById('ms-km').value||'').trim();
  if(!motorista){ toast('Preencha o motorista','err'); return; }
  if(!local)    { toast('Preencha o destino','err');   return; }
  if(!km)       { toast('Preencha a KM','err');        return; }

  var dados=new URLSearchParams({
    action:'saida_servico',
    id:Date.now().toString(36),
    placa:_carroAtual.placa,
    motorista:motorista,
    local:local,
    km_saida:km,
    data_saida:agora(),
    status:'EM USO'
  });

  // Atualiza status local imediatamente (sem esperar o servidor)
  var idGerado = dados.get('id');
  registrosServico.push({
    id: idGerado,
    placa: _carroAtual.placa,
    motorista: motorista,
    local: local,
    km_saida: km,
    data_saida: agora(),
    status: 'EM USO'
  });
  fecharModal('modal-saida');
  render(); // Mostra "Em Uso" na hora

  toast('⏳ Registrando saída...');
  try{
    var resp = await fetch(SCRIPT_URL+'?'+dados.toString());
    var json = await resp.json();
    if(json.ok){
      // Atualiza o ID com o retornado pelo servidor
      var reg = registrosServico.find(function(r){ return r.id===idGerado; });
      if(reg && json.id) reg.id = json.id;
      toast('✅ Saída registrada na planilha!','ok');
    } else {
      toast('⚠️ Erro: '+(json.msg||'tente novamente'),'err');
    }
  }catch(e){ toast('⚠️ Salvo localmente — sem internet',''); }
  render();
}

// ── FORM RETORNO ───────────────────────────────────────────────
function abrirRetorno(carro, reg){
  document.getElementById('mr-titulo').textContent='🔴 '+carro.placa+' — Retorno';
  document.getElementById('mr-info').innerHTML=
    '👤 '+reg.motorista+' &nbsp;·&nbsp; 📍 '+reg.local+'<br>🕐 Saída: '+reg.data_saida+' &nbsp;·&nbsp; KM: '+reg.km_saida;
  document.getElementById('mr-km').value='';
  document.getElementById('mr-foto-img').style.display='none';
  document.getElementById('mr-foto-txt').style.display='';
  _fotoRetorno='';
  document.getElementById('modal-retorno').classList.add('on');
}

async function confirmarRetorno(){
  var km=(document.getElementById('mr-km').value||'').trim();
  if(!km){ toast('Preencha a KM de retorno','err'); return; }

  var dados=new URLSearchParams({
    action:'retorno_servico',
    placa:_carroAtual.placa,
    registro_id:_registroAtual.id||'',
    km_retorno:km,
    data_retorno:agora(),
    status:'DISPONÍVEL'
  });

  // Atualiza status local imediatamente
  var idx = registrosServico.findIndex(function(r){ return r.id===(_registroAtual.id||''); });
  if(idx >= 0) registrosServico.splice(idx, 1);
  fecharModal('modal-retorno');
  render(); // Mostra "Disponível" na hora

  toast('⏳ Registrando retorno...');
  try{
    var respR = await fetch(SCRIPT_URL+'?'+dados.toString());
    var jsonR = await respR.json();
    if(jsonR.ok){
      toast('✅ Retorno registrado na planilha!','ok');
    } else {
      toast('⚠️ Erro: '+(jsonR.msg||'tente novamente'),'err');
    }
  }catch(e){ toast('⚠️ Salvo localmente — sem internet',''); }
  render();
}


// ── ABAS ───────────────────────────────────────────────────────
function showTab(tab){
  var isCarros = tab === 'carros';
  document.getElementById('lista-carros').style.display = isCarros ? '' : 'none';
  document.getElementById('lista-hist').style.display   = isCarros ? 'none' : '';
  document.getElementById('tab-carros').classList.toggle('on', isCarros);
  document.getElementById('tab-hist').classList.toggle('on', !isCarros);
  if(!isCarros) carregarHist();
}

// ── HISTÓRICO ─────────────────────────────────────────────────
var _todosRegistros = [];

async function carregarHist(){
  var div = document.getElementById('hist-cards');
  div.innerHTML = '<div class="loading">⏳ Carregando...</div>';

  if(!SCRIPT_URL || !navigator.onLine){
    div.innerHTML = '<div class="empty">📵 Sem conexão.</div>';
    return;
  }
  try{
    var res  = await fetch(SCRIPT_URL + '?action=historico_apoio');
    var data = await res.json();
    if(!data.ok){ div.innerHTML='<div class="empty">'+data.msg+'</div>'; return; }
    _todosRegistros = data.registros || [];
    renderHist(_todosRegistros);
  }catch(e){
    div.innerHTML = '<div class="empty">❌ Erro ao carregar histórico.</div>';
  }
}

function renderHist(lista){
  var div = document.getElementById('hist-cards');
  if(!lista.length){ div.innerHTML='<div class="empty">Nenhum registro encontrado.</div>'; return; }
  div.innerHTML = lista.map(function(r){
    var emUso = (r.status||'').toUpperCase() === 'EM USO';
    var km = r.km_retorno ? 'KM percorrida: <b>'+(parseInt(r.km_retorno||0)-parseInt(r.km_saida||0))+'</b>' : '🔴 Em uso';
    return '<div class="hist-card">'+
      '<div class="hist-placa">🚗 '+(r.placa||'—')+'</div>'+
      '<div class="hist-row"><span>👤 <b>'+(r.motorista||'—')+'</b></span><span>📍 '+(r.local||'—')+'</span></div>'+
      '<div class="hist-row"><span>🕐 Saída: <b>'+(r.data_saida||'—')+'</b></span><span>KM: <b>'+(r.km_saida||'—')+'</b></span></div>'+
      (r.data_retorno ? '<div class="hist-row"><span>🏁 Retorno: <b>'+r.data_retorno+'</b></span><span class="hist-km">'+km+'</span></div>' : '<div class="hist-row"><span style="color:var(--red)">🔴 Em viagem</span></div>')+
    '</div>';
  }).join('');
}

function filtrarHist(q){
  if(!q.trim()){ renderHist(_todosRegistros); return; }
  var norm = function(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); };
  var nq = norm(q);
  renderHist(_todosRegistros.filter(function(r){
    return norm(r.placa+' '+r.motorista+' '+r.local).includes(nq);
  }));
}

carregar();
