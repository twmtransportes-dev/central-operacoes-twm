<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TWM • Mural</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1420; --card:#161d2e; --card2:#1c2438; --ink:#F2F2F7; --muted:#8b93a7;
    --brand:#7C3AED; --brand2:#0A84FF; --line:#252d42;
    --urg:#EF4444; --ok:#22C55E; --warn:#F59E0B;
    --sfont:'Barlow Condensed',-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sfont);background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex:none}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--brand);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
  .brand h1{font-size:22px;letter-spacing:.5px;font-weight:700}
  .back{color:var(--muted);text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px}

  /* filtros no topo */
  .filtros{display:flex;gap:8px;padding:10px 14px;background:var(--card);
    border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
  .fchip{background:var(--card2);border:1px solid var(--line);color:var(--muted);
    border-radius:20px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;font-family:var(--sfont)}
  .fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* lista de mensagens */
  .mural{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    border-left:4px solid var(--muted)}
  .msg.motorista{border-left-color:var(--brand2)}
  .msg.logistica{border-left-color:var(--brand);background:var(--card2)}
  .msg.aberta{border-left-color:var(--warn)}
  .msg.urgente{border-left-color:var(--urg)}
  .msg-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .msg-quem{font-weight:700;font-size:16px}
  .msg-quem .vp{color:var(--muted);font-weight:600;font-size:14px;margin-left:6px}
  .msg-hora{font-size:12px;color:var(--muted);white-space:nowrap}
  .msg-txt{font-size:16px;line-height:1.4;font-weight:400}
  .msg-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;letter-spacing:.3px}
  .tag.cat{background:rgba(124,58,237,.18);color:#c4b5fd}
  .tag.urg{background:rgba(239,68,68,.18);color:#fca5a5}
  .tag.norm{background:rgba(139,147,167,.15);color:var(--muted)}
  .tag.resp{background:rgba(34,197,94,.15);color:#86efac}
  .msg-resp{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--muted)}
  .btn-resp{margin-top:8px;background:var(--brand2);color:#fff;border:none;border-radius:10px;
    padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sfont)}
  .vazio{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;line-height:1.6}

  /* barra de envio (embaixo) */
  .enviar{background:var(--card);border-top:1px solid var(--line);padding:12px 14px;flex:none}
  .enviar-linha1{display:flex;gap:8px;margin-bottom:8px}
  .enviar select{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:9px;font-size:14px;font-family:var(--sfont);font-weight:600}
  .enviar-linha2{display:flex;gap:8px;align-items:flex-end}
  .enviar textarea{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:11px;font-size:16px;font-family:var(--sfont);resize:none;min-height:46px;max-height:110px}
  .btn-enviar{background:var(--brand);color:#fff;border:none;border-radius:12px;width:52px;height:46px;
    font-size:20px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  .btn-enviar:disabled{opacity:.5}
  .urg-toggle{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 4px}
  .urg-toggle input{width:18px;height:18px;accent-color:var(--urg)}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000;color:#fff;
    padding:11px 20px;border-radius:22px;font-size:14px;z-index:900;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  .carregando{text-align:center;color:var(--muted);padding:30px;font-size:15px}

  /* modal de resposta */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:1000}
  .ov.show{display:flex}
  .sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px 22px;
    border-top:2px solid var(--brand)}
  .sheet h3{font-size:19px;font-weight:700;margin-bottom:4px}
  .sheet .orig{background:var(--card2);border-radius:10px;padding:10px;font-size:14px;color:var(--muted);margin:10px 0}
  .sheet textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:11px;font-size:16px;font-family:var(--sfont);resize:none;min-height:70px}
  .sheet-btns{display:flex;gap:10px;margin-top:12px}
  .sheet-btns button{flex:1;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--sfont)}
  .sb-cancel{background:var(--card2);color:var(--ink)}
  .sb-ok{background:var(--brand);color:#fff}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">TWM</div>
    <h1>MURAL</h1>
  </div>
  <a class="back" href="index.html">← CENTRAL</a>
</div>

<div class="filtros" id="filtros">
  <div class="fchip on" data-f="todas">Todas</div>
  <div class="fchip" data-f="abertas">🔴 Abertas</div>
  <div class="fchip" data-f="Mecânica">Mecânica</div>
  <div class="fchip" data-f="Rota">Rota</div>
  <div class="fchip" data-f="Abastecimento">Abastecimento</div>
  <div class="fchip" data-f="Documentação">Documentação</div>
  <div class="fchip" data-f="Outro">Outro</div>
</div>

<div class="mural" id="mural">
  <div class="carregando">Carregando mural...</div>
</div>

<div class="enviar">
  <div class="enviar-linha1">
    <select id="categoria">
      <option value="Mecânica">🔧 Mecânica</option>
      <option value="Rota">🗺️ Rota</option>
      <option value="Abastecimento">⛽ Abastecimento</option>
      <option value="Documentação">📄 Documentação</option>
      <option value="Outro">💬 Outro</option>
    </select>
    <label class="urg-toggle"><input type="checkbox" id="urgente"> Urgente</label>
  </div>
  <div class="enviar-linha2">
    <textarea id="texto" placeholder="Escreva sua mensagem..." rows="1"></textarea>
    <button class="btn-enviar" id="btnEnviar" title="Enviar">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- modal de resposta (logística) -->
<div class="ov" id="ovResp">
  <div class="sheet">
    <h3>Responder</h3>
    <div class="orig" id="respOrig"></div>
    <textarea id="respTexto" placeholder="Sua resposta..."></textarea>
    <div class="sheet-btns">
      <button class="sb-cancel" id="respCancel">Cancelar</button>
      <button class="sb-ok" id="respOk">Responder</button>
    </div>
  </div>
</div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhYyBZXXKQ0CDM4r4mw-6HRd_bhXgqNBqivswWVzdiN3lw82rOMmQacJxi5JDMQffy/exec';

/* ── sessão / permissões (mesmo padrão dos outros módulos) ── */
function _user(){ try{ return JSON.parse(localStorage.getItem('twm_user_cache')||'null'); }catch(e){ return null; } }
function _perm(){ try{ return JSON.parse(localStorage.getItem('twm_permissoes')||'{}'); }catch(e){ return {}; } }
function _nome(){ var u=_user(); return (u && (u.nome||u.motorista)) || 'Usuário'; }
function _vp(){
  var u=_user()||{};
  var v = (localStorage.getItem('twm_vp_tablet')||u.frota||u.veiculo||'').toString().toUpperCase();
  return v;
}
// quem pode RESPONDER (papel de logística/admin, independente de ter VP)
function _ehLogistica(){
  var p=_perm();
  return !!(p.admin || p.admin_master || p.logistica || p.LOGISTICA || p['LOGÍSTICA']);
}

// Decide se a mensagem é de motorista ou de logística.
// REGRA: quem tem VP configurada no aparelho é MOTORISTA (tablet do caminhão),
// mesmo que a pessoa seja admin. Sem VP + permissão de logística = logística.
// Isso garante que mensagem de caminhão SEMPRE dispare o alerta.
function _tipoRemetente(){
  if(_vp()) return 'motorista';           // tem VP = tablet de caminhão
  if(_ehLogistica()) return 'logistica';  // sem VP e é da logística
  return 'motorista';                     // sem VP e sem papel: trata como motorista
}

function apiGet(qs){
  return fetch(SCRIPT_URL+qs, {method:'GET', redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(t){ try{ return JSON.parse(t); }catch(e){ return null; } });
}

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },2500);
}

var todas = [];
var filtro = 'todas';

function carregar(){
  apiGet('?action=listarMensagens&_t='+Date.now())
    .then(function(res){
      todas = (res && res.ok && res.mensagens) ? res.mensagens : [];
      render();
    })
    .catch(function(){
      document.getElementById('mural').innerHTML='<div class="vazio">Não consegui carregar o mural.<br>Verifique a conexão.</div>';
    });
}

function render(){
  var box=document.getElementById('mural');
  var lista = todas.slice();

  if(filtro==='abertas') lista=lista.filter(function(m){ return m.status==='aberta'; });
  else if(filtro!=='todas') lista=lista.filter(function(m){ return m.categoria===filtro; });

  if(!lista.length){
    box.innerHTML='<div class="vazio">Nenhuma mensagem'+(filtro!=='todas'?' neste filtro':'')+'.<br>Envie a primeira abaixo. 👇</div>';
    return;
  }

  box.innerHTML='';
  lista.forEach(function(m){
    var ehLog = m.tipo==='logistica';
    var aberta = m.status==='aberta';
    var urgente = String(m.prioridade).toLowerCase()==='urgente';
    var cls = 'msg '+(ehLog?'logistica':'motorista')+(aberta?(urgente?' urgente':' aberta'):'');

    var tags='';
    if(m.categoria) tags+='<span class="tag cat">'+m.categoria+'</span>';
    if(aberta && urgente) tags+='<span class="tag urg">URGENTE</span>';
    else if(aberta) tags+='<span class="tag norm">aguardando</span>';
    if(m.status==='respondida') tags+='<span class="tag resp">✓ respondida</span>';

    var el=document.createElement('div');
    el.className=cls;
    var html =
      '<div class="msg-top">'+
        '<div class="msg-quem">'+esc(m.remetente)+
          (m.vp?'<span class="vp">'+esc(m.vp)+'</span>':'')+'</div>'+
        '<div class="msg-hora">'+esc(fmtData(m.data_hora))+'</div>'+
      '</div>'+
      '<div class="msg-txt">'+esc(m.mensagem)+'</div>'+
      (tags?'<div class="msg-tags">'+tags+'</div>':'');

    if(m.status==='respondida' && m.respondido_por){
      html+='<div class="msg-resp">Respondido por '+esc(m.respondido_por)+' • '+esc(m.data_resposta)+'</div>';
    }
    // botão responder: só logística, só em mensagem de motorista ainda aberta
    if(aberta && !ehLog && _ehLogistica()){
      html+='<button class="btn-resp" data-id="'+esc(m.id)+'" data-vp="'+esc(m.vp)+'" data-txt="'+esc(m.mensagem).replace(/"/g,'&quot;')+'">↩ Responder</button>';
    }
    el.innerHTML=html;
    box.appendChild(el);
  });

  // liga os botões de responder
  Array.prototype.forEach.call(box.querySelectorAll('.btn-resp'), function(b){
    b.addEventListener('click', function(){
      abrirResposta(b.getAttribute('data-id'), b.getAttribute('data-vp'), b.getAttribute('data-txt'));
    });
  });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Formata a data para pt-BR. Se já vier "dd/MM/yyyy HH:mm", mantém.
// Se vier em formato ISO/inglês, converte.
function fmtData(s){
  s = String(s||'').trim();
  if(!s) return '';
  // já está no formato brasileiro?
  if(/^\d{2}\/\d{2}\/\d{4}/.test(s)) return s;
  var d = new Date(s);
  if(isNaN(d.getTime())) return s;   // não deu pra converter: mostra como veio
  var p = function(n){ return String(n).padStart(2,'0'); };
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* ── enviar mensagem ── */
function enviar(){
  var txt=document.getElementById('texto').value.trim();
  if(!txt){ toast('Escreva uma mensagem'); return; }
  var cat=document.getElementById('categoria').value;
  var urg=document.getElementById('urgente').checked;
  var tipo = _tipoRemetente();

  var btn=document.getElementById('btnEnviar'); btn.disabled=true;
  apiGet('?action=enviarMensagem'
        +'&remetente='+encodeURIComponent(_nome())
        +'&tipo='+tipo
        +'&vp='+encodeURIComponent(_vp())
        +'&categoria='+encodeURIComponent(cat)
        +'&prioridade='+(urg?'urgente':'normal')
        +'&mensagem='+encodeURIComponent(txt)
        +'&_t='+Date.now())
    .then(function(res){
      btn.disabled=false;
      if(res && res.ok){
        document.getElementById('texto').value='';
        document.getElementById('urgente').checked=false;
        toast('Mensagem enviada');
        carregar();
      } else { toast('Não consegui enviar'); }
    })
    .catch(function(){ btn.disabled=false; toast('Sem conexão'); });
}

/* ── responder (logística) ── */
var respId=null, respVp=null;
function abrirResposta(id,vp,txt){
  respId=id; respVp=vp;
  document.getElementById('respOrig').textContent='"'+txt+'"';
  document.getElementById('respTexto').value='';
  document.getElementById('ovResp').classList.add('show');
  setTimeout(function(){ document.getElementById('respTexto').focus(); },150);
}
function fecharResposta(){ document.getElementById('ovResp').classList.remove('show'); }
function enviarResposta(){
  var txt=document.getElementById('respTexto').value.trim();
  if(!txt){ toast('Escreva a resposta'); return; }
  apiGet('?action=responder'
        +'&remetente='+encodeURIComponent(_nome())
        +'&responde_id='+encodeURIComponent(respId)
        +'&vp='+encodeURIComponent(respVp)
        +'&mensagem='+encodeURIComponent(txt)
        +'&_t='+Date.now())
    .then(function(res){
      fecharResposta();
      if(res && res.ok){ toast('Respondido'); carregar(); }
      else toast('Não consegui responder');
    })
    .catch(function(){ fecharResposta(); toast('Sem conexão'); });
}

/* ── init ── */
window.addEventListener('DOMContentLoaded', function(){
  // filtros
  Array.prototype.forEach.call(document.querySelectorAll('.fchip'), function(c){
    c.addEventListener('click', function(){
      document.querySelectorAll('.fchip').forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on');
      filtro=c.getAttribute('data-f');
      render();
    });
  });

  document.getElementById('btnEnviar').addEventListener('click', enviar);
  document.getElementById('texto').addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
  });
  // textarea cresce sozinho
  document.getElementById('texto').addEventListener('input', function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,110)+'px';
  });

  document.getElementById('respCancel').addEventListener('click', fecharResposta);
  document.getElementById('respOk').addEventListener('click', enviarResposta);

  carregar();
  setInterval(carregar, 20000);  // atualiza a cada 20s
});
</script>
</body>
</html>
