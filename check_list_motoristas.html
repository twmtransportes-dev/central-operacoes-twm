<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Check List Frota — TWM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ios-bg:#F2F2F7;--ios-bg2:#FFFFFF;--ios-bg3:#F2F2F7;
  --ios-sep:rgba(60,60,67,.12);--ios-blue:#007AFF;--ios-green:#34C759;
  --ios-orange:#FF9500;--ios-red:#FF3B30;--ios-purple:#AF52DE;
  --ios-teal:#32ADE6;--ios-indigo:#5856D6;--ios-gray:#8E8E93;--ios-gray2:#AEAEB2;
  --ios-label:#000;--ios-label2:rgba(60,60,67,.6);--ios-label3:rgba(60,60,67,.3);
  --ios-fill:rgba(120,120,128,.2);--ios-fill2:rgba(120,120,128,.16);
  --ios-radius:13px;--ios-radius-lg:22px;
  --safe-top:env(safe-area-inset-top,44px);--safe-bot:env(safe-area-inset-bottom,34px);
  --tabbar-h:0px;--accent:#7C3AED;
}
@media(prefers-color-scheme:dark){:root{
  --ios-bg:#000;--ios-bg2:#1C1C1E;--ios-bg3:#2C2C2E;
  --ios-sep:rgba(84,84,88,.65);--ios-label:#FFF;
  --ios-label2:rgba(235,235,245,.6);--ios-label3:rgba(235,235,245,.18);
  --ios-fill:rgba(120,120,128,.36);--ios-fill2:rgba(120,120,128,.32);
}}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
  background:var(--ios-bg);color:var(--ios-label);
  min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.ios-nav{
  position:sticky;top:0;z-index:100;
  padding:calc(var(--safe-top) + 6px) 16px 10px;
  background:rgba(var(--nav-rgb,242,242,247),.85);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--ios-sep);display:flex;align-items:center;gap:10px;
}
@media(prefers-color-scheme:dark){.ios-nav{--nav-rgb:0,0,0}}
.ios-nav-back{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--ios-blue);font-size:16px;font-weight:400;cursor:pointer;padding:4px;
  font-family:inherit;
}
.ios-nav-back svg{flex-shrink:0}
.ios-nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--ios-label)}
.ios-nav-action{
  background:none;border:none;color:var(--ios-blue);
  font-size:15px;font-weight:500;cursor:pointer;padding:4px;font-family:inherit;
}
.ios-large-title{
  font-size:34px;font-weight:700;color:var(--ios-label);
  letter-spacing:-.5px;padding:8px 20px 4px;
}
.ios-sec{
  font-size:13px;font-weight:600;color:var(--ios-gray);
  text-transform:uppercase;letter-spacing:.5px;padding:20px 20px 8px;
}
.ios-list{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;
  border-bottom:1px solid var(--ios-sep);cursor:pointer;transition:.1s;
  text-decoration:none;color:inherit;background:none;border:none;width:100%;text-align:left;font-family:inherit;
}
.ios-row:last-child{border-bottom:none}
.ios-row:active{background:var(--ios-fill2)}
.ios-row-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.ios-row-body{flex:1;min-width:0}
.ios-row-title{font-size:17px;color:var(--ios-label)}
.ios-row-sub{font-size:13px;color:var(--ios-label2);margin-top:1px}
.ios-chevron{color:var(--ios-label3);font-size:13px}
.ios-form{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-field{padding:12px 16px;border-bottom:1px solid var(--ios-sep)}
.ios-field:last-child{border-bottom:none}
.ios-field-label{font-size:12px;font-weight:600;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ios-field input,.ios-field select,.ios-field textarea{
  width:100%;background:none;border:none;outline:none;
  font-size:17px;color:var(--ios-label);font-family:inherit;
  padding:2px 0;resize:none;
}
.ios-field input::placeholder,.ios-field textarea::placeholder{color:var(--ios-label3)}
.ios-field select{-webkit-appearance:none;appearance:none}
.ios-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;cursor:pointer;
  font-size:17px;font-weight:600;font-family:inherit;transition:.15s;width:100%;
}
.ios-btn:active{opacity:.8;transform:scale(.98)}
.ios-btn-green{background:var(--ios-green);color:#fff}
.ios-btn-gray{background:var(--ios-fill);color:var(--ios-label)}
.ios-btn-wrap{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.ios-empty{text-align:center;padding:60px 20px;color:var(--ios-gray)}
.ios-empty-icon{font-size:48px;margin-bottom:12px}
.ios-empty-title{font-size:17px;font-weight:600;color:var(--ios-label);margin-bottom:4px}
.ios-empty-sub{font-size:15px;color:var(--ios-gray)}
.ios-search-wrap{padding:8px 16px 4px}
.ios-search{display:flex;align-items:center;gap:8px;background:var(--ios-fill);border-radius:10px;padding:8px 12px}
.ios-search input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--ios-label);font-family:inherit}
.ios-search input::placeholder{color:var(--ios-gray)}
#ios-toast{
  position:fixed;bottom:calc(var(--tabbar-h)+24px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:.3s;
  pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;
}
#ios-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes ios-spin{to{transform:rotate(360deg)}}
.ios-spinner{
  width:20px;height:20px;border:2.5px solid var(--ios-sep);
  border-top-color:var(--ios-blue);border-radius:50%;
  animation:ios-spin .7s linear infinite;display:inline-block;
}
.page{display:none;min-height:100vh}
.page.active{display:block}
.veiculo-card{
  background:linear-gradient(135deg,#007AFF,#5856D6);
  border-radius:var(--ios-radius-lg);margin:0 16px 8px;padding:20px;
  color:#fff;box-shadow:0 4px 20px rgba(0,122,255,.3);
}
.veiculo-card-id{font-size:28px;font-weight:700;letter-spacing:-.5px}
.veiculo-card-modelo{font-size:13px;opacity:.85;margin-top:2px}
.veiculo-card-placa{
  display:inline-block;background:rgba(255,255,255,.2);
  padding:4px 12px;border-radius:8px;font-size:13px;font-weight:600;margin-top:8px;
}
.foto-upload{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  margin:0 16px 8px;overflow:hidden;
}
.foto-preview{width:100%;height:220px;object-fit:cover;display:block;}
.foto-btn-wrap{display:flex;gap:0}
.foto-btn{
  flex:1;padding:14px;border:none;background:none;
  color:var(--ios-blue);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;
  border-top:1px solid var(--ios-sep);
}
.foto-btn:first-child{border-right:1px solid var(--ios-sep)}
.foto-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px;color:var(--ios-gray);gap:8px;cursor:pointer;
}
.foto-empty-icon{font-size:40px}
.foto-empty-txt{font-size:15px;font-weight:500}
.foto-empty-sub{font-size:13px}
.sn-field{padding:12px 16px;border-bottom:1px solid var(--ios-sep)}
.sn-field:last-child{border-bottom:none}
.sn-label{font-size:15px;color:var(--ios-label);margin-bottom:8px;line-height:1.3}
.sn-seg{display:flex;background:var(--ios-fill);border-radius:9px;padding:2px}
.sn-btn{
  flex:1;padding:8px 4px;border:none;border-radius:7px;
  font-size:14px;font-weight:500;cursor:pointer;transition:.15s;
  background:none;color:var(--ios-label2);font-family:inherit;
}
.sn-btn.sel-sim{background:#fff;color:var(--ios-green);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sn-btn.sel-nao{background:#fff;color:var(--ios-red);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){
  .sn-btn.sel-sim,.sn-btn.sel-nao{background:var(--ios-bg3)}
}
.sec-divider{display:flex;align-items:center;gap:8px;padding:16px 16px 8px;}
.sec-icon{font-size:18px}
.sec-label{font-size:13px;font-weight:700;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px}
.hist-card{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  margin:0 16px 8px;padding:14px 16px;cursor:pointer;
  border-left:4px solid var(--ios-green);transition:.1s;
}
.hist-card:active{opacity:.7}
.hist-card.com-nao{border-left-color:var(--ios-red)}
.hist-card.com-manut{border-left-color:var(--ios-orange)}
.hist-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-data{font-size:13px;color:var(--ios-gray)}
.hist-motorista{font-size:15px;font-weight:600;color:var(--ios-label)}
.hist-info{font-size:13px;color:var(--ios-label2);margin-top:2px}
.det-foto{width:100%;height:200px;object-fit:cover;border-radius:var(--ios-radius);margin-bottom:12px}
.det-sec{font-size:12px;font-weight:700;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;padding:12px 0 6px;border-top:1px solid var(--ios-sep)}
.det-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ios-sep)}
.det-row:last-child{border-bottom:none}
.det-label{font-size:14px;color:var(--ios-label2);flex:1;padding-right:8px}
.det-val{font-size:14px;font-weight:600;color:var(--ios-label)}
.det-val.sim{color:var(--ios-green)}
.det-val.nao{color:var(--ios-red)}
.ios-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.status-ok{background:rgba(52,199,89,.15);color:var(--ios-green)}
.status-nao{background:rgba(255,59,48,.15);color:var(--ios-red)}
.status-pend{background:rgba(255,149,0,.15);color:var(--ios-orange)}
.filter-tabs{display:flex;padding:0 16px 12px;gap:8px;overflow-x:auto;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{
  padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;white-space:nowrap;font-family:inherit;
  background:var(--ios-fill);color:var(--ios-label2);transition:.15s;
}
.filter-tab.active{background:var(--ios-blue);color:#fff}
.prog-bar{height:4px;background:var(--ios-fill);border-radius:2px;margin:0 16px 16px;overflow:hidden}
.prog-fill{height:100%;background:var(--ios-green);border-radius:2px;transition:width .3s}
#modal-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
}
#modal-overlay.open{display:flex;align-items:flex-end}
#modal-box{
  background:var(--ios-bg);width:100%;
  border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;
  padding-bottom:calc(env(safe-area-inset-bottom)+16px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1);
}
#modal-overlay.open #modal-box{transform:none}
#modal-content{padding:16px}
</style>
</head>

</div>

<div id="page-hist" class="page">

  </div>
  <div id="lista-hist"></div>
</div>

<div id="modal-overlay" onclick="fecharModal()">

async function enviarFilaOffline() {
  if (!SCRIPT_URL || !filaOffline.length) return;
  const pendentes = [...filaOffline];
  filaOffline = [];
  localStorage.setItem('twm_fila', '[]');
  for (const reg of pendentes) {
    const ok = await enviarParaPlanilha(reg);
    if (!ok) {
      filaOffline.push(reg);

  localStorage.setItem('twm_fila', JSON.stringify(filaOffline));
  if (pendentes.length > filaOffline.length) {
    showToast(`📤 ${pendentes.length - filaOffline.length} checklist(s) enviados!`);
  }
}

const IMGBB_KEY_CL = '4a02e2a2c68223fd6a37ebbffefe4501';

async function comprimirFotoCL(dataUrl, maxPx, qualidade) {
  return new Promise(resolve => {
    let resolvido = false;
    const finalizar = (valor) => {
      if (resolvido) return;
      resolvido = true;
      resolve(valor);
    };
    const timeoutId = setTimeout(() => finalizar(dataUrl), 8000);

    const img = new Image();
    img.onload = () => {
      clearTimeout(timeoutId);
      try {
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else       { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        finalizar(c.toDataURL('image/jpeg', qualidade));
      } catch(e) {
        finalizar(dataUrl);
      }
    };
    img.onerror = () => {
      clearTimeout(timeoutId);
      finalizar(dataUrl);
    };
    img.src = dataUrl;
  });
}

async function uploadImgBBCL(dataUrl) {
  try {
    const compressed = await comprimirFotoCL(dataUrl, 800, 0.7);
    const b64 = compressed.split(',')[1];
    const fd = new FormData();
    fd.append('key', IMGBB_KEY_CL);
    fd.append('image', b64);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 20000);
    const res = await fetch('https://api.imgbb.com/1/upload', { method:'POST', body:fd, signal: controller.signal });
    clearTimeout(timeoutId);

    const data = await res.json();
    if (data.success) return data.data.url;
  } catch(e) { console.warn('[CL] ImgBB falhou:', e); }
  return '';
}

async function enviarParaPlanilha(registro) {
  if (!SCRIPT_URL) return true;
  try {
    const campos_simnao = CAMPOS.filter(f => f.tipo === 'simnao').map(f => f.id);
    const respostas = {};
    campos_simnao.forEach(id => { respostas[id] = registro[id] || ''; });

    let emailUser = '';
    try { emailUser = JSON.parse(localStorage.getItem('twm_user_cache')||'{}').email || ''; } catch(e) {}

    let fotoUrl = '';
    const fotoBase64 = registro.foto_auto_avaliacao || '';
    if (fotoBase64 && fotoBase64.startsWith('data:')) {
      showToast('⏳ Enviando selfie...');
      fotoUrl = await uploadImgBBCL(fotoBase64);
    }

    const params = new URLSearchParams({
      action:               'registrarChecklist',
      email:                emailUser,
      veiculo:              registro.veiculo   || '',
      motorista:            registro.motorista || '',
      km_atual:             registro.km_atual  || '',
      data_hora:            registro.data_hora || '',
      placa:                registro.placa     || '',
      carreta_reserva:      registro.carreta_reserva || '',
      justificativa:        registro.justificativa   || '',
      solicitacao_manutencao: registro.solicitacao_manutencao || '',
      respostas:            JSON.stringify(respostas),
      auto_avaliacao:       fotoUrl ? 'Foto enviada' : '',
      foto_url:             fotoUrl,
    });
    const ctrlPlanilha = new AbortController();
    const timeoutPlanilha = setTimeout(() => ctrlPlanilha.abort(), 25000);
    const res = await fetch(SCRIPT_URL + '?' + params.toString(), { signal: ctrlPlanilha.signal });
    clearTimeout(timeoutPlanilha);
    const data = await res.json();
    return data.ok === true;
  } catch (e) {
    console.error('[CL] enviarParaPlanilha erro:', e);
    return false;
  }
}

function atualizarFotoPerfil(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const foto = e.target.result;
    localStorage.setItem('twm_foto_perfil', foto);
    const av = document.getElementById('perfil-avatar');
    if (av) av.innerHTML = `<img src="${foto}">`;
  };
  reader.readAsDataURL(file);
}

function carregarFotoPerfil() {
  const foto = localStorage.getItem('twm_foto_perfil');
  if (foto) {
    const av = document.getElementById('perfil-avatar');
    if (av) av.innerHTML = `<img src="${foto}">`;
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + id);
  if (el) {
    el.classList.add('active');
    if (id === 'app' || id === 'form') {
      history.pushState({ screen: id, page: 'caminhoes' }, '');
    }
  }
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById('page-' + page);
  if (el) {
    el.classList.add('active');
    window.scrollTo(0, 0);
  }
}

function formatarData(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function horaBrasil() {
  const utc = new Date();
  const br = new Date(utc.getTime() - 3 * 60 * 60 * 1000);
  return br.toISOString().slice(0, 16);
}

// ou chamada de rede — por isso nada era salvo e a tela não mudava.
//
// Correção: lê os dados de `formDados` (mantido sincronizado por
// listeners 'input' dentro de renderForm) com fallback para o DOM
// usando o ID real com HÍFEN.
// ═══════════════════════════════════════════════════════════
let _salvandoChecklist = false;

async function salvarChecklist() {
  if (_salvandoChecklist) return;
  _salvandoChecklist = true;

  const botoes = document.querySelectorAll('[data-btn-salvar-checklist]');
  botoes.forEach(b => { b.disabled = true; b.style.opacity = '0.5'; });

  try {
    const campos_required = CAMPOS.filter(f => f.required && f.id);
    for (const c of campos_required) {
      if (c.tipo === 'simnao') {
        if (!formDados[c.id]) { showToast('Responda: ' + c.label); throw new Error('validacao'); }
      } else if (c.tipo === 'foto') {
        if (!formDados['foto_auto_avaliacao']) { showToast('Adicione a foto de auto avaliação'); throw new Error('validacao'); }
      } else if (c.tipo === 'select-veiculo' || c.tipo === 'datetime' || c.tipo === 'carreta-reserva') {
        // automáticos — não bloqueiam o salvamento
      } else {
        const elHifen = document.getElementById('f-' + c.id);
        const valor = (formDados[c.id] && String(formDados[c.id]).trim()) || (elHifen && elHifen.value && elHifen.value.trim());
        if (!valor) { showToast('Preencha: ' + c.label); throw new Error('validacao'); }
      }
    }

    const veiculo = caminhaoAtual ? caminhaoAtual.vp : '';
    const motorista = (formDados.motorista || document.getElementById('f-motorista')?.value || '').trim();
    const km = formDados.km_atual || document.getElementById('f-km_atual')?.value || '';
    const pad = n => String(n).padStart(2,'0');
    const utc = new Date();
    const br = new Date(utc.getTime() - 3 * 60 * 60 * 1000);
    const data_hora = `${pad(br.getUTCDate())}/${pad(br.getUTCMonth()+1)}/${br.getUTCFullYear()} ${pad(br.getUTCHours())}:${pad(br.getUTCMinutes())}:${pad(br.getUTCSeconds())}`;

    // Lista de problemas de manutenção — cada item vira UM serviço separado
    const problemasManutencao = (formDados._manutCampos || [])
      .map(t => (t || '').trim())
      .filter(t => t.length > 0);
    // Junta em texto único só para exibir no histórico/resumo do checklist
    const solicitacaoManutencao = problemasManutencao.join(' | ');

    const registro = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2),
      veiculo,
      placa: caminhaoAtual ? caminhaoAtual.placa : '',
      motorista,
      email: usuarioLogado ? (usuarioLogado.email || usuarioLogado.EMAIL) : '',
      km_atual: km,
      data_hora,
      carreta_reserva: (formDados.carreta_reserva || document.getElementById('f-carreta_reserva')?.value || '').trim(),
      foto_auto_avaliacao: formDados['foto_auto_avaliacao'] || '',
      ...formDados,
      justificativa: (formDados.justificativa || document.getElementById('f-justificativa')?.value || '').trim(),
      solicitacao_manutencao: solicitacaoManutencao,
    };

    const registroLocal = { ...registro, foto_auto_avaliacao: registro.foto_auto_avaliacao ? 'Foto enviada' : '' };

    const jaExiste = checklists.some(r => r.id === registroLocal.id);
    if (!jaExiste) {
      checklists.push(registroLocal);
      try {
        localStorage.setItem('twm_checklists', JSON.stringify(checklists));
      } catch(e) {
        checklists = checklists.slice(-20);
        localStorage.setItem('twm_checklists', JSON.stringify(checklists));
      }
    }

    // ── Se o motorista escreveu um ou mais problemas de manutenção,
    //    cria a O.S. direto no Apps Script de MANUTENÇÃO (script
    //    separado do checklist), no mesmo formato que o próprio
    //    manutencao.html usa em sua função sync(os) — cada problema
    //    digitado se torna UM SERVIÇO separado, com o grupo Globus
    //    detectado automaticamente pela palavra-chave. ──
    if (problemasManutencao.length) {
      try {
        const idOs = 'OS-CL-' + registro.id.slice(-6).toUpperCase();
        const servicosOS = problemasManutencao.map((problema, idx) => ({
          id: 'SV-' + registro.id.slice(-6).toUpperCase() + '-' + idx,
          tipo: detectarGrupoServico(problema),
          descricao: problema,
          mecanico: '',
          tempo: '',
          status: 'aberta',
          solucao: '',
          ts: Date.now() + idx
        }));
        const pMan = new URLSearchParams({
          action:     'salvarManutencao',
          id_os:      idOs,
          frota:      veiculo,
          prioridade: 'normal',
          status:     'aberta',
          origem:     'checklist',
          motorista:  motorista,
          data_aber:  data_hora.split(' ')[0],
          servicos:   JSON.stringify(servicosOS)
        });
        if (navigator.onLine) {
          // não bloqueia o salvamento do checklist se isso falhar
          fetch(SCRIPT_URL_MANUTENCAO + '?' + pMan.toString()).catch(()=>{});
        }
      } catch(eMan) { console.warn('[CL] Falha ao criar OS de manutenção:', eMan); }
    }

    showToast('⏳ Salvando...');

    let ok = false;
    if (SCRIPT_URL && navigator.onLine) {
      ok = await enviarParaPlanilha(registro);
    }

    if (ok) {
      showToast('✅ Check List salvo!');
    } else {
      filaOffline.push(registro);
      localStorage.setItem('twm_fila', JSON.stringify(filaOffline));
      showToast(navigator.onLine ? '⚠️ Falha no envio — salvo localmente' : '📵 Sem internet — salvo, enviará ao reconectar');
    }

    setTimeout(() => voltarLista(), 1200);

  } catch (err) {
    if (err.message !== 'validacao') {
      showToast('❌ Erro: ' + err.message);
      console.error('Erro ao salvar:', err);
    }
  } finally {
    _salvandoChecklist = false;
    botoes.forEach(b => { b.disabled = false; b.style.opacity = '1'; });
  }
}

function renderLista() {
  var el = document.getElementById('lista-veiculos');

    var isCarreta = f.vp.startsWith('RB');
    if(_filtroLista==='cavalos' && isCarreta) return false;
    if(_filtroLista==='carretas' && !isCarreta) return false;
    if(_srchLista) {
      var txt = (f.vp+' '+f.placa+' '+(f.marca||'')+(f.modelo||'')).toLowerCase();
      if(!txt.includes(_srchLista)) return false;
    }
    return true;
  });

  if(!lista.length) {
    el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">🚛</div><div class="ios-empty-title">Nenhum veículo</div><div class="ios-empty-sub">Tente outro filtro</div></div>';
    return;
  }

  var wrap = document.createElement('div');
  wrap.className = 'ios-list';
  wrap.style.cssText = 'margin:0 16px 32px';
  lista.forEach(function(f) {
    var isCarreta = f.vp.startsWith('RB');
    var icon = isCarreta ? '🚚' : '🚛';
    var bgCol = isCarreta ? 'rgba(255,149,0,.15)' : 'rgba(0,122,255,.15)';
    var sub = f.placa + (f.carreta && f.carreta !== '-' ? ' · ' + f.carreta : '');
    var div = document.createElement('div');
    div.className = 'ios-row';
    div.innerHTML = '<div class="ios-row-icon" style="background:' + bgCol + '">' + icon + '</div>'
      + '<div class="ios-row-body"><div class="ios-row-title">' + f.vp + '</div>'
      + '<div class="ios-row-sub">' + sub + '</div></div>'
      + '<svg class="ios-chevron" width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    div.addEventListener('click', (function(vp){ return function(){ abrirVeiculo(vp); }; })(f.vp));
    wrap.appendChild(div);
  });

  el.appendChild(wrap);

function renderForm() {

  var cont = document.getElementById('form-content');
  cont.innerHTML = '';

  var card = document.createElement('div');
  card.className = 'veiculo-card';
  card.innerHTML = '<div class="veiculo-card-id">' + f.vp + '</div>'
    + '<div class="veiculo-card-modelo">' + (f.modelo||'') + ' · ' + (f.marca||'') + '</div>'
    + '<div class="veiculo-card-placa">' + (f.placa||'') + '</div>';

  var currentList = null;

  CAMPOS.forEach(function(campo) {

    if (campo.tipo === 'secao') {
      if (currentList) { cont.appendChild(currentList); currentList = null; }
      var sec = document.createElement('div');
      sec.className = 'sec-divider';

      currentList.style.cssText = 'margin:0 16px 8px';
      return;
    }

    function addFormCard(inner) {
      if (currentList) { cont.appendChild(currentList); currentList = null; }
      var wrap = document.createElement('div');
      wrap.className = 'ios-form';
      wrap.style.cssText = 'margin:0 16px 8px';
      wrap.innerHTML = inner;
      cont.appendChild(wrap);
    }

    if (campo.tipo === 'select-veiculo') {
      addFormCard('<div class="ios-field"><div class="ios-field-label">Veículo</div>'
        + '<div style="font-size:17px;color:var(--ios-blue);font-weight:600">' + f.vp + '</div></div>');
      formDados['veiculo'] = f.vp;
      return;
    }

    if (campo.tipo === 'carreta-reserva') {
      var rbList = frotaFiltrada.filter(function(x){ return x.vp.startsWith('RB'); });
      var opts = '<option value="">Deixar em branco</option>'
        + rbList.map(function(r){ return '<option value="' + r.vp + '">' + r.vp + ' — ' + r.placa + '</option>'; }).join('');
      addFormCard('<div class="ios-field"><div class="ios-field-label">Carreta Reserva (opcional)</div>'
        + '<select id="f-carreta_reserva" style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;padding:2px 0;font-family:inherit">'
        + opts + '</select></div>');
      var sel = document.getElementById('f-carreta_reserva');
      if (sel) sel.addEventListener('change', function(){ formDados['carreta_reserva'] = this.value; });
      return;
    }

    if (campo.tipo === 'datetime') {
      var now = new Date();
      var dtStr = now.toLocaleDateString('pt-BR') + ', ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      formDados['data_hora'] = dtStr;
      addFormCard('<div class="ios-field"><div class="ios-field-label">Data e Hora</div>'
        + '<div style="font-size:17px;color:var(--ios-label)">' + dtStr + '</div></div>');
      return;
    }

    if (campo.tipo === 'text' || campo.tipo === 'number') {
      var u = usuarioLogado;
      var def = campo.id === 'motorista' ? (u && (u.nome||u.NOME) || '') : '';
      if (def) formDados[campo.id] = def;
      addFormCard('<div class="ios-field"><div class="ios-field-label">' + campo.label + '</div>'
        + '<input id="f-' + campo.id + '" type="' + (campo.tipo==='number'?'number':'text') + '" placeholder="' + campo.label + '" value="' + def + '"'
        + ' style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;padding:2px 0;font-family:inherit"></div>');
      var inp = document.getElementById('f-' + campo.id);
      if (inp) { (function(id){ inp.addEventListener('input', function(){ formDados[id] = this.value; }); })(campo.id); }
      return;
    }

    if (campo.tipo === 'foto') {
      if (currentList) { cont.appendChild(currentList); currentList = null; }
      var secFoto = document.createElement('div');
      secFoto.className = 'ios-sec';

      var fotoWrap = document.createElement('div');

        + '<button class="foto-btn" id="btn-cam">📷 Câmera</button>'
        + '<button class="foto-btn" id="btn-gal">🖼 Galeria</button>'
        + '</div>'
        + '<input type="file" id="foto-cam" accept="image/*" capture="user" style="display:none">'
        + '<input type="file" id="foto-file" accept="image/*" style="display:none">';
      cont.appendChild(fotoWrap);
      setTimeout(function() {
        var bc = document.getElementById('btn-cam');
        var bg = document.getElementById('btn-gal');
        var fc = document.getElementById('foto-cam');
        var ff = document.getElementById('foto-file');

        + '</div>';
      snDiv.querySelectorAll('.sn-btn').forEach(function(btn) {
        btn.addEventListener('click', function(){ setSN(this.dataset.id, this.dataset.val, this); });

    }

    if (campo.tipo === 'textarea') {
      if (currentList) { cont.appendChild(currentList); currentList = null; }

      if (campo.id === 'solicitacao_manutencao') {
        // ── Campo especial: múltiplos problemas, um por campo ──
        // Cada Enter cria um novo campo abaixo. Ao salvar, cada
        // campo preenchido se torna UM serviço separado na O.S.
        if (!formDados._manutCampos) formDados._manutCampos = [''];

        var wrapManut = document.createElement('div');
        wrapManut.className = 'ios-form';
        wrapManut.style.cssText = 'margin:0 16px 8px';
        wrapManut.id = 'manut-wrap';

      var ta = document.getElementById('f-' + campo.id);
      if (ta) { (function(id){ ta.addEventListener('input', function(){ formDados[id] = this.value; }); })(campo.id); }
      return;
    }
  });

  if (currentList) cont.appendChild(currentList);
  atualizarProgress();
}

// ── Renderiza os campos dinâmicos de "Solicitação de Manutenção" ──
function renderCamposManutencao() {
  var wrap = document.getElementById('manut-wrap');
  if (!wrap) return;
  var campos = formDados._manutCampos || [''];

  var html = '<div class="ios-field-label" style="padding:12px 16px 4px">SOLICITAÇÃO DE MANUTENÇÃO</div>';
  campos.forEach(function(valor, idx) {
    html += '<div class="ios-field" style="display:flex;align-items:center;gap:8px">'
      + '<input class="manut-input" data-idx="' + idx + '" type="text" placeholder="Ex: Trocar lâmpada de farol..." value="' + (valor||'').replace(/"/g,'&quot;') + '"'
      + ' style="flex:1;font-size:15px;color:var(--ios-label);background:none;border:none;outline:none;padding:2px 0;font-family:inherit">'
      + (campos.length > 1 ? '<button class="manut-del" data-idx="' + idx + '" style="background:none;border:none;color:var(--ios-red);font-size:18px;cursor:pointer;padding:4px">✕</button>' : '')
      + '</div>';
  });
  wrap.innerHTML = html;

  wrap.querySelectorAll('.manut-input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      var idx = parseInt(this.dataset.idx);
      formDados._manutCampos[idx] = this.value;
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var idx = parseInt(this.dataset.idx);
        // Só adiciona novo campo se o atual tiver texto
        if (this.value.trim() && idx === formDados._manutCampos.length - 1) {
          formDados._manutCampos.push('');
          renderCamposManutencao();
          setTimeout(function() {
            var novos = wrap.querySelectorAll('.manut-input');
            var ultimo = novos[novos.length - 1];
            if (ultimo) ultimo.focus();
          }, 0);
        }
      }
    });
  });

  wrap.querySelectorAll('.manut-del').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idx = parseInt(this.dataset.idx);
      formDados._manutCampos.splice(idx, 1);
      if (!formDados._manutCampos.length) formDados._manutCampos = [''];
      renderCamposManutencao();
    });
  });
}

// ── Detecta o grupo de serviço (Globus) pela palavra-chave do problema ──
function detectarGrupoServico(texto) {
  var t = (texto || '').toLowerCase();
  var grupos = [
    { re: /pneu|borracha|estepe|calibr/, tipo: '[35] PNEUS' },
    { re: /freio|cuíca|cuica|lona/, tipo: '[41] FREIOS' },
    { re: /farol|lâmpada|lampada|lantern|elétric|eletric|bateria/, tipo: '[34] ELÉTRICA' },
    { re: /ar.?condicionado|refriger/, tipo: '[30] CABINE' },
    { re: /vazament|óleo|oleo|água|agua/, tipo: '[31] MOTOR' },
    { re: /suspens|amortecedor/, tipo: '[39] SUSPENSÃO' },
    { re: /lavar|lavagem|lubrific/, tipo: '[44] OUTROS SERVIÇOS' },
  ];
  for (var i = 0; i < grupos.length; i++) {
    if (grupos[i].re.test(t)) return grupos[i].tipo;
  }
  return '[44] OUTROS SERVIÇOS';
}

function previewFoto(input) {
  if(!input.files||!input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    formDados.foto_auto_avaliacao = e.target.result;
    var wrap = document.getElementById('foto-preview-wrap');
    wrap.innerHTML = '<img class="foto-preview" src="'+e.target.result+'">';
    atualizarProgress();
  };
  reader.readAsDataURL(input.files[0]);
}

function setSN(id, val, btn) {
  formDados[id] = val;
  var wrap = btn.closest('.sn-seg');
  wrap.querySelectorAll('.sn-btn').forEach(b=>{b.classList.remove('sel-sim','sel-nao');});
  btn.classList.add(val==='Sim'?'sel-sim':'sel-nao');
  atualizarProgress();
}

function atualizarProgress() {
  var total = CAMPOS.filter(c=>c.tipo==='simnao'||c.tipo==='foto'||c.required).length;
  var preenchidos = Object.keys(formDados).filter(k=>formDados[k]).length;
  var pct = Math.min(100, Math.round(preenchidos/total*100));
  var bar = document.getElementById('prog-fill');
  if(bar) bar.style.width = pct+'%';
}

function carregarHistoricoGeral() {
  var el = document.getElementById('lista-hist');
  el.innerHTML = '<div class="ios-empty"><div class="ios-spinner" style="margin:40px auto"></div></div>';

  var u = usuarioLogado;
  if(!u) { el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">🔐</div><div class="ios-empty-title">Não autenticado</div></div>'; return; }

  fetch(SCRIPT_URL+'?action=historico&email='+encodeURIComponent(u.email||u.EMAIL||'')+'&_='+Date.now())
    .then(r=>r.json())
    .then(d=>{
      if(d.ok && d.registros) {
        _histData = d.registros;
        renderHistList();
      } else {
        el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">📋</div><div class="ios-empty-title">Sem registros</div></div>';
      }
    }).catch(()=>{
      el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">📵</div><div class="ios-empty-title">Sem conexão</div></div>';
    });
}

function renderHistList() {
  var el = document.getElementById('lista-hist');
  var data = _histData.filter(function(r) {
    if(_histFiltro==='nao') return r.temNao;
    if(_histFiltro==='manut') return r.solicitacao_manutencao;
    return true;
  });

  if(!data.length) {
    el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">📋</div><div class="ios-empty-title">Nenhum registro</div></div>';
    return;
  }

  el.innerHTML = '';
  data.forEach(function(r, i) {
    var cls = r.solicitacao_manutencao ? 'com-manut' : r.temNao ? 'com-nao' : '';
    var stCls = r.solicitacao_manutencao ? 'status-pend' : r.temNao ? 'status-nao' : 'status-ok';
    var stTxt = r.solicitacao_manutencao ? '🔧 Manutenção' : r.temNao ? '⚠ Com NÃO' : '✅ OK';
    var div = document.createElement('div');
    div.className = 'hist-card ' + cls;
    div.innerHTML = '<div class="hist-meta">'
      + '<span class="hist-data">' + (r.data_hora||r.data||'') + '</span>'
      + '<span class="ios-pill ' + stCls + '">' + stTxt + '</span>'
      + '</div>'
      + '<div class="hist-motorista">' + (r.motorista||'—') + '</div>'
      + '<div class="hist-info">' + (r.veiculo||r.id||'') + ' · KM: ' + (r.km_atual||r.km||'—') + '</div>';
    div.addEventListener('click', (function(idx){ return function(){ abrirDetalhe(idx); }; })(i));
    el.appendChild(div);
  });
}

function abrirDetalhe(i) {
  var r = _histData[i];
  if(!r) return;
  var html = '';

  if(r.foto_url && r.foto_url.startsWith('http')) {
    html += '<img class="det-foto" src="'+r.foto_url+'" onclick="window.open(\''+r.foto_url+'\',\'_blank\')">'  ;
  }

  html += '<div class="det-row"><span class="det-label">Veículo</span><span class="det-val">'+r.veiculo+'</span></div>';
  html += '<div class="det-row"><span class="det-label">Motorista</span><span class="det-val">'+r.motorista+'</span></div>';
  html += '<div class="det-row"><span class="det-label">Data/Hora</span><span class="det-val">'+r.data_hora+'</span></div>';
  html += '<div class="det-row"><span class="det-label">KM</span><span class="det-val">'+r.km_atual+'</span></div>';

  var secAtual = '';
  var mapaSecao = {
    apto:'AUTO AVALIAÇÃO',
    doc_cnh_mopp:'DOCUMENTAÇÃO',doc_veiculo:'DOCUMENTAÇÃO',doc_carga:'DOCUMENTAÇÃO',rotograma:'DOCUMENTAÇÃO',
    comp_bordo:'CABINE',cronotacografo:'CABINE',cinto:'CABINE',buzina:'CABINE',vidros:'CABINE',cameras:'CABINE',cambio:'CABINE',alarme_re:'CABINE',freio_mao:'CABINE',
    cavalo_semi:'ITENS GERAIS',sistema_freio:'ITENS GERAIS',sistema_eletrico:'ITENS GERAIS',rodas:'ITENS GERAIS',pneus:'ITENS GERAIS',quinta_roda:'ITENS GERAIS',vazamentos:'ITENS GERAIS',agua_oleo:'ITENS GERAIS',suspensao:'ITENS GERAIS',guarda_corpo:'ITENS GERAIS',baterias:'ITENS GERAIS',faixas:'ITENS GERAIS',bocas_descarga:'ITENS GERAIS',pontos_fuga:'ITENS GERAIS',
    calcos:'ACESSÓRIOS',kit_emergencia:'ACESSÓRIOS',tel_emergencia:'ACESSÓRIOS',placas_simbologia:'ACESSÓRIOS',chave_macaco:'ACESSÓRIOS',extintores:'ACESSÓRIOS',cones_sinalizacao:'ACESSÓRIOS',cones_isolamento:'ACESSÓRIOS',
  };

  CAMPOS.filter(c=>c.tipo==='simnao').forEach(function(c) {
    var sec = mapaSecao[c.id]||'';
    if(sec && sec!==secAtual) {
      secAtual=sec;
      html+='<div class="det-sec">'+sec+'</div>';
    }
    var val = r[c.id]||'';
    var cls = val==='Sim'?'sim':val==='Não'||val==='Nao'?'nao':'';
    html+='<div class="det-row"><span class="det-label" style="font-size:13px">'+c.label+'</span><span class="det-val '+cls+'">'+( val||'—')+'</span></div>';
  });

  if(r.justificativa) html+='<div class="det-sec">JUSTIFICATIVA</div><div style="padding:12px 0;font-size:14px;color:var(--ios-label)">'+r.justificativa+'</div>';
  if(r.solicitacao_manutencao) html+='<div class="det-sec" style="color:var(--ios-orange)">🔧 MANUTENÇÃO</div><div style="padding:12px 0;font-size:14px;color:var(--ios-orange);font-weight:500">'+r.solicitacao_manutencao+'</div>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

(function(){
  try {
    var cache = JSON.parse(localStorage.getItem('twm_user_cache')||'null');
    if(cache) { usuarioLogado = cache; }
  } catch(e) {}
  renderLista();
  enviarFilaOffline();
})();
</script>
