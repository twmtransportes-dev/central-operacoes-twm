<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Check List Frota — TWM</title>
<style>
/* ═══════════════════════════════════════════════════════════
   TWM iOS DESIGN SYSTEM — Compartilhado entre todos os módulos
   ═══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ios-bg:#F2F2F7;--ios-bg2:#FFFFFF;--ios-bg3:#F2F2F7;
  --ios-sep:rgba(60,60,67,.12);--ios-blue:#007AFF;--ios-green:#34C759;
  --ios-orange:#FF9500;--ios-red:#FF3B30;--ios-purple:#AF52DE;
  --ios-teal:#32ADE6;--ios-indigo:#5856D6;--ios-gray:#8E8E93;--ios-gray2:#AEAEB2;
  --ios-label:#000;--ios-label2:rgba(60,60,67,.6);--ios-label3:rgba(60,60,67,.3);
  --ios-fill:rgba(120,120,128,.2);--ios-fill2:rgba(120,120,128,.16);
  --ios-radius:13px;--ios-radius-lg:22px;
  --safe-top:env(safe-area-inset-top,44px);--safe-bot:env(safe-area-inset-bottom,34px);
  --tabbar-h:0px;--accent:#7C3AED;
}
@media(prefers-color-scheme:dark){:root{
  --ios-bg:#000;--ios-bg2:#1C1C1E;--ios-bg3:#2C2C2E;
  --ios-sep:rgba(84,84,88,.65);--ios-label:#FFF;
  --ios-label2:rgba(235,235,245,.6);--ios-label3:rgba(235,235,245,.18);
  --ios-fill:rgba(120,120,128,.36);--ios-fill2:rgba(120,120,128,.32);
}}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
  background:var(--ios-bg);color:var(--ios-label);
  min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* ── NAVBAR ── */
.ios-nav{
  position:sticky;top:0;z-index:100;
  padding:calc(var(--safe-top) + 6px) 16px 10px;
  background:rgba(var(--nav-rgb,242,242,247),.85);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--ios-sep);display:flex;align-items:center;gap:10px;
}
@media(prefers-color-scheme:dark){.ios-nav{--nav-rgb:0,0,0}}
.ios-nav-back{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--ios-blue);font-size:16px;font-weight:400;cursor:pointer;padding:4px;
  font-family:inherit;
}
.ios-nav-back svg{flex-shrink:0}
.ios-nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--ios-label)}
.ios-nav-action{
  background:none;border:none;color:var(--ios-blue);
  font-size:15px;font-weight:500;cursor:pointer;padding:4px;font-family:inherit;
}
.ios-nav-icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--ios-fill);
  border:none;color:var(--ios-blue);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;flex-shrink:0;
}
/* ── LARGE TITLE ── */
.ios-large-title{
  font-size:34px;font-weight:700;color:var(--ios-label);
  letter-spacing:-.5px;padding:8px 20px 4px;
}
/* ── SECTION HEADER ── */
.ios-sec{
  font-size:13px;font-weight:600;color:var(--ios-gray);
  text-transform:uppercase;letter-spacing:.5px;padding:20px 20px 8px;
}
/* ── INSET LIST ── */
.ios-list{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;
  border-bottom:1px solid var(--ios-sep);cursor:pointer;transition:.1s;
  text-decoration:none;color:inherit;background:none;border:none;width:100%;text-align:left;font-family:inherit;
}
.ios-row:last-child{border-bottom:none}
.ios-row:active{background:var(--ios-fill2)}
.ios-row-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.ios-row-body{flex:1;min-width:0}
.ios-row-title{font-size:17px;color:var(--ios-label)}
.ios-row-sub{font-size:13px;color:var(--ios-label2);margin-top:1px}
.ios-row-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ios-chevron{color:var(--ios-label3);font-size:13px}
.ios-badge{min-width:20px;height:20px;border-radius:10px;background:var(--ios-red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* ── FORM ── */
.ios-form{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-field{padding:12px 16px;border-bottom:1px solid var(--ios-sep)}
.ios-field:last-child{border-bottom:none}
.ios-field-label{font-size:12px;font-weight:600;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ios-field input,.ios-field select,.ios-field textarea{
  width:100%;background:none;border:none;outline:none;
  font-size:17px;color:var(--ios-label);font-family:inherit;
  padding:2px 0;resize:none;
}
.ios-field input::placeholder,.ios-field textarea::placeholder{color:var(--ios-label3)}
.ios-field select{-webkit-appearance:none;appearance:none}
/* ── CARDS ── */
.ios-card{
  background:var(--ios-bg2);border-radius:var(--ios-radius-lg);
  margin:0 16px 12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
/* ── BUTTONS ── */
.ios-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;cursor:pointer;
  font-size:17px;font-weight:600;font-family:inherit;transition:.15s;width:100%;
}
.ios-btn:active{opacity:.8;transform:scale(.98)}
.ios-btn-primary{background:var(--ios-blue);color:#fff}
.ios-btn-green{background:var(--ios-green);color:#fff}
.ios-btn-red{background:var(--ios-red);color:#fff}
.ios-btn-gray{background:var(--ios-fill);color:var(--ios-label)}
.ios-btn-wrap{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
/* ── SIM/NÃO SEGMENTED ── */
.ios-seg{display:flex;background:var(--ios-fill);border-radius:9px;padding:2px;gap:2px}
.ios-seg-btn{
  flex:1;padding:8px;border:none;border-radius:7px;
  font-size:15px;font-weight:500;cursor:pointer;transition:.15s;
  background:none;color:var(--ios-label2);font-family:inherit;
}
.ios-seg-btn.active-sim{background:#fff;color:var(--ios-green);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ios-seg-btn.active-nao{background:#fff;color:var(--ios-red);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){
  .ios-seg-btn.active-sim,.ios-seg-btn.active-nao{background:var(--ios-bg3)}
}
/* ── STATUS PILL ── */
.ios-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
/* ── SEARCH ── */
.ios-search-wrap{padding:8px 16px 4px}
.ios-search{display:flex;align-items:center;gap:8px;background:var(--ios-fill);border-radius:10px;padding:8px 12px}
.ios-search input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--ios-label);font-family:inherit}
.ios-search input::placeholder{color:var(--ios-gray)}
/* ── EMPTY STATE ── */
.ios-empty{text-align:center;padding:60px 20px;color:var(--ios-gray)}
.ios-empty-icon{font-size:48px;margin-bottom:12px}
.ios-empty-title{font-size:17px;font-weight:600;color:var(--ios-label);margin-bottom:4px}
.ios-empty-sub{font-size:15px;color:var(--ios-gray)}
/* ── SHEET ── */
.ios-sheet-ov{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}
.ios-sheet-ov.open{display:block}
.ios-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:401;
  background:var(--ios-bg2);border-radius:14px 14px 0 0;
  padding-bottom:calc(var(--safe-bot)+8px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1);
  max-height:92vh;overflow-y:auto;
}
.ios-sheet.open{transform:none}
.ios-sheet-handle{width:36px;height:5px;border-radius:3px;background:var(--ios-fill);margin:8px auto 12px}
.ios-sheet-title{font-size:17px;font-weight:600;text-align:center;padding:0 20px 16px;color:var(--ios-label)}
/* ── FAB ── */
.ios-fab{
  position:fixed;bottom:calc(var(--safe-bot)+24px);right:20px;z-index:200;
  width:56px;height:56px;border-radius:28px;
  background:var(--ios-blue);color:#fff;border:none;
  font-size:28px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 16px rgba(0,122,255,.4);transition:.15s;
}
.ios-fab:active{transform:scale(.93);opacity:.9}
/* ── TOAST ── */
#ios-toast{
  position:fixed;bottom:calc(var(--tabbar-h)+24px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:.3s;
  pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;
}
#ios-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ── SPINNER ── */
@keyframes ios-spin{to{transform:rotate(360deg)}}
.ios-spinner{
  width:20px;height:20px;border:2.5px solid var(--ios-sep);
  border-top-color:var(--ios-blue);border-radius:50%;
  animation:ios-spin .7s linear infinite;display:inline-block;
}
/* ── STATUS BAR SAFE AREA ── */
.ios-scroll{padding-bottom:calc(var(--safe-bot)+24px)}
/* ── KANBAN CARD (manutenção) ── */
.ios-kcard{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  padding:12px 14px;margin-bottom:8px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:3px solid transparent;
  cursor:pointer;transition:.1s;
}
.ios-kcard:active{opacity:.7}
/* ── AVATAR CIRCLE ── */
.ios-av{
  width:36px;height:36px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
/* ── DIVIDER ── */
.ios-div{height:1px;background:var(--ios-sep);margin:0 16px}
/* ── SCROLL CONTENT ── */
.ios-content{padding:0 0 32px}


/* ── CHECK LIST ESPECÍFICO ── */
.page{display:none;min-height:100vh}
.page.active{display:block}

/* VEÍCULO CARD */
.veiculo-card{
  background:linear-gradient(135deg,#007AFF,#5856D6);
  border-radius:var(--ios-radius-lg);margin:0 16px 8px;padding:20px;
  color:#fff;box-shadow:0 4px 20px rgba(0,122,255,.3);
}
.veiculo-card-id{font-size:28px;font-weight:700;letter-spacing:-.5px}
.veiculo-card-modelo{font-size:13px;opacity:.85;margin-top:2px}
.veiculo-card-placa{
  display:inline-block;background:rgba(255,255,255,.2);
  padding:4px 12px;border-radius:8px;font-size:13px;font-weight:600;margin-top:8px;
}

/* FOTO SELFIE */
.foto-upload{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  margin:0 16px 8px;overflow:hidden;
}
.foto-preview{
  width:100%;height:220px;object-fit:cover;display:block;
}
.foto-btn-wrap{display:flex;gap:0}
.foto-btn{
  flex:1;padding:14px;border:none;background:none;
  color:var(--ios-blue);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;
  border-top:1px solid var(--ios-sep);
}
.foto-btn:first-child{border-right:1px solid var(--ios-sep)}
.foto-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px;color:var(--ios-gray);gap:8px;cursor:pointer;
}
.foto-empty-icon{font-size:40px}
.foto-empty-txt{font-size:15px;font-weight:500}
.foto-empty-sub{font-size:13px}

/* SIM/NÃO */
.sn-field{padding:12px 16px;border-bottom:1px solid var(--ios-sep)}
.sn-field:last-child{border-bottom:none}
.sn-label{font-size:15px;color:var(--ios-label);margin-bottom:8px;line-height:1.3}
.sn-seg{display:flex;background:var(--ios-fill);border-radius:9px;padding:2px}
.sn-btn{
  flex:1;padding:8px 4px;border:none;border-radius:7px;
  font-size:14px;font-weight:500;cursor:pointer;transition:.15s;
  background:none;color:var(--ios-label2);font-family:inherit;
}
.sn-btn.sel-sim{background:#fff;color:var(--ios-green);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sn-btn.sel-nao{background:#fff;color:var(--ios-red);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){
  .sn-btn.sel-sim,.sn-btn.sel-nao{background:var(--ios-bg3)}
}

/* SECTION DIVIDER */
.sec-divider{
  display:flex;align-items:center;gap:8px;
  padding:16px 16px 8px;
}
.sec-icon{font-size:18px}
.sec-label{font-size:13px;font-weight:700;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px}

/* HISTORICO CARD */
.hist-card{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  margin:0 16px 8px;padding:14px 16px;cursor:pointer;
  border-left:4px solid var(--ios-green);transition:.1s;
}
.hist-card:active{opacity:.7}
.hist-card.com-nao{border-left-color:var(--ios-red)}
.hist-card.com-manut{border-left-color:var(--ios-orange)}
.hist-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-data{font-size:13px;color:var(--ios-gray)}
.hist-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.hist-motorista{font-size:15px;font-weight:600;color:var(--ios-label)}
.hist-info{font-size:13px;color:var(--ios-label2);margin-top:2px}

/* MODAL DETALHES */
.det-foto{width:100%;height:200px;object-fit:cover;border-radius:var(--ios-radius);margin-bottom:12px}
.det-sec{font-size:12px;font-weight:700;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;padding:12px 0 6px;border-top:1px solid var(--ios-sep)}
.det-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ios-sep)}
.det-row:last-child{border-bottom:none}
.det-label{font-size:14px;color:var(--ios-label2);flex:1;padding-right:8px}
.det-val{font-size:14px;font-weight:600;color:var(--ios-label)}
.det-val.sim{color:var(--ios-green)}
.det-val.nao{color:var(--ios-red)}

/* STATUS BADGE */
.status-ok{background:rgba(52,199,89,.15);color:var(--ios-green)}
.status-nao{background:rgba(255,59,48,.15);color:var(--ios-red)}
.status-pend{background:rgba(255,149,0,.15);color:var(--ios-orange)}

/* SKELETON LOADER */
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.skeleton{
  background:linear-gradient(90deg,var(--ios-fill) 25%,var(--ios-fill2) 50%,var(--ios-fill) 75%);
  background-size:400px 100%;animation:shimmer 1.2s infinite;border-radius:8px;
}

/* FILTER TABS */
.filter-tabs{display:flex;padding:0 16px 12px;gap:8px;overflow-x:auto;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{
  padding:6px 14px;border-radius:20px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;white-space:nowrap;font-family:inherit;
  background:var(--ios-fill);color:var(--ios-label2);transition:.15s;
}
.filter-tab.active{background:var(--ios-blue);color:#fff}

/* PROGRESS BAR */
.prog-bar{height:4px;background:var(--ios-fill);border-radius:2px;margin:0 16px 16px;overflow:hidden}
.prog-fill{height:100%;background:var(--ios-green);border-radius:2px;transition:width .3s}

/* DETAIL MODAL */
#modal-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
}
#modal-overlay.open{display:flex;align-items:flex-end}
#modal-box{
  background:var(--ios-bg);width:100%;
  border-radius:14px 14px 0 0;max-height:92vh;overflow-y:auto;
  padding-bottom:calc(env(safe-area-inset-bottom)+16px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1);
}
#modal-overlay.open #modal-box{transform:none}
#modal-content{padding:16px}
</style>
</head>
<body>

<!-- ══ PAGE: LISTA DE VEÍCULOS ══════════════════════════════ -->
<div id="page-lista" class="page active">
  <div class="ios-nav">
    <button class="ios-nav-back" onclick="history.back()">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Central
    </button>
    <span class="ios-nav-title">Check List</span>
    <button class="ios-nav-action" onclick="mostrarHistoricoGeral()">Histórico</button>
  </div>
  <div style="padding:12px 20px 0">
    <div class="ios-large-title">Caminhões</div>
  </div>
  <div class="ios-search-wrap">
    <div class="ios-search">
      <span style="color:var(--ios-gray);font-size:15px">🔍</span>
      <input id="srch-lista" placeholder="Buscar frota, placa..." oninput="filtrarLista(this.value)">
    </div>
  </div>
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFiltro('todos',this)">Todos</button>
    <button class="filter-tab" onclick="setFiltro('cavalos',this)">Cavalos</button>
    <button class="filter-tab" onclick="setFiltro('carretas',this)">Carretas Reserva</button>
  </div>
  <div id="lista-veiculos"></div>
</div>

<!-- ══ PAGE: FORMULÁRIO ═════════════════════════════════════ -->
<div id="page-form" class="page">
  <div class="ios-nav">
    <button class="ios-nav-back" onclick="voltarLista()">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar
    </button>
    <span class="ios-nav-title" id="form-title">Check List</span>
    <button class="ios-nav-action" onclick="salvarChecklist()" style="color:var(--ios-green);font-weight:700">Salvar</button>
  </div>
  <!-- Progress -->
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <!-- Form content -->
  <div id="form-content"></div>
  <div class="ios-btn-wrap">
    <button class="ios-btn ios-btn-green" onclick="salvarChecklist()">💾 Salvar Check List</button>
    <button class="ios-btn ios-btn-gray" onclick="voltarLista()">Cancelar</button>
  </div>
  <div style="height:32px"></div>
</div>

<!-- ══ PAGE: HISTÓRICO GERAL ═══════════════════════════════ -->
<div id="page-hist" class="page">
  <div class="ios-nav">
    <button class="ios-nav-back" onclick="showPage('lista')">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Voltar
    </button>
    <span class="ios-nav-title">Histórico</span>
    <span></span>
  </div>
  <div style="padding:8px 20px 0"><div class="ios-large-title">Registros</div></div>
  <div class="filter-tabs">
    <button class="filter-tab active" id="hf-todos" onclick="filtrarHist('todos',this)">Todos</button>
    <button class="filter-tab" id="hf-nao" onclick="filtrarHist('nao',this)">Com NÃO</button>
    <button class="filter-tab" id="hf-manut" onclick="filtrarHist('manut',this)">Manutenção</button>
  </div>
  <div id="lista-hist"></div>
</div>

<!-- ══ MODAL DETALHES ═══════════════════════════════════════ -->
<div id="modal-overlay" onclick="fecharModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <div style="width:36px;height:5px;border-radius:3px;background:var(--ios-fill);margin:8px auto 0"></div>
    <div style="display:flex;justify-content:flex-end;padding:8px 16px 0">
      <button onclick="fecharModal()" style="background:var(--ios-fill);border:none;border-radius:14px;width:28px;height:28px;color:var(--ios-gray);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<!-- TOAST -->
<div id="ios-toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwAGLjEDNVAJk9nGujpVd6hTl3QY9Ss9Wl0Sm14TqCHBhdAFEPglhcXSzoN7ktSQjoa/exec'; // Ex: 'https://script.google.com/macros/s/AKfyc.../exec'

async function enviarFilaOffline() {
  if (!SCRIPT_URL || !filaOffline.length) return;
  const pendentes = [...filaOffline];
  filaOffline = [];
  localStorage.setItem('twm_fila', '[]');
  for (const reg of pendentes) {
    const ok = await enviarParaPlanilha(reg);
    if (!ok) {
      filaOffline.push(reg); // falhou de novo, volta pra fila
    }
  }
  localStorage.setItem('twm_fila', JSON.stringify(filaOffline));
  if (pendentes.length > filaOffline.length) {
    showToast(`📤 ${pendentes.length - filaOffline.length} checklist(s) enviados!`);
  }
}

const IMGBB_KEY_CL = '4a02e2a2c68223fd6a37ebbffefe4501';

async function comprimirFotoCL(dataUrl, maxPx, qualidade) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxPx || h > maxPx) {
        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else       { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', qualidade));
    };
    img.src = dataUrl;
  });
}

async function uploadImgBBCL(dataUrl) {
  try {
    const compressed = await comprimirFotoCL(dataUrl, 800, 0.7);
    const b64 = compressed.split(',')[1];
    const fd = new FormData();
    fd.append('key', IMGBB_KEY_CL);
    fd.append('image', b64);
    const res = await fetch('https://api.imgbb.com/1/upload', { method:'POST', body:fd });
    const data = await res.json();
    if (data.success) return data.data.url;
  } catch(e) { console.warn('[CL] ImgBB falhou:', e); }
  return '';
}

async function enviarParaPlanilha(registro) {
  if (!SCRIPT_URL) return true;
  try {
    const campos_simnao = CAMPOS.filter(f => f.tipo === 'simnao').map(f => f.id);
    const respostas = {};
    campos_simnao.forEach(id => { respostas[id] = registro[id] || ''; });

    let emailUser = '';
    try { emailUser = JSON.parse(localStorage.getItem('twm_user_cache')||'{}').email || ''; } catch(e) {}

    // Upload da selfie para ImgBB
    let fotoUrl = '';
    const fotoBase64 = registro.foto_auto_avaliacao || '';
    if (fotoBase64 && fotoBase64.startsWith('data:')) {
      showToast('⏳ Enviando selfie...');
      fotoUrl = await uploadImgBBCL(fotoBase64);
    }

    const params = new URLSearchParams({
      action:               'registrarChecklist',
      email:                emailUser,
      veiculo:              registro.veiculo   || '',

      respostas:            JSON.stringify(respostas),

    });

// ===== NAVEGAÇÃO =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  // Empurra estado no histórico para interceptar seta voltar
  if (id === 'app' || id === 'form') {
    history.pushState({ screen: id, page: 'caminhoes' }, '');
  }
}

function showPage(page) {
  // Sistema iOS: usa page-lista, page-form, page-hist
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById('page-' + page);
  if (el) {
    el.classList.add('active');
    window.scrollTo(0, 0);
  }
}

// Intercepta seta voltar do celular
window.addEventListener('popstate', function(e) {
  const state = e.state || {};
  const goto = sessionStorage.getItem('twm_goto');

  // 1. Modal aberto → fecha o modal e empurra estado para manter na tela atual
  const modalAberto = document.getElementById('modal-overlay')?.classList.contains('open');
  if (modalAberto) {
    fecharModalBtn();
    // Reempurra estado para que próxima seta saiba onde está
    if (false) {
      history.pushState({tela:'lista-carros'}, '');
    }
    return;
  }

  // 2. Formulário de checklist ativo → volta para detalhe
  const formAtivo = document.getElementById('screen-form')?.classList.contains('active');
  if (formAtivo) {
    showScreen('app');
    showPage('detalhe');
    return;
  }

  // 3. Na página de Carros de Apoio → vai para index SOMENTE se não veio de fechar modal
  if (false) {
    if (state.tela === 'lista-carros' || goto === 'servico') {
      sessionStorage.removeItem('twm_goto');
      history.back();
      return;
    }
    // Acabou de fechar modal — fica na lista
    return;
  }

  // 4. No detalhe do checklist → volta para lista de caminhões
  const detalheAtivo = document.getElementById('page-detalhe')?.style.display === 'block';
  if (detalheAtivo && document.getElementById('screen-app')?.classList.contains('active')) {
    showPage('caminhoes');
    return;
  }

  // 5. Na lista de caminhões → vai para index.html
  const appAtivo = document.getElementById('screen-app')?.classList.contains('active');
  if (appAtivo) {
    sessionStorage.removeItem('twm_goto');
    history.back();
    return;
  }

  // Fallback → index.html
  history.back();
});

async function carregarHistoricoVeiculo(vp) {
  const div = document.getElementById('hist-caminhao');
  div.innerHTML = '<div class="no-items">⏳ Carregando histórico...</div>';

  // Função para renderizar do localStorage (fallback)
  function renderLocal() {
    const local = checklists.filter(r => (r.veiculo||r.frota||'').toUpperCase() === (vp||'').toUpperCase());
    if (!local.length) {
      div.innerHTML = '<div class="no-items">Nenhum check list registrado</div>';
      return;
    }
    div.innerHTML = local.slice().reverse().map(r => checklistCard(r)).join('');
  }

  if (!SCRIPT_URL || !navigator.onLine) {
    renderLocal();
    return;
  }

  for (let tentativa = 1; tentativa <= 3; tentativa++) {
    try {
      const url = `${SCRIPT_URL}?action=historico_veiculo&veiculo=${encodeURIComponent(vp)}`;
      const res  = await fetch(url, { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Resposta inválida'); }

      if (!data.ok || !data.registros || !data.registros.length) {
        renderLocal(); // Nenhum dado na planilha — mostra locais
        return;
      }

      // Mescla com registros locais do mesmo veículo que não estão na planilha
      const idsRemoto = new Set(data.registros.map(r => r.id));
      const locaisExtra = checklists
        .filter(r => (r.veiculo||r.frota||'').toUpperCase() === (vp||'').toUpperCase() && !idsRemoto.has(r.id))
        .map(r => ({
          id: r.id, motorista: r.motorista, data: r.data_hora,
          km: r.km_atual, temNao: temNao(r), manutencao: r.solicitacao_manutencao||''
        }));
      const todos = [...locaisExtra, ...data.registros];
      div.innerHTML = todos.map(r => {
        const dataFmt = formatarDataHistorico(r.data);
        return `<div class="checklist-hist-item ${r.temNao ? 'has-issues' : ''}"
             onclick="abrirModalHistoricoVeiculo('${r.id}', ${JSON.stringify(r).replace(/'/g,"&#39;")})">
          <div class="hist-meta">
            <span class="hist-motorista">${r.motorista}</span>
            <span class="hist-badge ${r.temNao ? 'issue' : 'ok'}">${r.temNao ? '⚠️ Atenção' : '✅ OK'}</span>
          </div>
          <div class="hist-date">📅 ${dataFmt}</div>
          <div class="hist-km">KM: ${r.km}</div>
          ${r.manutencao ? `<div style="margin-top:6px;font-size:12px;color:var(--orange);font-weight:500;">🔧 ${r.manutencao}</div>` : ''}
        </div>`;
      }).join('');
      return;
    } catch(err) {
      if (tentativa === 3) {
        renderLocal(); // Fallback: mostra dados locais
      } else {
        await new Promise(r => setTimeout(r, 1000));
      }
    }
  }
}

  const campos_simnao = CAMPOS.filter(f => f.tipo === 'simnao').map(f => f.id);

function formatarData(d) {
  if (!d) return '-';
  const dt = new Date(d);
  return dt.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

  const br = new Date(utc.getTime() - 3 * 60 * 60 * 1000);
  return br.toISOString().slice(0, 16);
}

async function salvarChecklist() {
  try {
  // Validar campos obrigatórios
  const campos_required = CAMPOS.filter(f => f.required && f.id);
  for (const c of campos_required) {
    if (c.tipo === 'simnao') {
      if (!formDados[c.id]) { showToast('Responda: ' + c.label); return; }
    } else if (c.tipo === 'foto') {
      if (!formDados['foto_' + c.id]) { showToast('Adicione a foto de auto avaliação'); return; }
    } else if (c.tipo === 'select-veiculo' || c.tipo === 'datetime' || c.tipo === 'carreta-reserva') {
      // campos automáticos — não validar
    } else {
      const el = document.getElementById('f_' + c.id);
      if (!el || !el.value.trim()) { showToast('Preencha: ' + c.label); return; }
    }
  }

  const veiculo = caminhaoAtual ? caminhaoAtual.vp : '';
  const motorista = document.getElementById('f_motorista').value.trim();
  const km = document.getElementById('f_km_atual').value;
  const pad = n => String(n).padStart(2,'0');
  const utc = new Date();
  const br = new Date(utc.getTime() - 3 * 60 * 60 * 1000);
  const data_hora = `${pad(br.getUTCDate())}/${pad(br.getUTCMonth()+1)}/${br.getUTCFullYear()} ${pad(br.getUTCHours())}:${pad(br.getUTCMinutes())}:${pad(br.getUTCSeconds())}`;

  const registro = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    veiculo,
    placa: caminhaoAtual ? caminhaoAtual.placa : '',
    motorista,
    email: usuarioLogado ? usuarioLogado.email : '',
    km_atual: km,
    data_hora,
    carreta_reserva: document.getElementById('f_carreta_reserva')?.value?.trim() || '',
    foto_auto_avaliacao: formDados['foto_auto_avaliacao'] || '',
    ...formDados,
    justificativa: document.getElementById('f_justificativa')?.value || '',
    solicitacao_manutencao: (function(){
      var sols = [];
      try { sols = JSON.parse(sessionStorage.getItem('twm_sols_manut') || '[]'); } catch(e) {}
      if (!sols.length && typeof _solicitacoes !== 'undefined') sols = _solicitacoes || [];
      if (!sols.length) return '';
      return sols.map(function(s){ return s.frota + ': ' + s.problema; }).join(' | ');
    })(),
    solicitacoes_manutencao: (function(){
      var sols = [];
      try { sols = JSON.parse(sessionStorage.getItem('twm_sols_manut') || '[]'); } catch(e) {}
      if (!sols.length && typeof _solicitacoes !== 'undefined') sols = _solicitacoes || [];
      return sols;
    })(),
  };

  // Versão sem foto para salvar localmente (evita erro de quota)
  const registroLocal = { ...registro, foto_auto_avaliacao: registro.foto_auto_avaliacao ? 'Foto enviada' : '' };

  // Salvar localmente — verifica duplicata pelo ID
  const jaExiste = checklists.some(r => r.id === registroLocal.id);
  if (!jaExiste) {
    checklists.push(registroLocal);
    try {
      localStorage.setItem('twm_checklists', JSON.stringify(checklists));
    } catch(e) {
      checklists = checklists.slice(-20);
      localStorage.setItem('twm_checklists', JSON.stringify(checklists));
    }
  }

  // ── Cria card de manutenção se houver solicitação ──
  var _sols = registroLocal.solicitacoes_manutencao || [];
  if (_sols.length === 0 && registroLocal.solicitacao_manutencao && registroLocal.solicitacao_manutencao.trim()) {
    _sols = [{frota: registroLocal.frota || '—', problema: registroLocal.solicitacao_manutencao.trim()}];
  }
  if (_sols.length > 0) {
    try {
      var ordens = JSON.parse(localStorage.getItem('twm_manutencao_os') || '[]');
      var dataHoje = new Date().toLocaleDateString('pt-BR');
      var novasOS = [];

      _sols.forEach(function(s, i) {
        var novaOS = {
          id:        'OS-' + (Date.now() + i).toString(36).toUpperCase(),
          frota:     s.frota || registroLocal.frota || '—',
          prioridade:'normal',
          status:    'aberta',
          origem:    'checklist',
          origem_id: registroLocal.id || '',
          motorista: registroLocal.motorista || '—',
          data_aber: dataHoje,
          ts:        Date.now() + i,
          servicos: [{
            id:        'SV-' + (Date.now() + i).toString(36).toUpperCase(),
            tipo:      '[44] OUTROS SERVIÇOS',
            descricao: s.problema,
            mecanico:  '',
            tempo:     '',
            status:    'aberta',
            solucao:   '',
            pendencia: false,
            ts:        Date.now() + i
          }]
        };
        novasOS.push(novaOS);
        ordens.unshift(novaOS);
      });

      // Salva localmente PRIMEIRO
      localStorage.setItem('twm_manutencao_os', JSON.stringify(ordens));

      // Envia para planilha E para check list — aguarda resposta
      const scriptUrlM = (JSON.parse(localStorage.getItem('twm_config')||'{}').scriptUrl) ||
        'https://script.google.com/macros/s/AKfycbwAGLjEDNVAJk9nGujpVd6hTl3QY9Ss9Wl0Sm14TqCHBhdAFEPglhcXSzoN7ktSQjoa/exec';

      if (navigator.onLine && scriptUrlM) {
        // Envia todas as OS em paralelo e AGUARDA
        await Promise.allSettled(novasOS.map(function(os_env) {
          var pMan = new URLSearchParams({
            action:    'salvarManutencao',
            id_os:     os_env.id,
            frota:     os_env.frota,
            prioridade:os_env.prioridade,
            status:    os_env.status,
            origem:    os_env.origem,
            motorista: os_env.motorista || '',
            data_aber: os_env.data_aber,
            obs:       'Aberta pelo Check List Frota — ' + (os_env.motorista||''),
            servicos:  JSON.stringify(os_env.servicos || [])
          });
          return fetch(scriptUrlM + '?' + pMan.toString());
        }));
      }

    } catch(e) {}
  }

  // Fechar form e atualizar tela
  showScreen('app');
  showPage('detalhe');
  renderHistoricoVeiculo(veiculo);

  // Enviar para planilha (com a foto)
  if (!SCRIPT_URL) {
    showToast('✅ Check List salvo!');
    return;
  }
  if (!navigator.onLine) {
    filaOffline.push(registro);
    localStorage.setItem('twm_fila', JSON.stringify(filaOffline));
    showToast('📵 Sem internet — salvo, enviará ao reconectar');
    return;
  }
  showToast('⏳ Enviando para planilha...');
  enviarParaPlanilha(registro).then(ok => {
    if (ok) { showToast('✅ Check List salvo na planilha!'); }
    else {
      filaOffline.push(registro);
      localStorage.setItem('twm_fila', JSON.stringify(filaOffline));
      showToast('⚠️ Falha no envio — salvo localmente');
    }
  });

  } catch(err) {
    showToast('❌ Erro: ' + err.message);
    console.error('Erro ao salvar:', err);
  }
}

let carrosServico = [];

async function carregarCarrosServico() {
  const div = document.getElementById('lista-carros-servico');
  div.innerHTML = '<div class="no-items">⏳ Carregando carros...</div>';

  if (!SCRIPT_URL || !navigator.onLine) {
    div.innerHTML = '<div class="no-items">📵 Sem internet.</div>';
    return;
  }

  for (let t = 1; t <= 3; t++) {
    try {
      const url = `${SCRIPT_URL}?action=carros_servico`;
      const res = await fetch(url, { redirect: 'follow' });
      const data = await res.json();

      if (!data.ok) {
        div.innerHTML = `<div class="no-items">Erro: ${data.msg}</div>`;
        return;
      }

      carrosServico = data.carros || [];
      registrosServico = data.registros || [];
      renderCarrosServico();
      return;
    } catch(e) {
      if (t === 3) div.innerHTML = '<div class="no-items">❌ Erro de conexão.</div>';
      else await new Promise(r => setTimeout(r, 1000));
    }
  }
}

function renderCarrosServico() {
  const div = document.getElementById('lista-carros-servico');
  if (!carrosServico.length) {
    div.innerHTML = '<div class="no-items">Nenhum carro cadastrado na planilha.</div>';

  div.innerHTML = carrosServico.map(carro => {

            🕐 Saída: ${formatarDataHistorico(emUso.data_saida)} &nbsp;·&nbsp; KM: ${emUso.km_saida}

function abrirCarroServico(placa) {
  const carro = carrosServico.find(c => c.placa === placa);

  if (emUso) {

// ===== HISTÓRICO — busca direto da planilha =====
let historicoCache = [];
let historicoBruto = [];
let filtroAtual = 'todos';

async function carregarHistorico() {
  const div = document.getElementById('lista-historico');

  // Mostra dados locais IMEDIATAMENTE
  let local = [];
  try { local = JSON.parse(localStorage.getItem('twm_checklists') || '[]'); } catch(e) {}

  if (local.length > 0) {
    historicoBruto = local.slice().reverse().map(r => ({
      id: r.id, veiculo: r.veiculo || r.frota || '—', motorista: r.motorista || '—',
      data: formatarDataHistorico(r.data_hora || r.data || ''),
      km: r.km_atual || '—', manutencao: r.solicitacao_manutencao || '',
      temNao: temNao(r)
    }));
    const subEl = document.getElementById('hist-sub');
    if (subEl) subEl.textContent = local.length + ' checklist(s)';
    renderHistoricoFiltrado(filtroAtual);
  } else {
    div.innerHTML = '<div class="no-items">⏳ Carregando...</div>';
  }

  if (!usuarioLogado || !SCRIPT_URL || !navigator.onLine) return;

  // Tenta até 3 vezes automaticamente
  for (let tentativa = 1; tentativa <= 3; tentativa++) {
    try {
      const url = `${SCRIPT_URL}?action=historico&email=${encodeURIComponent(usuarioLogado.email)}`;
      const res  = await fetch(url, { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { throw new Error('Resposta inválida'); }

      if (!data.ok) {
        div.innerHTML = `<div class="no-items">Erro: ${data.msg || 'Desconhecido'}</div>`;
        return;
      }

      historicoBruto = (data.registros || []).map(r => ({
        ...r,
        data: formatarDataHistorico(r.data)
      }));
      document.getElementById('hist-sub').textContent =
        `${historicoBruto.length} checklist(s) encontrado(s)`;
      renderHistoricoFiltrado(filtroAtual);
      return; // sucesso — sai do loop

    } catch(err) {
      if (tentativa === 3) {
        div.innerHTML = `<div class="no-items">❌ Erro de conexão. Verifique o sinal e tente novamente.</div>`;
      } else {
        // Aguarda 1s e tenta de novo
        await new Promise(r => setTimeout(r, 1000));
      }
    }
  }
}

function formatarDataHistorico(dataStr) {
  if (!dataStr) return '-';
  // Formato: "28/04/2026 15:18:45" — já está certo, retorna direto
  if (dataStr.includes('/')) return dataStr;
  // Formato ISO ou GMT — converte
  try {
    const d = new Date(dataStr);
    const pad = n => String(n).padStart(2,'0');
    const br = new Date(d.getTime() - 3 * 60 * 60 * 1000);
    return `${pad(br.getUTCDate())}/${pad(br.getUTCMonth()+1)}/${br.getUTCFullYear()} ${pad(br.getUTCHours())}:${pad(br.getUTCMinutes())}`;
  } catch(e) { return dataStr; }
}

function renderHistoricoFiltrado(filtro) {
  filtroAtual = filtro;
  const div = document.getElementById('lista-historico');
  let lista = [...historicoBruto];

  if (filtro === 'ok')        lista = lista.filter(r => !r.temNao && !r.manutencao);
  if (filtro === 'issues')    lista = lista.filter(r => r.temNao);
  if (filtro === 'manutencao')lista = lista.filter(r => r.manutencao);

  if (!lista.length) {
    div.innerHTML = '<div class="no-items">Nenhum registro encontrado.</div>';
    return;
  }

  div.innerHTML = lista.map(r => `
    <div class="checklist-hist-item ${r.temNao ? 'has-issues' : ''}"
         onclick="abrirModalHistorico('${r.id}')">
      <div class="hist-meta">
        <span class="hist-motorista">${r.veiculo} ${r.carreta ? '· ' + r.carreta : ''}</span>
        <span class="hist-badge ${r.temNao ? 'issue' : 'ok'}">${r.temNao ? '⚠️ Atenção' : '✅ OK'}</span>
      </div>
      <div class="hist-date">📅 ${r.data}</div>
      <div class="hist-km">KM: ${r.km} ${r.placa ? '· ' + r.placa : ''}</div>
      ${r.manutencao ? `<div style="margin-top:6px;font-size:12px;color:var(--orange);font-weight:500;">🔧 ${r.manutencao}</div>` : ''}
    </div>`).join('');
}

function filtrarHist(filtro, btn) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderHistoricoFiltrado(filtro);
}

// ===== MODAL =====
function abrirModalChecklist(id) {
  // Relê do localStorage para garantir dado mais recente
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('twm_checklists') || '[]'); } catch(e) {}
  // Mescla com o array em memória
  const idsMemoria = checklists.map(x => x.id);
  todos.forEach(function(r){ if (!idsMemoria.includes(r.id)) checklists.push(r); });
  const c = checklists.find(x => x.id === id);
  if (!c) return;
  const campos_simnao = CAMPOS.filter(f => f.tipo === 'simnao');
  let html = `<div class="modal-title">${c.veiculo} — Check List</div>`;
  html += `<div class="modal-row"><span class="modal-row-label">Motorista</span><span class="modal-row-val">${c.motorista}</span></div>`;
  html += `<div class="modal-row"><span class="modal-row-label">Data/Hora</span><span class="modal-row-val">${formatarData(c.data_hora)}</span></div>`;
  html += `<div class="modal-row"><span class="modal-row-label">KM Atual</span><span class="modal-row-val">${Number(c.km_atual).toLocaleString('pt-BR')}</span></div>`;
  if (c.carreta_reserva) {
    html += `<div class="modal-row"><span class="modal-row-label">Carreta Reserva</span><span class="modal-row-val" style="color:#f97316;font-weight:700;">${c.carreta_reserva}</span></div>`;
  }
  html += `<div class="modal-row"><span class="modal-row-label">Apto para o trabalho?</span><span class="modal-row-val ${c.apto === 'Sim' ? 'sim' : 'nao'}">${c.apto || '-'}</span></div>`;

  if (c.foto_auto_avaliacao) {
    html += `<div class="modal-section">AUTO AVALIAÇÃO</div><img src="${c.foto_auto_avaliacao}" style="width:100%;border-radius:10px;margin-bottom:8px">`;
  }

  let secaoAtual = '';
  campos_simnao.forEach(campo => {
    const secao = CAMPOS.find(f => f.tipo === 'secao' && CAMPOS.indexOf(f) < CAMPOS.indexOf(campo));
    const ultimaSecao = [...CAMPOS].slice(0, CAMPOS.indexOf(campo)).reverse().find(f => f.tipo === 'secao');
    if (ultimaSecao && ultimaSecao.label !== secaoAtual) {
      secaoAtual = ultimaSecao.label;
      html += `<div class="modal-section">${secaoAtual}</div>`;
    }
    const val = c[campo.id] || '-';
    html += `<div class="modal-row"><span class="modal-row-label">${campo.label}</span><span class="modal-row-val ${val === 'Sim' ? 'sim' : val === 'Não' ? 'nao' : ''}">${val}</span></div>`;
  });

  if (c.justificativa) html += `<div class="modal-section">JUSTIFICATIVA</div><div style="padding:10px;background:var(--gray-50);border-radius:8px;font-size:14px;margin-bottom:8px">${c.justificativa}</div>`;
  if (c.solicitacao_manutencao) html += `<div class="modal-section">SOLICITAÇÃO DE MANUTENÇÃO</div><div style="padding:10px;background:#fff7ed;border-radius:8px;font-size:14px;color:var(--orange);font-weight:500">${c.solicitacao_manutencao}</div>`;

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
  history.pushState({tela:'modal-checklist'}, '');
}

// Enter no login



function voltarDataLink() {
  const goto = sessionStorage.getItem('twm_goto');

  // Carros de Apoio → sempre volta para index.html
  if (goto === 'servico') {
    sessionStorage.removeItem('twm_goto');
    history.back();
    return;
  }

  // Check List → respeita o fluxo interno de telas
  const formAtivo = document.getElementById('screen-form')?.classList.contains('active');
  if (formAtivo) {
    showScreen('app');
    showPage('detalhe');
    return;
  }

  const detalheAtivo = document.getElementById('page-detalhe')?.style.display === 'block';
  if (detalheAtivo) {
    showPage('caminhoes');
    return;
  }

  // Está na lista de caminhões → volta para index.html
  sessionStorage.removeItem('twm_goto');
  history.back();
}

(function aplicarModo() {

  if (goto === 'servico') {
    style.textContent = '#nav-caminhoes, #nav-historico { display: none !important; }';
  } else if (goto === 'checklist') {

  }
  document.head.appendChild(style);

// Entra no app direto via sessão do index.html
(function iniciarApp() {
  // 1. Sessão compartilhada do index.html (twm_session)
  try {
    var s = JSON.parse(localStorage.getItem('twm_session') || 'null');
    if (s && s.motorista) {
      entrarNoApp(s.motorista);
      return;
    }
  } catch(e) {}

  // 2. Cache direto do usuário como fallback
  try {
    var u = JSON.parse(localStorage.getItem('twm_user_cache') || 'null');
    if (u && (u.nome || u.email)) {
      entrarNoApp(u);
      return;
    }
  } catch(e) {}

  // 3. Sem sessão — volta para index
  window.location.replace('index.html');
})();

function renderLista() {
  var el = document.getElementById('lista-veiculos');
  var lista = frotaFiltrada.filter(function(f) {
    var isCarreta = f.vp.startsWith('RB');
    if(_filtroLista==='cavalos' && isCarreta) return false;

    if(_srchLista) {
      var txt = (f.vp+' '+f.placa+' '+(f.marca||'')+(f.modelo||'')).toLowerCase();
      if(!txt.includes(_srchLista)) return false;

  });

    return;
  }

  var wrap = document.createElement('div');
  wrap.className = 'ios-list';
  wrap.style.cssText = 'margin:0 16px 32px';
  lista.forEach(function(f) {
    var isCarreta = f.vp.startsWith('RB');
    var icon = isCarreta ? '🚚' : '🚛';
    var bgCol = isCarreta ? 'rgba(255,149,0,.15)' : 'rgba(0,122,255,.15)';
    var sub = f.placa + (f.carreta && f.carreta !== '-' ? ' · ' + f.carreta : '');
    var div = document.createElement('div');

    div.addEventListener('click', (function(vp){ return function(){ abrirVeiculo(vp); }; })(f.vp));
    wrap.appendChild(div);
  });
  el.innerHTML = '';
  el.appendChild(wrap);

      wrap.className = 'ios-form';
      wrap.style.cssText = 'margin:0 16px 8px';

        + '<div style="font-size:17px;color:var(--ios-blue);font-weight:600">' + f.vp + '</div></div>');
      return;
    }

    if (campo.tipo === 'carreta-reserva') {
      var rbList = frotaFiltrada.filter(function(x){ return x.vp.startsWith('RB'); });

      var now = new Date();

      if (def) formDados[campo.id] = def;

        + ' style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;padding:2px 0;font-family:inherit"></div>');
      var inp = document.getElementById('f-' + campo.id);
      if (inp) { (function(id){ inp.addEventListener('input', function(){ formDados[id] = this.value; }); })(campo.id); }

function previewFoto(input) {
  if(!input.files||!input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    formDados.foto_auto_avaliacao = e.target.result;
    var wrap = document.getElementById('foto-preview-wrap');
    wrap.innerHTML = '<img class="foto-preview" src="'+e.target.result+'">';
    atualizarProgress();
  };
  reader.readAsDataURL(input.files[0]);
}

function setSN(id, val, btn) {
  formDados[id] = val;
  var wrap = btn.closest('.sn-seg');
  wrap.querySelectorAll('.sn-btn').forEach(b=>{b.classList.remove('sel-sim','sel-nao');});
  btn.classList.add(val==='Sim'?'sel-sim':'sel-nao');
  atualizarProgress();
}

function atualizarProgress() {
  var total = CAMPOS.filter(c=>c.tipo==='simnao'||c.tipo==='foto'||c.required).length;
  var preenchidos = Object.keys(formDados).filter(k=>formDados[k]).length;
  var pct = Math.min(100, Math.round(preenchidos/total*100));
  var bar = document.getElementById('prog-fill');
  if(bar) bar.style.width = pct+'%';
}

function renderHistList() {
  var el = document.getElementById('lista-hist');
  var data = _histData.filter(function(r) {
    if(_histFiltro==='nao') return r.temNao;
    if(_histFiltro==='manut') return r.solicitacao_manutencao;
    return true;
  });
  
  if(!data.length) {
    el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">📋</div><div class="ios-empty-title">Nenhum registro</div></div>';
    return;
  }
  
  el.innerHTML = '';
  data.forEach(function(r, i) {
    var cls = r.solicitacao_manutencao ? 'com-manut' : r.temNao ? 'com-nao' : '';
    var stCls = r.solicitacao_manutencao ? 'status-pend' : r.temNao ? 'status-nao' : 'status-ok';
    var stTxt = r.solicitacao_manutencao ? '🔧 Manutenção' : r.temNao ? '⚠ Com NÃO' : '✅ OK';
    var div = document.createElement('div');
    div.className = 'hist-card ' + cls;
    div.innerHTML = '<div class="hist-meta">'
      + '<span class="hist-data">' + (r.data_hora||r.data||'') + '</span>'
      + '<span class="ios-pill ' + stCls + '">' + stTxt + '</span>'
      + '</div>'
      + '<div class="hist-motorista">' + (r.motorista||'—') + '</div>'
      + '<div class="hist-info">' + (r.veiculo||r.id||'') + ' · KM: ' + (r.km_atual||r.km||'—') + '</div>';
    div.addEventListener('click', (function(idx){ return function(){ abrirDetalhe(idx); }; })(i));
    el.appendChild(div);
  });
}

function abrirDetalhe(i) {
  var r = _histData[i];
  if(!r) return;
  var html = '';
  
  if(r.foto_url && r.foto_url.startsWith('http')) {
    html += '<img class="det-foto" src="'+r.foto_url+'" onclick="window.open(\''+r.foto_url+'\',\'_blank\')">'  ;
  }
  
  html += '<div class="det-row"><span class="det-label">Veículo</span><span class="det-val">'+r.veiculo+'</span></div>';
  html += '<div class="det-row"><span class="det-label">Motorista</span><span class="det-val">'+r.motorista+'</span></div>';
  html += '<div class="det-row"><span class="det-label">Data/Hora</span><span class="det-val">'+r.data_hora+'</span></div>';
  html += '<div class="det-row"><span class="det-label">KM</span><span class="det-val">'+r.km_atual+'</span></div>';
  
  // Respostas por seção
  var secAtual = '';
  var mapaSecao = {
    apto:'AUTO AVALIAÇÃO',
    doc_cnh_mopp:'DOCUMENTAÇÃO',doc_veiculo:'DOCUMENTAÇÃO',doc_carga:'DOCUMENTAÇÃO',rotograma:'DOCUMENTAÇÃO',
    comp_bordo:'CABINE',cronotacografo:'CABINE',cinto:'CABINE',buzina:'CABINE',vidros:'CABINE',cameras:'CABINE',cambio:'CABINE',alarme_re:'CABINE',freio_mao:'CABINE',
    cavalo_semi:'ITENS GERAIS',sistema_freio:'ITENS GERAIS',sistema_eletrico:'ITENS GERAIS',rodas:'ITENS GERAIS',pneus:'ITENS GERAIS',quinta_roda:'ITENS GERAIS',vazamentos:'ITENS GERAIS',agua_oleo:'ITENS GERAIS',suspensao:'ITENS GERAIS',guarda_corpo:'ITENS GERAIS',baterias:'ITENS GERAIS',faixas:'ITENS GERAIS',bocas_descarga:'ITENS GERAIS',pontos_fuga:'ITENS GERAIS',
    calcos:'ACESSÓRIOS',kit_emergencia:'ACESSÓRIOS',tel_emergencia:'ACESSÓRIOS',placas_simbologia:'ACESSÓRIOS',chave_macaco:'ACESSÓRIOS',extintores:'ACESSÓRIOS',cones_sinalizacao:'ACESSÓRIOS',cones_isolamento:'ACESSÓRIOS',
  };
  
  CAMPOS.filter(c=>c.tipo==='simnao').forEach(function(c) {
    var sec = mapaSecao[c.id]||'';
    if(sec && sec!==secAtual) {
      secAtual=sec;
      html+='<div class="det-sec">'+sec+'</div>';
    }
    var val = r[c.id]||'';
    var cls = val==='Sim'?'sim':val==='Não'||val==='Nao'?'nao':'';
    html+='<div class="det-row"><span class="det-label" style="font-size:13px">'+c.label+'</span><span class="det-val '+cls+'">'+( val||'—')+'</span></div>';
  });
  
  if(r.justificativa) html+='<div class="det-sec">JUSTIFICATIVA</div><div style="padding:12px 0;font-size:14px;color:var(--ios-label)">'+r.justificativa+'</div>';
  if(r.solicitacao_manutencao) html+='<div class="det-sec" style="color:var(--ios-orange)">🔧 MANUTENÇÃO</div><div style="padding:12px 0;font-size:14px;color:var(--ios-orange);font-weight:500">'+r.solicitacao_manutencao+'</div>';
  
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function salvarChecklist() {
  // Valida campos obrigatórios
  var erros = [];
  if(!formDados.km_atual) erros.push('KM Atual');
  if(!formDados.motorista) erros.push('Motorista');
  if(erros.length) { showToast('⚠ Preencha: '+erros.join(', ')); return; }
  
  // Usa função existente de envio
  var registro = Object.assign({}, formDados, {
    veiculo: caminhaoAtual.vp,
    placa: caminhaoAtual.placa,
    data_hora: formDados.data_hora || new Date().toLocaleString('pt-BR'),
  });
  
  showToast('⏳ Salvando...');
  
  enviarParaPlanilha(registro).then(ok=>{
    if(ok) {
      showToast('✅ Check list salvo!');
      setTimeout(()=>voltarLista(), 1200);
    } else {
      // Offline — salva na fila
      filaOffline.push(registro);
      localStorage.setItem('twm_fila', JSON.stringify(filaOffline));
      showToast('📵 Salvo offline — enviará quando conectar');
      setTimeout(()=>voltarLista(), 1500);
    }
  });
}

(function(){
  try {
    var cache = JSON.parse(localStorage.getItem('twm_user_cache')||'null');
    if(cache) { usuarioLogado = cache; }
  } catch(e) {}
  renderLista();
  enviarFilaOffline();
})();
</script>
