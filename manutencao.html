<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Manutenção — TWM</title>
<style>
/* ═══════════════════════════════════════════════════════════
   TWM iOS DESIGN SYSTEM — Compartilhado entre todos os módulos
   ═══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ios-bg:#F2F2F7;--ios-bg2:#FFFFFF;--ios-bg3:#F2F2F7;
  --ios-sep:rgba(60,60,67,.12);--ios-blue:#007AFF;--ios-green:#34C759;
  --ios-orange:#FF9500;--ios-red:#FF3B30;--ios-purple:#AF52DE;
  --ios-teal:#32ADE6;--ios-indigo:#5856D6;--ios-gray:#8E8E93;--ios-gray2:#AEAEB2;
  --ios-label:#000;--ios-label2:rgba(60,60,67,.6);--ios-label3:rgba(60,60,67,.3);
  --ios-fill:rgba(120,120,128,.2);--ios-fill2:rgba(120,120,128,.16);
  --ios-radius:13px;--ios-radius-lg:22px;
  --safe-top:env(safe-area-inset-top,44px);--safe-bot:env(safe-area-inset-bottom,34px);
  --tabbar-h:0px;--accent:#7C3AED;
}
@media(prefers-color-scheme:dark){:root{
  --ios-bg:#000;--ios-bg2:#1C1C1E;--ios-bg3:#2C2C2E;
  --ios-sep:rgba(84,84,88,.65);--ios-label:#FFF;
  --ios-label2:rgba(235,235,245,.6);--ios-label3:rgba(235,235,245,.18);
  --ios-fill:rgba(120,120,128,.36);--ios-fill2:rgba(120,120,128,.32);
}}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
  background:var(--ios-bg);color:var(--ios-label);
  min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* ── NAVBAR ── */
.ios-nav{
  position:sticky;top:0;z-index:100;
  padding:calc(var(--safe-top) + 6px) 16px 10px;
  background:rgba(var(--nav-rgb,242,242,247),.85);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--ios-sep);display:flex;align-items:center;gap:10px;
}
@media(prefers-color-scheme:dark){.ios-nav{--nav-rgb:0,0,0}}
.ios-nav-back{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--ios-blue);font-size:16px;font-weight:400;cursor:pointer;padding:4px;
  font-family:inherit;
}
.ios-nav-back svg{flex-shrink:0}
.ios-nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--ios-label)}
.ios-nav-action{
  background:none;border:none;color:var(--ios-blue);
  font-size:15px;font-weight:500;cursor:pointer;padding:4px;font-family:inherit;
}
.ios-nav-icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--ios-fill);
  border:none;color:var(--ios-blue);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;flex-shrink:0;
}
/* ── LARGE TITLE ── */
.ios-large-title{
  font-size:34px;font-weight:700;color:var(--ios-label);
  letter-spacing:-.5px;padding:8px 20px 4px;
}
/* ── SECTION HEADER ── */
.ios-sec{
  font-size:13px;font-weight:600;color:var(--ios-gray);
  text-transform:uppercase;letter-spacing:.5px;padding:20px 20px 8px;
}
/* ── INSET LIST ── */
.ios-list{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;
  border-bottom:1px solid var(--ios-sep);cursor:pointer;transition:.1s;
  text-decoration:none;color:inherit;background:none;border:none;width:100%;text-align:left;font-family:inherit;
}
.ios-row:last-child{border-bottom:none}
.ios-row:active{background:var(--ios-fill2)}
.ios-row-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.ios-row-body{flex:1;min-width:0}
.ios-row-title{font-size:17px;color:var(--ios-label)}
.ios-row-sub{font-size:13px;color:var(--ios-label2);margin-top:1px}
.ios-row-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ios-chevron{color:var(--ios-label3);font-size:13px}
.ios-badge{min-width:20px;height:20px;border-radius:10px;background:var(--ios-red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* ── FORM ── */
.ios-form{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-field{padding:12px 16px;border-bottom:1px solid var(--ios-sep)}
.ios-field:last-child{border-bottom:none}
.ios-field-label{font-size:12px;font-weight:600;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ios-field input,.ios-field select,.ios-field textarea{
  width:100%;background:none;border:none;outline:none;
  font-size:17px;color:var(--ios-label);font-family:inherit;
  padding:2px 0;resize:none;
}
.ios-field input::placeholder,.ios-field textarea::placeholder{color:var(--ios-label3)}
.ios-field select{-webkit-appearance:none;appearance:none}
/* ── CARDS ── */
.ios-card{
  background:var(--ios-bg2);border-radius:var(--ios-radius-lg);
  margin:0 16px 12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
/* ── BUTTONS ── */
.ios-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;cursor:pointer;
  font-size:17px;font-weight:600;font-family:inherit;transition:.15s;width:100%;
}
.ios-btn:active{opacity:.8;transform:scale(.98)}
.ios-btn-primary{background:var(--ios-blue);color:#fff}
.ios-btn-green{background:var(--ios-green);color:#fff}
.ios-btn-red{background:var(--ios-red);color:#fff}
.ios-btn-gray{background:var(--ios-fill);color:var(--ios-label)}
.ios-btn-wrap{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
/* ── SIM/NÃO SEGMENTED ── */
.ios-seg{display:flex;background:var(--ios-fill);border-radius:9px;padding:2px;gap:2px}
.ios-seg-btn{
  flex:1;padding:8px;border:none;border-radius:7px;
  font-size:15px;font-weight:500;cursor:pointer;transition:.15s;
  background:none;color:var(--ios-label2);font-family:inherit;
}
.ios-seg-btn.active-sim{background:#fff;color:var(--ios-green);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ios-seg-btn.active-nao{background:#fff;color:var(--ios-red);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){
  .ios-seg-btn.active-sim,.ios-seg-btn.active-nao{background:var(--ios-bg3)}
}
/* ── STATUS PILL ── */
.ios-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
/* ── SEARCH ── */
.ios-search-wrap{padding:8px 16px 4px}
.ios-search{display:flex;align-items:center;gap:8px;background:var(--ios-fill);border-radius:10px;padding:8px 12px}
.ios-search input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--ios-label);font-family:inherit}
.ios-search input::placeholder{color:var(--ios-gray)}
/* ── EMPTY STATE ── */
.ios-empty{text-align:center;padding:60px 20px;color:var(--ios-gray)}
.ios-empty-icon{font-size:48px;margin-bottom:12px}
.ios-empty-title{font-size:17px;font-weight:600;color:var(--ios-label);margin-bottom:4px}
.ios-empty-sub{font-size:15px;color:var(--ios-gray)}
/* ── SHEET ── */
.ios-sheet-ov{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}
.ios-sheet-ov.open{display:block}
.ios-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:401;
  background:var(--ios-bg2);border-radius:14px 14px 0 0;
  padding-bottom:calc(var(--safe-bot)+8px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1);
  max-height:92vh;overflow-y:auto;
}
.ios-sheet.open{transform:none}
.ios-sheet-handle{width:36px;height:5px;border-radius:3px;background:var(--ios-fill);margin:8px auto 12px}
.ios-sheet-title{font-size:17px;font-weight:600;text-align:center;padding:0 20px 16px;color:var(--ios-label)}
/* ── FAB ── */
.ios-fab{
  position:fixed;bottom:calc(var(--safe-bot)+24px);right:20px;z-index:200;
  width:56px;height:56px;border-radius:28px;
  background:var(--ios-blue);color:#fff;border:none;
  font-size:28px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 16px rgba(0,122,255,.4);transition:.15s;
}
.ios-fab:active{transform:scale(.93);opacity:.9}
/* ── TOAST ── */
#ios-toast{
  position:fixed;bottom:calc(var(--tabbar-h)+24px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:.3s;
  pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;
}
#ios-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ── SPINNER ── */
@keyframes ios-spin{to{transform:rotate(360deg)}}
.ios-spinner{
  width:20px;height:20px;border:2.5px solid var(--ios-sep);
  border-top-color:var(--ios-blue);border-radius:50%;
  animation:ios-spin .7s linear infinite;display:inline-block;
}
/* ── STATUS BAR SAFE AREA ── */
.ios-scroll{padding-bottom:calc(var(--safe-bot)+24px)}
/* ── KANBAN CARD (manutenção) ── */
.ios-kcard{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  padding:12px 14px;margin-bottom:8px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:3px solid transparent;
  cursor:pointer;transition:.1s;
}
.ios-kcard:active{opacity:.7}
/* ── AVATAR CIRCLE ── */
.ios-av{
  width:36px;height:36px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
/* ── DIVIDER ── */
.ios-div{height:1px;background:var(--ios-sep);margin:0 16px}
/* ── SCROLL CONTENT ── */
.ios-content{padding:0 0 32px}


/* ── MANUTENÇÃO ESPECÍFICO ── */
.page{display:none;min-height:100vh}
.page.active{display:block}

/* STATUS COLUMNS - Horizontal scroll */
.kanban-scroll{overflow-x:auto;display:flex;gap:12px;padding:0 16px 16px;scrollbar-width:none}
.kanban-scroll::-webkit-scrollbar{display:none}
.kanban-col{flex-shrink:0;width:260px;background:var(--ios-bg2);border-radius:var(--ios-radius-lg);overflow:hidden}
.kanban-col-header{padding:12px 14px;display:flex;align-items:center;gap:8px}
.kanban-col-title{font-size:14px;font-weight:700;color:var(--ios-label)}
.kanban-col-count{min-width:22px;height:22px;border-radius:11px;background:var(--ios-fill);color:var(--ios-gray);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.kanban-cards{padding:0 10px 10px;min-height:60px}
.kcard{
  background:var(--ios-bg3);border-radius:var(--ios-radius);padding:12px;margin-bottom:8px;
  border-left:3px solid transparent;cursor:pointer;transition:.1s;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.kcard:active{opacity:.7}
.kcard-id{font-size:11px;font-weight:700;color:var(--ios-gray);margin-bottom:4px;font-family:monospace}
.kcard-frota{font-size:16px;font-weight:700;color:var(--ios-label)}
.kcard-desc{font-size:13px;color:var(--ios-label2);margin-top:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kcard-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.kcard-time{font-size:11px;color:var(--ios-gray)}
.kcard-prior{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 16px}
.stat-tile{background:var(--ios-bg2);border-radius:var(--ios-radius);padding:12px 8px;text-align:center}
.stat-num{font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:10px;font-weight:600;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.3px;margin-top:3px}

/* TABS */
.ios-tabs{display:flex;background:var(--ios-fill);border-radius:10px;padding:2px;margin:8px 16px 12px;gap:2px}
.ios-tab-btn{flex:1;padding:7px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:none;color:var(--ios-label2);font-family:inherit;transition:.15s}
.ios-tab-btn.active{background:var(--ios-bg2);color:var(--ios-label);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* OS CARD (list view) */
.os-card{
  background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;
  padding:14px 16px;cursor:pointer;transition:.1s;
  border-left:4px solid var(--ios-gray);
}
.os-card:active{opacity:.7}
.os-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.os-card-id{font-size:11px;font-weight:700;color:var(--ios-gray);font-family:monospace}
.os-card-frota{font-size:18px;font-weight:700;color:var(--ios-label)}
.os-card-desc{font-size:14px;color:var(--ios-label2);line-height:1.4;margin-top:4px}
.os-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.os-card-mecanico{font-size:12px;color:var(--ios-gray)}
.os-card-tempo{font-size:12px;color:var(--ios-orange);font-weight:600}

/* NOVA OS SHEET */
.field-group{padding:0 16px}
.field-group .ios-form{margin:0 0 8px}

/* PENDING BADGE */
.pend-badge{
  background:var(--ios-red);color:#fff;
  min-width:20px;height:20px;border-radius:10px;
  font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
}

/* STATUS COLORS */
.st-aberta{border-left-color:#FF3B30}
.st-andamento{border-left-color:#FF9500}
.st-agpeca{border-left-color:#32ADE6}
.st-externa{border-left-color:#AF52DE}
.st-concl{border-left-color:#34C759}

/* DETAIL MODAL */
#os-modal-ov{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
#os-modal-ov.open{display:flex;align-items:flex-end}
#os-modal{
  background:var(--ios-bg);width:100%;border-radius:14px 14px 0 0;
  max-height:94vh;overflow-y:auto;
  padding-bottom:calc(env(safe-area-inset-bottom)+16px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1);
}
#os-modal-ov.open #os-modal{transform:none}
.modal-handle{width:36px;height:5px;border-radius:3px;background:var(--ios-fill);margin:8px auto 0}
</style>
</head>
<body>

<!-- ══ PAGE PRINCIPAL ═══════════════════════════════════════ -->
<div id="page-main" class="page active">
  <div class="ios-nav">
    <button class="ios-nav-back" onclick="history.back()">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Central
    </button>
    <span class="ios-nav-title">Manutenção</span>
    <button class="ios-nav-action" onclick="abrirConfigs()">⚙</button>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="stats-row">
    <div class="stat-tile"><div class="stat-num" id="cnt-ab" style="color:var(--ios-red)">0</div><div class="stat-lbl">Abertas</div></div>
    <div class="stat-tile"><div class="stat-num" id="cnt-an" style="color:var(--ios-orange)">0</div><div class="stat-lbl">Andamento</div></div>
    <div class="stat-tile"><div class="stat-num" id="cnt-ag" style="color:var(--ios-teal)">0</div><div class="stat-lbl">Ag. Peça</div></div>
    <div class="stat-tile"><div class="stat-num" id="cnt-ex" style="color:var(--ios-purple)">0</div><div class="stat-lbl">Externa</div></div>
  </div>

  <!-- Tabs: Board / Pendências -->
  <div class="ios-tabs">
    <button class="ios-tab-btn active" id="tab-board" onclick="switchTab('board')">📋 Board</button>
    <button class="ios-tab-btn" id="tab-pend" onclick="switchTab('pend')">⚠ Pendências <span class="pend-badge" id="pend-cnt" style="display:none">0</span></button>
  </div>

  <!-- Board -->
  <div id="view-board">
    <div class="kanban-scroll" id="kanban-wrap"></div>
  </div>

  <!-- Pendências -->
  <div id="view-pend" style="display:none">
    <div id="pend-list"></div>
  </div>

  <!-- FAB Nova OS -->
  <button class="ios-fab" onclick="abrirNovaOS()" style="background:var(--ios-red)">+</button>
</div>

<!-- ══ OS DETAIL MODAL ══════════════════════════════════════ -->
<div id="os-modal-ov" onclick="fecharModal()">
  <div id="os-modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0">
      <div id="os-modal-title" style="font-size:20px;font-weight:700;color:var(--ios-label)">—</div>
      <button onclick="fecharModal()" style="background:var(--ios-fill);border:none;border-radius:14px;width:28px;height:28px;color:var(--ios-gray);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
    </div>
    <div id="os-modal-body" style="padding:0 16px 16px"></div>
  </div>
</div>

<!-- ══ NOVA OS SHEET ═════════════════════════════════════════ -->
<div class="ios-sheet-ov" id="nova-os-ov" onclick="fecharNovaOS()"></div>
<div class="ios-sheet" id="nova-os-sheet">
  <div class="ios-sheet-handle"></div>
  <div class="ios-sheet-title">Nova Ordem de Serviço</div>
  <div class="ios-form" style="margin:0 16px 8px">
    <div class="ios-field">
      <div class="ios-field-label">Frota</div>
      <input id="nos-frota" placeholder="VP-183" style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit">
    </div>
    <div class="ios-field">
      <div class="ios-field-label">Descrição do Serviço</div>
      <textarea id="nos-desc" placeholder="Descreva o problema ou serviço..." rows="3" style="font-size:15px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit;resize:none"></textarea>
    </div>
  </div>
  <div class="ios-form" style="margin:0 16px 8px">
    <div class="ios-field">
      <div class="ios-field-label">Prioridade</div>
      <select id="nos-prior" style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit">
        <option value="normal">Normal</option>
        <option value="alta">Alta</option>
        <option value="urgente">Urgente</option>
      </select>
    </div>
    <div class="ios-field">
      <div class="ios-field-label">Mecânico</div>
      <input id="nos-mec" placeholder="Nome do mecânico (opcional)" style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit">
    </div>
  </div>
  <div class="ios-btn-wrap">
    <button class="ios-btn ios-btn-red" onclick="criarNovaOS()">✚ Criar O.S.</button>
    <button class="ios-btn ios-btn-gray" onclick="fecharNovaOS()">Cancelar</button>
  </div>
</div>

<!-- TOAST -->
<div id="ios-toast"></div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5Du0iSrnD8X37xCCAVwic_3yPHrLKbTKLcx60tCfoahKcb5-kP6Efns6LndNaZDI-aQ/exec';
try { var _c=JSON.parse(localStorage.getItem('twm_config')||'{}'); if(_c.scriptUrl) SCRIPT_URL=_c.scriptUrl; } catch(e){}

var OS_KEY     = 'twm_manutencao_os';
var APAG_KEY   = 'twm_manut_apagados';
var ordens     = [];
var COLS       = ['aberta','andando','agpeca','externa','concl'];
var COLS_LBL   = {aberta:'Aberta',andando:'Andamento',agpeca:'Ag. Peça',externa:'Of. Externa',concl:'Concluída'};
var COLS_CLASS = {aberta:'ca',andando:'an',agpeca:'ag',externa:'ex',concl:'ok'};
var PRIO_COLORS= {urgente:'var(--red)',normal:'var(--amber)',baixa:'var(--green)'};
var _ctxOS=null, _ctxSV=null, _ctxCol='aberta';
var _fcOsId=null;
var _filtroBusca='', _filtroMec='', _filtroCol='', _filtroAtrasado=false;

// ════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════
function lerOS(){ try{return JSON.parse(localStorage.getItem(OS_KEY)||'[]');}catch(e){return[];} }
function salvarOS(){ localStorage.setItem(OS_KEY,JSON.stringify(ordens)); }
function uid(){ return Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase(); }
function hoje(){
  var d=new Date(), p=function(n){return String(n).padStart(2,'0');};
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}
function tempoDecorrido(ts){
  if(!ts) return '';
  var diff=Date.now()-ts, m=Math.floor(diff/60000), h=Math.floor(m/60), d=Math.floor(h/24);
  if(d>0) return d+'d';
  if(h>0) return h+'h';
  if(m>0) return m+'min';
  return 'agora';
}
function dataPrevBadge(prev){
  if(!prev) return '';
  var hoje2=new Date(); hoje2.setHours(0,0,0,0);
  var d=new Date(prev+'T00:00:00'); d.setHours(0,0,0,0);
  var diff=Math.floor((d-hoje2)/86400000);
  if(diff<0) return '<span class="fc-data-badge atrasado">'+Math.abs(diff)+'d atrasado</span>';
  if(diff===0) return '<span class="fc-data-badge hoje">vence hoje</span>';
  return '<span class="fc-data-badge ok">'+diff+'d restantes</span>';
}
function fmtData(ts){
  if(!ts) return '—';
  var d=new Date(ts), p=function(n){return String(n).padStart(2,'0');};
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function iniciais(nome){ if(!nome) return '?'; return nome.trim().split(' ').slice(0,2).map(function(n){return n[0];}).join('').toUpperCase(); }
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

// Toast
var _tt;
function toast(msg,tipo){
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='toast on'+(tipo?' '+tipo:'');
  clearTimeout(_tt); _tt=setTimeout(function(){el.className='toast';},3000);
}

// Modal simples
function oM(id){document.getElementById(id).classList.add('on');}
function fM(id){document.getElementById(id).classList.remove('on');}
document.querySelectorAll('.overlay').forEach(function(el){
  el.addEventListener('click',function(e){if(e.target===el)el.classList.remove('on');});
});

// Sync servidor
function sync(os){
  if(!SCRIPT_URL||!navigator.onLine) return;
  var p=new URLSearchParams({action:'salvarManutencao',id_os:os.id,frota:os.frota,
    prioridade:os.prioridade,status:os.status,origem:os.origem||'manual',
    motorista:os.motorista||'',data_aber:os.data_aber,servicos:JSON.stringify(os.servicos||[])});
  fetch(SCRIPT_URL+'?'+p.toString()).catch(function(){});
}

function atualizarStatusOS(os){
  var svs=os.servicos||[];
  var temPend   = svs.some(function(s){return s.status==='pend';});
  var todosFeitos = svs.every(function(s){return s.status==='concl'||s.status==='pend';});
  if(todosFeitos && temPend) os.status='pendente'; // sai do board, vai para aba Pendências
  else if(todosFeitos)       os.status='concl';
  else if(svs.some(function(s){return s.status==='externa';})) os.status='externa';
  else if(svs.some(function(s){return s.status==='agpeca';}))  os.status='agpeca';
  else if(svs.some(function(s){return s.status==='andando';})) os.status='andando';
  else os.status='aberta';
}

function addHistorico(os, txt){
  os.historico = os.historico || [];
  os.historico.push({txt:txt, ts:Date.now()});
}

// Carrega do servidor
function carregarDoServidor(){
  if(!SCRIPT_URL||!navigator.onLine) return;
  fetch(SCRIPT_URL+'?action=getManutencoes&status=all&_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(resp){
      if(!resp.ok) return;
      var local  = lerOS();
      var apag   = []; try{apag=JSON.parse(localStorage.getItem(APAG_KEY)||'[]');}catch(e){}
      var mudou  = false;

      // IDs que existem no servidor (exceto os apagados localmente)
      var idsServidor = (resp.ordens||[])
        .filter(function(o){ return apag.indexOf(o.id)<0; })
        .map(function(o){ return o.id; });

      // Remove locais que NÃO existem mais no servidor
      // (foram apagados na planilha)
      var localFiltrado = local.filter(function(o){
        // Mantém se: existe no servidor OU foi criado há menos de 2 min (ainda sincronizando)
        // OU está na lista de apagados localmente (já tratado)
        var noServidor = idsServidor.indexOf(o.id) >= 0;
        var recente    = o.ts && (Date.now() - o.ts) < 120000;
        if (!noServidor && !recente) { mudou = true; return false; }
        return true;
      });

      // Adiciona/atualiza do servidor
      var idsLocal = localFiltrado.map(function(o){ return o.id; });
      (resp.ordens||[]).forEach(function(o){
        if(apag.indexOf(o.id)>=0) return;
        if(idsLocal.indexOf(o.id)<0){
          o.ts=o.ts||Date.now(); localFiltrado.unshift(o); mudou=true;
        } else {
          var idx=localFiltrado.findIndex(function(l){return l.id===o.id;});
          if(idx>=0 && localFiltrado[idx].status!==o.status){
            localFiltrado[idx].status=o.status; mudou=true;
          }
        }
      });

      if(mudou){ ordens=localFiltrado; salvarOS(); render(); }
    }).catch(function(){});
}

// ════════════════════════════════════════
//  RENDER BOARD
// ════════════════════════════════════════
function render(){
  ordens = lerOS();
  // Remove OS sem frota que tenham mais de 10 minutos (são resíduos)
  var antes = ordens.length;
  ordens = ordens.filter(function(o){
    var temFrota = o.frota && o.frota.trim() && o.frota !== '—';
    var velha = !o.ts || (Date.now() - o.ts) > 600000; // mais de 10min
    return temFrota || !velha;
  });
  if(ordens.length < antes){ salvarOS(); }
  // Atualiza filtro mecânicos
  var mecs = new Set();
  ordens.forEach(function(o){
    (o.servicos||[]).forEach(function(sv){if(sv.mecanico)mecs.add(sv.mecanico);});
  });
  var selMec = document.getElementById('filtro-mec');
  var valAtual = selMec.value;
  selMec.innerHTML = '<option value="">Todos mecânicos</option>' +
    Array.from(mecs).map(function(m){return '<option value="'+m+'"'+(m===valAtual?' selected':'')+'>'+m+'</option>';}).join('');

  // Conta atrasadas
  var atrasadas = ordens.filter(function(o){
    return o.status!=='concl' && o.ts && (Date.now()-o.ts)>3*86400000;
  }).length;
  var btnAl = document.getElementById('btn-alerta');
  if(btnAl) btnAl.innerHTML = (atrasadas>0?'⚠️ Atrasadas <b style="background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px">'+atrasadas+'</b>':'⚠️ Atrasadas');

  var cnt={aberta:0,andando:0,agpeca:0,externa:0,concl:0};
  ordens.forEach(function(o){if(cnt[o.status]!==undefined)cnt[o.status]++;});
  document.getElementById('cnt-ab').textContent=cnt.aberta;
  document.getElementById('cnt-an').textContent=cnt.andando;
  document.getElementById('cnt-ag').textContent=cnt.agpeca;
  document.getElementById('cnt-ex').textContent=cnt.externa;
  document.getElementById('cnt-ok').textContent=cnt.concl;
  document.getElementById('cnt-all').textContent=ordens.length;

  var board = document.getElementById('board');

  // Coleta todas as pendências de todas as OS
  var todasPend = [];
  ordens.forEach(function(os){
    (os.servicos||[]).forEach(function(sv){
      if(sv.status === 'pend'){
        todasPend.push({
          os_id:    os.id,
          sv_id:    sv.id,
          frota:    os.frota || '—',
          descricao:sv.descricao || '',
          tipo:     sv.tipo || '',
          pend_nota:sv.pend_nota || ''
        });
      }
    });
  });

  board.innerHTML = COLS.map(function(col){
    var lista = ordens.filter(function(o){return o.status===col;});
    return '<div class="col '+COLS_CLASS[col]+'" id="col-wrap-'+col+'" data-col="'+col+'">' +
      '<div class="col-hd"><div class="col-title">' +
        '<div class="col-dot"></div>'+COLS_LBL[col]+
        '<span class="col-cnt" id="lbl-'+col+'">'+lista.length+'</span>'+
      '</div></div>' +
      '<div class="col-body" id="col-'+col+'" ondragover="dragOver(event,\''+col+'\')" ondrop="drop(event,\''+col+'\')">' +
        lista.map(renderCard).join('') +
        '<div class="empty-msg" style="display:'+(lista.length?'none':'block')+';text-align:center;padding:20px 10px;font-size:12px;color:var(--tx3)">Nenhuma O.S.</div>' +
      '</div>' +
      '<div class="col-footer"><button class="btn-nova-os" data-col="'+col+'" onclick="abrirNovaOS(this.dataset.col)">＋ Nova O.S.</button></div>' +
    '</div>';
  }).join('') + (function(){
    // Coluna de Pendências
    var rows = todasPend.length
      ? todasPend.map(function(p){
          return '<div class="pend-row" data-osid="'+p.os_id+'" onclick="abrirFC(this.dataset.osid)" title="'+p.tipo+'">' +
            '<div class="pend-row-frota">🚛 '+p.frota+'</div>' +
            '<div class="pend-row-texto">'+p.descricao+'</div>' +
            (p.pend_nota?'<div class="pend-row-nota">⏸ '+p.pend_nota+'</div>':'') +
          '</div>';
        }).join('')
      : '<div class="pend-empty-col">Nenhuma pendência</div>';

    return '<div class="col-pend">'+
      '<div class="col-pend-hd"><div class="col-pend-title">'+
        '<span>⚠️</span> Pendências'+
        '<span class="col-pend-cnt">'+todasPend.length+'</span>'+
      '</div></div>'+
      '<div class="col-pend-body">'+rows+'</div>'+
    '</div>';
  }());

  // Aplica filtros ativos
  aplicarFiltros();

  // Reaplica drag listeners
  document.querySelectorAll('.card').forEach(addDragListeners);
}

function renderCard(os){
  var fv=os.frota||''; var fCls=fv.match(/^VP/i)?'vp':fv.match(/^RB/i)?'rb':'outro';
  var prio=os.prioridade||'normal';
  var svs=os.servicos||[];
  var svAbertos=svs.filter(function(s){return s.status!=='concl'&&s.status!=='pend';}).length;
  var svTotal=svs.length;
  var mecPrincipal=svs.find(function(s){return s.mecanico;});
  var tempo=tempoDecorrido(os.ts);
  var comentarios=(os.comentarios||[]).length;
  var atrasado=os.status!=='concl'&&os.ts&&(Date.now()-os.ts)>3*86400000;
  var prevBadge=os.data_prev?dataPrevBadge(os.data_prev):'';

  return '<div class="card" id="card-'+os.id+'" draggable="true" data-id="'+os.id+'">' +
    '<div class="card-accent p-'+prio+'"></div>' +
    // Header clicável → abre fullcard
    '<div class="card-top" onclick="abrirFC(\''+os.id+'\')">' +
      '<div class="card-frota '+fCls+'">'+os.frota+'</div>' +
      '<div class="card-meta">' +
        '<span class="prio-tag '+prio+'">'+prio+'</span>' +
        (atrasado?'<span style="font-size:9px;font-weight:700;color:var(--red)">⚠️ Atrasada</span>':'') +
        prevBadge +
        '<span class="card-tempo">'+tempo+'</span>' +
      '</div>' +
      (os.origem==='checklist'?'<div class="card-origem">📋 '+(os.motorista||'Check List')+'</div>':'') +
    '</div>' +
    // Serviços
    '<div class="card-svs">' +
      svs.slice(0,3).map(function(sv){
        return '<div class="sv-chip '+sv.status+'">' +
          '<div class="sv-status-dot '+sv.status+'"></div>' +
          '<div class="sv-desc">'+sv.descricao+'</div>' +
        '</div>';
      }).join('') +
      (svs.length>3?'<div style="font-size:10px;color:var(--tx3);padding:2px 4px">+' +(svs.length-3)+' serviços</div>':'') +
    '</div>' +
    // Footer
    '<div class="card-footer">' +
      (mecPrincipal?
        '<div class="mec-avatar" title="'+mecPrincipal.mecanico+'">'+iniciais(mecPrincipal.mecanico)+'</div>' +
        '<div class="mec-name">'+mecPrincipal.mecanico+'</div>' :
        '<div style="font-size:11px;color:var(--tx3);flex:1">Sem mecânico</div>') +
      '<div class="card-actions">' +
        (comentarios?'<span class="card-comments-badge">💬'+comentarios+'</span>':'') +
        '<span style="font-size:10px;color:var(--tx3)">'+svAbertos+'/'+svTotal+' svs</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ════════════════════════════════════════
//  FILTROS
// ════════════════════════════════════════
function aplicarFiltros(){
  var q = norm(_filtroBusca);
  var mec = (_filtroMec||'').toLowerCase();
  ordens.forEach(function(os){
    var card=document.getElementById('card-'+os.id); if(!card) return;
    var txt = norm(os.frota+' '+(os.motorista||'')+' '+
      (os.servicos||[]).map(function(s){return s.descricao+' '+(s.mecanico||'');}).join(' '));
    var matchQ = !q || txt.includes(q);
    var matchM = !mec || (os.servicos||[]).some(function(s){return s.mecanico&&s.mecanico.toLowerCase().includes(mec);});
    var matchC = !_filtroCol || os.status===_filtroCol;
    var atrasado=os.status!=='concl'&&os.ts&&(Date.now()-os.ts)>3*86400000;
    var matchAt = !_filtroAtrasado || atrasado;
    card.classList.toggle('oculto', !(matchQ&&matchM&&matchC&&matchAt));
  });
}

function buscar(q){
  _filtroBusca=q||'';
  _filtroMec=document.getElementById('filtro-mec').value||'';
  var bx=document.getElementById('busca');
  bx.style.borderColor=q?'var(--ac)':'';
  aplicarFiltros();
}

function filtrarCol(col){
  _filtroCol=col; _filtroAtrasado=false;
  document.querySelectorAll('.res-card').forEach(function(el){el.style.boxShadow='';});
  aplicarFiltros();
}

function filtrarAtrasados(){
  _filtroAtrasado=!_filtroAtrasado; _filtroCol='';
  document.getElementById('btn-alerta').classList.toggle('on',_filtroAtrasado);
  aplicarFiltros();
}

// ════════════════════════════════════════
//  DRAG & DROP
// ════════════════════════════════════════
var _dragId=null;
function addDragListeners(card){
  card.addEventListener('dragstart',function(e){
    _dragId=card.dataset.id;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  });
  card.addEventListener('dragend',function(){
    card.classList.remove('dragging');
    document.querySelectorAll('.col-body').forEach(function(c){c.classList.remove('drag-over');});
  });
  // Touch drag
  var startY=0,startX=0,moving=false;
  card.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;startX=e.touches[0].clientX;_dragId=card.dataset.id;},{ passive:true });
  card.addEventListener('touchmove',function(e){
    if(!moving){moving=true;card.style.opacity='.5';}
    var el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
    document.querySelectorAll('.col-body').forEach(function(c){c.classList.remove('drag-over');});
    var colBody=el&&el.closest('.col-body');
    if(colBody) colBody.classList.add('drag-over');
  },{ passive:true });
  card.addEventListener('touchend',function(e){
    card.style.opacity='';moving=false;
    var el=document.elementFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
    var colBody=el&&el.closest('.col-body');
    if(colBody){var col=colBody.id.replace('col-','');moverOS(_dragId,col);}
    document.querySelectorAll('.col-body').forEach(function(c){c.classList.remove('drag-over');});
  });
}
function dragOver(e,col){
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.col-body').forEach(function(c){c.classList.remove('drag-over');});
  document.getElementById('col-'+col).classList.add('drag-over');
}
function drop(e,col){
  e.preventDefault();
  document.querySelectorAll('.col-body').forEach(function(c){c.classList.remove('drag-over');});
  if(_dragId) moverOS(_dragId,col);
}
function moverOS(osId,novoStatus){
  ordens=lerOS();
  var os=ordens.find(function(o){return o.id===osId;}); if(!os) return;
  if(os.status===novoStatus) return;
  var oldStatus=os.status;
  os.status=novoStatus;
  (os.servicos||[]).forEach(function(sv){if(sv.status!=='concl'&&sv.status!=='pend')sv.status=novoStatus;});
  addHistorico(os,'Movido: '+COLS_LBL[oldStatus]+' → '+COLS_LBL[novoStatus]);
  sync(os); salvarOS(); render();
  toast('Movido para '+COLS_LBL[novoStatus],'ok');
  if(_fcOsId===osId) abrirFC(osId);
}

function abrirFC(osId){
  _fcOsId=osId;
  ordens=lerOS();
  var os=ordens.find(function(o){return o.id===osId;}); if(!os) return;
  var prio=os.prioridade||'normal';
  var fv=os.frota||''; var fCls=fv.match(/^VP/i)?'vp':fv.match(/^RB/i)?'rb':'outro';

  // Accent
  document.getElementById('fc-accent').style.background=PRIO_COLORS[prio]||'var(--amber)';

  // Frota
  var fcFrota=document.getElementById('fc-frota');
  fcFrota.textContent=os.frota;
  fcFrota.className='fullcard-frota '+fCls;

  // Tags
  var atrasado=os.status!=='concl'&&os.ts&&(Date.now()-os.ts)>3*86400000;
  document.getElementById('fc-tags').innerHTML=
    '<span class="prio-tag '+prio+'">'+prio+'</span>'+
    '<span style="font-size:10px;color:var(--tx3)">'+COLS_LBL[os.status]+'</span>'+
    '<span style="font-size:10px;color:var(--tx3)">📅 '+os.data_aber+'</span>'+
    (os.ts?'<span style="font-size:10px;color:var(--tx3)">⏱ '+tempoDecorrido(os.ts)+'</span>':'')+
    (atrasado?'<span style="font-size:10px;font-weight:700;color:var(--red)">⚠️ Atrasada</span>':'')+
    (os.origem==='checklist'?'<span style="font-size:10px;color:var(--ac)">📋 Check List</span>':'');

  // Body
  var html='';

  // Serviços
  html+='<div class="fc-section"><div class="fc-section-title">Serviços ('+( os.servicos||[]).length+')</div>';
  (os.servicos||[]).forEach(function(sv){
    var stLbls={aberta:'Aberta',andando:'Em Andamento',concl:'Concluído',pend:'Pendência',agpeca:'Ag. Peça',externa:'Of. Externa'};
    html+='<div class="fc-sv '+sv.status+'">' +
      '<div class="fc-sv-top">' +
        '<div class="fc-sv-tipo">'+sv.tipo+'</div>' +
        '<span class="prio-tag" style="font-size:9px">'+( stLbls[sv.status]||sv.status)+'</span>' +
        '<button class="btn-sv-act edit" style="padding:3px 8px;font-size:11px" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirEditSV(this.dataset.oid,this.dataset.sid)">✎</button>' +
      '</div>' +
      '<div class="fc-sv-desc">'+sv.descricao+'</div>' +
      (sv.solucao?'<div class="fc-sv-extra sol">✅ '+sv.solucao+'</div>':'')+
      (sv.status==='pend'&&sv.pend_nota?'<div class="fc-sv-extra pend">⏸ '+sv.pend_nota+'</div>':'')+
      (sv.status==='agpeca'&&sv.ag_peca?'<div class="fc-sv-extra ag">⏳ Peça: '+sv.ag_peca+(sv.ag_prev?' · '+sv.ag_prev:'')+'</div>':'')+
      (sv.status==='externa'?'<div class="fc-sv-extra ext">🏭 '+(sv.oficina_nome||'Oficina')+(sv.oficina_prev?' · '+sv.oficina_prev:'')+'</div>':'')+
      (sv.mecanico?'<div style="font-size:11px;color:var(--tx3);margin-bottom:6px">👤 '+sv.mecanico+(sv.tempo?' · ⏱ '+sv.tempo:'')+'</div>':'')+
      '<div class="fc-sv-acts">';
    if(sv.status==='aberta'||sv.status==='andando'){
      html+='<button class="btn-sv-act ok" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirConcluir(this.dataset.oid,this.dataset.sid)">Concluir</button>'+
            '<button class="btn-sv-act warn" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirPend(this.dataset.oid,this.dataset.sid)">Pendência</button>'+
            (sv.status==='aberta'?'<button class="btn-sv-act move" data-oid="'+osId+'" data-sid="'+sv.id+'" data-st="andando" onclick="moverSV(this.dataset.oid,this.dataset.sid,this.dataset.st)">Andamento</button>':'')+
            '<button class="btn-sv-act ag" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirAgP(this.dataset.oid,this.dataset.sid)">Ag. Peça</button>'+
            '<button class="btn-sv-act ext" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirExt(this.dataset.oid,this.dataset.sid)">Of. Externa</button>'+
            '<button class="btn-sv-act move" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirMec(this.dataset.oid,this.dataset.sid)">'+(sv.mecanico?'✎ Mecânico':'+ Mecânico')+'</button>';
    } else if(sv.status==='agpeca'||sv.status==='pend'){
      html+='<button class="btn-sv-act ok" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirConcluir(this.dataset.oid,this.dataset.sid)">Concluir</button>'+
            '<button class="btn-sv-act move" data-oid="'+osId+'" data-sid="'+sv.id+'" data-st="aberta" onclick="moverSV(this.dataset.oid,this.dataset.sid,this.dataset.st)">Reabrir</button>';
    } else if(sv.status==='externa'){
      html+='<button class="btn-sv-act ok" data-oid="'+osId+'" data-sid="'+sv.id+'" onclick="abrirConcluir(this.dataset.oid,this.dataset.sid)">Retornou</button>'+
            '<button class="btn-sv-act move" data-oid="'+osId+'" data-sid="'+sv.id+'" data-st="andando" onclick="moverSV(this.dataset.oid,this.dataset.sid,this.dataset.st)">Voltar</button>';
    }
    html+='</div></div>';
  });
  html+='</div>';

  // Data prevista
  html+='<div class="fc-section"><div class="fc-section-title">Data Prevista de Conclusão</div>';
  html+='<div class="fc-data-row">' +
    '<input class="fc-data-inp" type="date" id="fc-data-prev" value="'+(os.data_prev||'')+'" onchange="salvarDataPrev(\''+osId+'\',this.value)">' +
    (os.data_prev?dataPrevBadge(os.data_prev):'<span style="font-size:11px;color:var(--tx3)">Sem data definida</span>')+
  '</div></div>';

  // Mover OS
  html+='<div class="fc-section"><div class="fc-section-title">Mover O.S. para...</div>';
  html+='<div class="fc-mover-opts">'+COLS.filter(function(c){return c!==os.status;}).map(function(c){
    return '<button class="btn-mover-col" data-col="'+c+'" onclick="moverOS(\''+osId+'\',this.dataset.col)">'+COLS_LBL[c]+'</button>';
  }).join('')+'</div></div>';

  // Histórico de movimentações
  var hist=os.historico||[];
  if(hist.length){
    html+='<div class="fc-section"><div class="fc-section-title">Histórico ('+hist.length+')</div>';
    hist.slice().reverse().forEach(function(h){
      html+='<div class="fc-hist-item"><div class="fc-hist-dot"></div>' +
        '<div><div class="fc-hist-txt">'+h.txt+'</div><div class="fc-hist-time">'+fmtData(h.ts)+'</div></div></div>';
    });
    html+='</div>';
  }

  // Comentários
  var coms=os.comentarios||[];
  html+='<div class="fc-section"><div class="fc-section-title">Comentários ('+coms.length+')</div>';
  if(coms.length){
    coms.slice().reverse().forEach(function(cm){
      html+='<div class="fc-comment">' +
        '<span class="fc-comment-autor">'+cm.autor+'</span>' +
        '<span class="fc-comment-time">'+fmtData(cm.ts)+'</span>' +
        '<div class="fc-comment-txt">'+cm.txt+'</div></div>';
    });
  }
  html+='<div class="fc-add-comment">' +
    '<input class="fc-comment-inp" id="fc-com-inp" placeholder="Adicionar comentário..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();enviarComentario(\''+osId+'\')}">' +
    '<button class="fc-comment-btn" onclick="enviarComentario(\''+osId+'\')">Enviar</button>' +
  '</div></div>';

  document.getElementById('fc-body').innerHTML=html;
  document.getElementById('fc-overlay').classList.add('on');
}

function moverSV(osId,svId,novoSt){
  ordens=lerOS();
  var os=ordens.find(function(o){return o.id===osId;});
  var sv=os&&os.servicos.find(function(s){return s.id===svId;});
  if(!sv) return;
  var old=sv.status; sv.status=novoSt;
  addHistorico(os,'Serviço ['+sv.tipo+']: '+old+' → '+novoSt);
  atualizarStatusOS(os); sync(os); salvarOS(); render();
  toast('Status atualizado','ok');
  if(_fcOsId===osId) abrirFC(osId);
}

      tempo:'',status:'aberta',solucao:'',ts:Date.now()});

  toast('✅ Serviço salvo','ok');

function showTab(tab) {
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('on'); });

// ── HISTÓRICO DE PENDÊNCIAS ───────────────────────
var _pendFiltro = 'todas';
var PEND_KEY    = 'twm_manut_pendencias';

function lerPendencias() {
  try { return JSON.parse(localStorage.getItem(PEND_KEY) || '[]'); } catch(e) { return []; }
}
function salvarPendencias(lista) {
  localStorage.setItem(PEND_KEY, JSON.stringify(lista));
}

// Chamado ao confirmar pendência — registra no histórico
function registrarPendencia(os, sv) {
  var lista = lerPendencias();
  // Evita duplicata
  var existe = lista.find(function(p){ return p.sv_id === sv.id && p.status === 'pendente'; });
  if (!existe) {
    var novaP = {
      id:       'P-'+ uid(),
      os_id:    os.id,
      sv_id:    sv.id,
      frota:    os.frota || '—',
      tipo:     sv.tipo  || '',
      descricao:sv.descricao || '',
      pend_nota:sv.pend_nota || '',
      mecanico: sv.mecanico  || '',
      motorista:os.motorista || '',
      data_pend:hoje(),
      ts_pend:  Date.now(),
      status:   'pendente',
      data_resol: '',
    };
    lista.unshift(novaP);
    salvarPendencias(lista);
    // Envia para planilha
    if (SCRIPT_URL && navigator.onLine) {
      var p = new URLSearchParams({
        action:    'salvarPendencia',
        id:        novaP.id,
        data:      novaP.data_pend,
        frota:     novaP.frota,
        servico:   novaP.tipo,
        descricao: novaP.descricao,
        motivo:    novaP.pend_nota,
        mecanico:  novaP.mecanico,
        motorista: novaP.motorista,
        status:    'Pendente',
        data_resol:''
      });
      fetch(SCRIPT_URL + '?' + p.toString()).catch(function(){});
    }
  }
  atualizarTabPend();
}

// Chamado ao concluir um serviço — marca pendência como resolvida
function resolverPendencia(svId) {
  var lista = lerPendencias();
  var p = lista.find(function(x){ return x.sv_id === svId && x.status === 'pendente'; });
  if (p) {
    p.status = 'resolvida';
    p.data_resol = hoje();
    salvarPendencias(lista);
    atualizarTabPend();
    // Atualiza na planilha
    if (SCRIPT_URL && navigator.onLine) {
      var pR = new URLSearchParams({
        action:    'resolverPendencia',
        id:        p.id,
        data_resol:p.data_resol
      });
      fetch(SCRIPT_URL + '?' + pR.toString()).catch(function(){});
    }
  }
}

function atualizarTabPend() {
  var lista  = lerPendencias();
  var qtPend = lista.filter(function(p){ return p.status === 'pendente'; }).length;
  var cnt    = document.getElementById('pend-tab-cnt');
  if (cnt) cnt.textContent = qtPend;
  document.getElementById('ps-total').textContent = lista.length;
  document.getElementById('ps-pend').textContent  = qtPend;
  document.getElementById('ps-resol').textContent  = lista.filter(function(p){ return p.status==='resolvida'; }).length;
}

function filtrarPend(filtro) {
  _pendFiltro = filtro;
  document.querySelectorAll('.pend-f-btn').forEach(function(b){ b.classList.remove('on'); });
  var btn = document.getElementById('pf-' + (filtro==='pendente'?'pend':filtro==='resolvida'?'resol':'todas'));
  if (btn) btn.classList.add('on');
  renderPendList();
}

function renderPendList() {
  var lista = lerPendencias();
  atualizarTabPend();

  if (_pendFiltro !== 'todas') lista = lista.filter(function(p){ return p.status === _pendFiltro; });

  var div = document.getElementById('lista-pend');
  if (!div) return;

  if (!lista.length) {
    div.innerHTML = '<div class="pend-empty">'+
      (_pendFiltro==='resolvida' ? '🎉 Nenhuma pendência resolvida ainda' :
       _pendFiltro==='pendente'  ? '✅ Sem pendências em aberto!' :
       '⚠️ Nenhuma pendência registrada') +
    '</div>';
    return;
  }

  div.innerHTML = lista.map(function(p){
    var resolvida = p.status === 'resolvida';
    return '<div class="pend-card'+(resolvida?' resolvida':'')+'">' +
      '<div class="pend-card-top">' +
        '<div class="pend-card-frota">🚛 '+p.frota+'</div>' +
        '<span class="pend-card-badge '+(resolvida?'resolvida':'pendente')+'">'+(resolvida?'✅ Resolvida':'⏸ Pendente')+'</span>' +
      '</div>' +
      '<div class="pend-card-tipo">'+p.tipo+'</div>' +
      '<div class="pend-card-desc">'+p.descricao+'</div>' +
      (p.pend_nota?'<div class="pend-card-motivo">⏸ '+p.pend_nota+'</div>':'') +
      '<div class="pend-card-meta">' +
        '<span>📅 Aberta: '+p.data_pend+'</span>' +
        (p.mecanico?'<span>🔧 '+p.mecanico+'</span>':'') +
        (p.motorista?'<span>👤 '+p.motorista+'</span>':'') +
        (resolvida&&p.data_resol?'<span style="color:var(--green)">✅ Resolvida: '+p.data_resol+'</span>':'') +
      '</div>' +
      (!resolvida?'<div class="pend-card-acoes">' +
        '<button class="btn-pend-ac btn-pend-ver" data-tab="board" data-osid="'+p.os_id+'" onclick="pendVerOS(this)">Ver O.S.</button>' +
        '<button class="btn-pend-ac btn-pend-ok" data-svid="'+p.sv_id+'" onclick="marcarResolvida(this.dataset.svid)">Resolvida</button>' +
        (isAdminMaster()?'<button class="btn-pend-ac" style="border-color:var(--red);color:var(--red);background:var(--red-bg)" data-pid="'+p.id+'" onclick="apagarPendencia(this.dataset.pid)">🗑</button>':'') +
      '</div>':'<div class="pend-card-acoes">'+
        (isAdminMaster()?'<button class="btn-pend-ac" style="border-color:var(--red);color:var(--red);background:var(--red-bg)" data-pid="'+p.id+'" onclick="apagarPendencia(this.dataset.pid)">🗑 Apagar</button>':'') +
      '</div>') +
    '</div>';
  }).join('');
}

function apagarPendencia(pid) {
  if (!isAdminMaster()) { toast('Sem permissão', 'err'); return; }
  if (!confirm('Apagar este registro de pendência?')) return;
  var lista = lerPendencias().filter(function(p){ return p.id !== pid; });
  salvarPendencias(lista);
  atualizarTabPend();
  renderPendList();
  toast('Registro apagado', 'ok');
}

function pendVerOS(btn) {
  var tab   = btn.dataset.tab;
  var osid  = btn.dataset.osid;
  showTab(tab);
  setTimeout(function(){ abrirFC(osid); }, 200);
}

function marcarResolvida(svId) {
  resolverPendencia(svId);
  ordens = lerOS();
  ordens.forEach(function(os){
    (os.servicos||[]).forEach(function(sv){
      if(sv.id === svId && sv.status === 'pend'){
        sv.status = 'andando'; // Volta para andamento (reabre no board)
        addHistorico(os, 'Pendência reaberta via aba Pendências');
        atualizarStatusOS(os);
        sync(os);
      }
    });
  });
  salvarOS();
  render();
  renderPendList();
  toast('🔧 Serviço reaberto no board','ok');
}

// ZOOM — muda tamanho das colunas (sem transform, sem travar scroll)
(function(){
  var zoomed = localStorage.getItem('twm_manut_zoom')==='1';
  var COL_NORMAL = 280, COL_ZOOM = 360;
  var FONT_SCALE  = zoomed ? 1.15 : 1;

  function apZoom(){
    var btn = document.getElementById('zoom-btn');
    // Aplica largura nas colunas
    document.querySelectorAll('.col').forEach(function(col){
      col.style.width = (zoomed ? COL_ZOOM : COL_NORMAL) + 'px';
      col.style.minWidth = (zoomed ? COL_ZOOM : COL_NORMAL) + 'px';
    });
    // Escala fonte dos cards
    document.querySelectorAll('.card').forEach(function(card){
      card.style.fontSize = zoomed ? '115%' : '';
    });
    if(btn) btn.textContent = zoomed ? '－' : '＋';
    localStorage.setItem('twm_manut_zoom', zoomed ? '1' : '0');
  }

  window.toggleZoom = function(){
    zoomed = !zoomed;
    apZoom();
  };

  // Aplica após cada render
  var _origRender = window.render;
  window.render = function(){
    if(_origRender) _origRender();
    setTimeout(apZoom, 30);
  };

  document.addEventListener('DOMContentLoaded', apZoom);
}());

window.onload=function(){
  render();
  atualizarTabPend();
  carregarDoServidor();
  // Verifica se veio do check list com uma OS específica para destacar
  try {
    var osDestaque = sessionStorage.getItem('twm_abrir_os');
    if (osDestaque) {
      sessionStorage.removeItem('twm_abrir_os');
      setTimeout(function(){
        var card = document.getElementById('card-' + osDestaque);
        if (card) {
          card.style.outline = '3px solid #f97316';
          card.style.boxShadow = '0 0 0 6px rgba(249,115,22,.2)';
          card.scrollIntoView({ behavior:'smooth', block:'center' });
          setTimeout(function(){ card.style.outline=''; card.style.boxShadow=''; }, 4000);
          // Abre o full card automaticamente
          abrirFC(osDestaque);
        }
      }, 600);
    }
  } catch(e) {}
  setInterval(carregarDoServidor,10000);
  var btn=document.getElementById('btn-cfg');
  if(btn)btn.style.display=isAdminMaster()?'':'none';
  var eu=document.getElementById('cfg-url');
  var cfg=JSON.parse(localStorage.getItem('twm_config')||'{}');
  if(eu&&cfg.scriptUrl)eu.value=cfg.scriptUrl;
};


// ══ iOS UI LAYER ══════════════════════════════════════════════

var _tabAtual = 'board';

function switchTab(t) {
  _tabAtual = t;
  document.getElementById('tab-board').classList.toggle('active', t==='board');
  document.getElementById('tab-pend').classList.toggle('active', t==='pend');
  document.getElementById('view-board').style.display = t==='board' ? '' : 'none';
  document.getElementById('view-pend').style.display  = t==='pend'  ? '' : 'none';
}

var ST_CFG = {
  aberta:    {label:'Aberta',     cor:'#FF3B30', bg:'rgba(255,59,48,.1)',   cls:'st-aberta'},
  andando:   {label:'Andamento',  cor:'#FF9500', bg:'rgba(255,149,0,.1)',   cls:'st-andamento'},
  agpeca:    {label:'Ag. Peça',   cor:'#32ADE6', bg:'rgba(50,173,230,.1)',  cls:'st-agpeca'},
  externa:   {label:'Externa',    cor:'#AF52DE', bg:'rgba(175,82,222,.1)',  cls:'st-externa'},
  concl:     {label:'Concluída',  cor:'#34C759', bg:'rgba(52,199,89,.1)',   cls:'st-concl'},
};
var COL_ORDER = ['aberta','andando','agpeca','externa','concl'];

function showToast(msg, dur) {
  var t = document.getElementById('ios-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('show'); }, dur||2500);
}

function renderBoard() {
  var wrap = document.getElementById('kanban-wrap');
  wrap.innerHTML = '';
  var counts = {aberta:0, andando:0, agpeca:0, externa:0};

  COL_ORDER.forEach(function(st) {
    var cfg = ST_CFG[st];
    var lista = ordens.filter(function(o){ return o.status===st; });
    if(counts[st]!==undefined) counts[st] = lista.length;

    var col = document.createElement('div');
    col.className = 'kanban-col';
    col.innerHTML = '<div class="kanban-col-header">'
      + '<div style="width:10px;height:10px;border-radius:50%;background:'+cfg.cor+'"></div>'
      + '<div class="kanban-col-title">'+cfg.label+'</div>'
      + '<div class="kanban-col-count">'+lista.length+'</div>'
      + '</div><div class="kanban-cards" id="col-'+st+'">';

    lista.forEach(function(os) {
      col.querySelector('.kanban-cards').appendChild(makeKCard(os));
    });

    // Add button
    var addBtn = document.createElement('button');
    addBtn.style.cssText = 'width:100%;padding:10px;background:none;border:1.5px dashed var(--ios-sep);border-radius:var(--ios-radius);color:var(--ios-label3);font-size:13px;cursor:pointer;font-family:inherit;margin-top:4px';
    addBtn.textContent = '+ Nova O.S.';
    addBtn.addEventListener('click', function(){ abrirNovaOS(st); });
    col.querySelector('.kanban-cards').appendChild(addBtn);

    wrap.appendChild(col);
  });

  // Update stats
  document.getElementById('cnt-ab').textContent = counts.aberta||0;
  document.getElementById('cnt-an').textContent = counts.andando||0;
  document.getElementById('cnt-ag').textContent = counts.agpeca||0;
  document.getElementById('cnt-ex').textContent = counts.externa||0;
}

function makeKCard(os) {
  var cfg = ST_CFG[os.status] || ST_CFG.aberta;
  var priorCfg = {urgente:{c:'#FF3B30',bg:'rgba(255,59,48,.15)'}, alta:{c:'#FF9500',bg:'rgba(255,149,0,.15)'}, normal:{c:'#8E8E93',bg:'rgba(142,142,147,.15)'}};
  var pc = priorCfg[os.prioridade]||priorCfg.normal;
  var card = document.createElement('div');
  card.className = 'kcard';
  card.style.borderLeftColor = cfg.cor;
  card.innerHTML = '<div class="kcard-id">'+os.id+'</div>'
    + '<div class="kcard-frota">'+os.frota+'</div>'
    + '<div class="kcard-desc">'+(os.descricao||os.servicos&&os.servicos[0]&&os.servicos[0].desc||'—')+'</div>'
    + '<div class="kcard-meta">'
    + '<span class="kcard-time">'+(os.mecanico||'Sem mecânico')+'</span>'
    + '<span class="kcard-prior" style="background:'+pc.bg+';color:'+pc.c+'">'+os.prioridade+'</span>'
    + '</div>';
  card.addEventListener('click', function(){ abrirOSModal(os); });
  return card;
}

function abrirOSModal(os) {
  var cfg = ST_CFG[os.status]||ST_CFG.aberta;
  document.getElementById('os-modal-title').textContent = os.frota + ' — ' + os.id;
  
  var body = '';
  body += '<div style="margin:8px 0 12px"><span style="background:'+cfg.bg+';color:'+cfg.cor+';padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700">'+cfg.label+'</span></div>';
  
  var campos = [
    ['Frota', os.frota],
    ['Prioridade', os.prioridade||'normal'],
    ['Mecânico', os.mecanico||'—'],
    ['Abertura', os.data_aber||os.data||'—'],
    ['Motorista', os.motorista||'—'],
    ['Descrição', os.descricao||(os.servicos&&os.servicos[0]&&os.servicos[0].desc)||'—'],
  ];
  campos.forEach(function(c) {
    body += '<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--ios-sep)">'
      + '<span style="font-size:15px;color:var(--ios-label2)">'+c[0]+'</span>'
      + '<span style="font-size:15px;font-weight:500;color:var(--ios-label);text-align:right;max-width:60%">'+c[1]+'</span>'
      + '</div>';
  });

  // Ações de status
  body += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Mover para</div>';
  body += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
  COL_ORDER.filter(function(s){ return s!==os.status; }).forEach(function(st) {
    var c = ST_CFG[st];
    var btn = document.createElement('button');
    btn.style.cssText = 'flex:1;min-width:80px;padding:9px 6px;border:none;border-radius:10px;background:'+c.bg+';color:'+c.cor+';font-size:13px;font-weight:700;cursor:pointer;font-family:inherit';
    btn.textContent = c.label;
    btn.addEventListener('click', (function(oid,s){ return function(){ moverOS(oid,s); }; })(os.id, st));
    var bDiv = document.createElement('div');
    bDiv.style.cssText = 'flex:1;min-width:80px';
    bDiv.appendChild(btn);
    body += bDiv.outerHTML;
  });
  body += '</div></div>';

  document.getElementById('os-modal-body').innerHTML = body;
  // Apagar button via DOM to avoid quote issues
  var apagarBtn = document.createElement('button');
  apagarBtn.style.cssText = 'width:100%;padding:13px;background:rgba(255,59,48,.1);border:none;border-radius:12px;color:var(--ios-red);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:12px';
  apagarBtn.textContent = '🗑 Apagar O.S.';
  apagarBtn.addEventListener('click', (function(oid){ return function(){ confirmarApagar(oid); }; })(os.id));
  document.getElementById('os-modal-body').appendChild(apagarBtn);
  document.getElementById('os-modal-ov').classList.add('open');
}

function fecharModal() {
  document.getElementById('os-modal-ov').classList.remove('open');
}

function moverOS(id, novoStatus) {
  var os = ordens.find(function(o){ return o.id===id; });
  if(!os) return;
  os.status = novoStatus;
  salvarOS(os);
  fecharModal();
  renderBoard();
  showToast('✅ O.S. movida para ' + (ST_CFG[novoStatus]||{label:novoStatus}).label);
}

function confirmarApagar(id) {
  if(!confirm('Apagar a O.S. ' + id + '?')) return;
  apagarOS(id);
  fecharModal();
  renderBoard();
  showToast('O.S. apagada');
}

function abrirNovaOS(statusInicial) {
  document.getElementById('nova-os-ov').classList.add('open');
  document.getElementById('nova-os-sheet').classList.add('open');
  document.getElementById('nos-frota').focus();
}

function fecharNovaOS() {
  document.getElementById('nova-os-ov').classList.remove('open');
  document.getElementById('nova-os-sheet').classList.remove('open');
}

function criarNovaOS() {
  var frota = document.getElementById('nos-frota').value.trim().toUpperCase();
  var desc  = document.getElementById('nos-desc').value.trim();
  var prior = document.getElementById('nos-prior').value;
  var mec   = document.getElementById('nos-mec').value.trim();
  if(!frota||!desc) { showToast('⚠ Preencha frota e descrição'); return; }

  var agora = new Date();
  var dataStr = ('0'+agora.getDate()).slice(-2)+'/'
    +('0'+(agora.getMonth()+1)).slice(-2)+'/'+agora.getFullYear()+' '
    +('0'+agora.getHours()).slice(-2)+':'+('0'+agora.getMinutes()).slice(-2);
  var os = {
    id: 'OS-' + Date.now().toString(36).toUpperCase(),
    frota: frota, status: 'aberta', prioridade: prior,
    mecanico: mec, data_aber: dataStr, origem: 'manual',
    descricao: desc, servicos: [{desc:desc,status:'pendente'}],
    historico: [{txt:'O.S. criada',data:dataStr}]
  };
  ordens.unshift(os);
  salvarOS(os);
  fecharNovaOS();
  renderBoard();
  showToast('✅ O.S. criada — ' + os.id);
  document.getElementById('nos-frota').value='';
  document.getElementById('nos-desc').value='';
}

function abrirConfigs() {
  var url = prompt('URL do script de manutenção:', SCRIPT_URL||'');
  if(url!==null && url.trim()) {
    SCRIPT_URL = url.trim();
    var cfg = JSON.parse(localStorage.getItem('twm_config')||'{}');
    cfg.scriptUrl = SCRIPT_URL;
    localStorage.setItem('twm_config', JSON.stringify(cfg));
    showToast('✅ URL salva');
  }
}

// Render pendências
function renderPend() {
  var el = document.getElementById('pend-list');
  var pend = pendencias || [];
  var badge = document.getElementById('pend-cnt');
  badge.textContent = pend.length;
  badge.style.display = pend.length ? '' : 'none';
  if(!pend.length) {
    el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">✅</div><div class="ios-empty-title">Sem pendências</div><div class="ios-empty-sub">Tudo em dia!</div></div>';
    return;
  }
  el.innerHTML = '';
  pend.forEach(function(p) {
    var div = document.createElement('div');
    div.className = 'os-card st-andamento';
    div.style.borderLeftColor = '#FF9500';
    div.innerHTML = '<div class="os-card-header"><span class="os-card-id">'+(p.id||'')+'</span>'
      + '<span class="ios-pill" style="background:rgba(255,149,0,.15);color:#FF9500">Pendente</span></div>'
      + '<div class="os-card-frota">'+(p.frota||p.veiculo||'—')+'</div>'
      + '<div class="os-card-desc">'+(p.desc||p.descricao||'—')+'</div>';
    el.appendChild(div);
  });
}

// Hook na função existente de renderização
var _origRefresh = typeof refreshUI === 'function' ? refreshUI : null;
function refreshUI() {
  if(_origRefresh) _origRefresh();
  renderBoard();
  renderPend();
}

// Boot
init();
</script>
