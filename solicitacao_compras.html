<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Compras — TWM</title>
<style>
/* ═══════════════════════════════════════════════════════════
   TWM iOS DESIGN SYSTEM — Compartilhado entre todos os módulos
   ═══════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ios-bg:#F2F2F7;--ios-bg2:#FFFFFF;--ios-bg3:#F2F2F7;
  --ios-sep:rgba(60,60,67,.12);--ios-blue:#007AFF;--ios-green:#34C759;
  --ios-orange:#FF9500;--ios-red:#FF3B30;--ios-purple:#AF52DE;
  --ios-teal:#32ADE6;--ios-indigo:#5856D6;--ios-gray:#8E8E93;--ios-gray2:#AEAEB2;
  --ios-label:#000;--ios-label2:rgba(60,60,67,.6);--ios-label3:rgba(60,60,67,.3);
  --ios-fill:rgba(120,120,128,.2);--ios-fill2:rgba(120,120,128,.16);
  --ios-radius:13px;--ios-radius-lg:22px;
  --safe-top:env(safe-area-inset-top,44px);--safe-bot:env(safe-area-inset-bottom,34px);
  --tabbar-h:0px;--accent:#7C3AED;
}
@media(prefers-color-scheme:dark){:root{
  --ios-bg:#000;--ios-bg2:#1C1C1E;--ios-bg3:#2C2C2E;
  --ios-sep:rgba(84,84,88,.65);--ios-label:#FFF;
  --ios-label2:rgba(235,235,245,.6);--ios-label3:rgba(235,235,245,.18);
  --ios-fill:rgba(120,120,128,.36);--ios-fill2:rgba(120,120,128,.32);
}}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
  background:var(--ios-bg);color:var(--ios-label);
  min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* ── NAVBAR ── */
.ios-nav{
  position:sticky;top:0;z-index:100;
  padding:calc(var(--safe-top) + 6px) 16px 10px;
  background:rgba(var(--nav-rgb,242,242,247),.85);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--ios-sep);display:flex;align-items:center;gap:10px;
}
@media(prefers-color-scheme:dark){.ios-nav{--nav-rgb:0,0,0}}
.ios-nav-back{
  display:flex;align-items:center;gap:4px;background:none;border:none;
  color:var(--ios-blue);font-size:16px;font-weight:400;cursor:pointer;padding:4px;
  font-family:inherit;
}
.ios-nav-back svg{flex-shrink:0}
.ios-nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;color:var(--ios-label)}
.ios-nav-action{
  background:none;border:none;color:var(--ios-blue);
  font-size:15px;font-weight:500;cursor:pointer;padding:4px;font-family:inherit;
}
.ios-nav-icon-btn{
  width:34px;height:34px;border-radius:50%;background:var(--ios-fill);
  border:none;color:var(--ios-blue);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;flex-shrink:0;
}
/* ── LARGE TITLE ── */
.ios-large-title{
  font-size:34px;font-weight:700;color:var(--ios-label);
  letter-spacing:-.5px;padding:8px 20px 4px;
}
/* ── SECTION HEADER ── */
.ios-sec{
  font-size:13px;font-weight:600;color:var(--ios-gray);
  text-transform:uppercase;letter-spacing:.5px;padding:20px 20px 8px;
}
/* ── INSET LIST ── */
.ios-list{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;
  border-bottom:1px solid var(--ios-sep);cursor:pointer;transition:.1s;
  text-decoration:none;color:inherit;background:none;border:none;width:100%;text-align:left;font-family:inherit;
}
.ios-row:last-child{border-bottom:none}
.ios-row:active{background:var(--ios-fill2)}
.ios-row-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.ios-row-body{flex:1;min-width:0}
.ios-row-title{font-size:17px;color:var(--ios-label)}
.ios-row-sub{font-size:13px;color:var(--ios-label2);margin-top:1px}
.ios-row-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ios-chevron{color:var(--ios-label3);font-size:13px}
.ios-badge{min-width:20px;height:20px;border-radius:10px;background:var(--ios-red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* ── FORM ── */
.ios-form{background:var(--ios-bg2);border-radius:var(--ios-radius);margin:0 16px 8px;overflow:hidden}
.ios-field{padding:12px 16px;border-bottom:1px solid var(--ios-sep)}
.ios-field:last-child{border-bottom:none}
.ios-field-label{font-size:12px;font-weight:600;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ios-field input,.ios-field select,.ios-field textarea{
  width:100%;background:none;border:none;outline:none;
  font-size:17px;color:var(--ios-label);font-family:inherit;
  padding:2px 0;resize:none;
}
.ios-field input::placeholder,.ios-field textarea::placeholder{color:var(--ios-label3)}
.ios-field select{-webkit-appearance:none;appearance:none}
/* ── CARDS ── */
.ios-card{
  background:var(--ios-bg2);border-radius:var(--ios-radius-lg);
  margin:0 16px 12px;padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
/* ── BUTTONS ── */
.ios-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;cursor:pointer;
  font-size:17px;font-weight:600;font-family:inherit;transition:.15s;width:100%;
}
.ios-btn:active{opacity:.8;transform:scale(.98)}
.ios-btn-primary{background:var(--ios-blue);color:#fff}
.ios-btn-green{background:var(--ios-green);color:#fff}
.ios-btn-red{background:var(--ios-red);color:#fff}
.ios-btn-gray{background:var(--ios-fill);color:var(--ios-label)}
.ios-btn-wrap{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
/* ── SIM/NÃO SEGMENTED ── */
.ios-seg{display:flex;background:var(--ios-fill);border-radius:9px;padding:2px;gap:2px}
.ios-seg-btn{
  flex:1;padding:8px;border:none;border-radius:7px;
  font-size:15px;font-weight:500;cursor:pointer;transition:.15s;
  background:none;color:var(--ios-label2);font-family:inherit;
}
.ios-seg-btn.active-sim{background:#fff;color:var(--ios-green);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ios-seg-btn.active-nao{background:#fff;color:var(--ios-red);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media(prefers-color-scheme:dark){
  .ios-seg-btn.active-sim,.ios-seg-btn.active-nao{background:var(--ios-bg3)}
}
/* ── STATUS PILL ── */
.ios-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
/* ── SEARCH ── */
.ios-search-wrap{padding:8px 16px 4px}
.ios-search{display:flex;align-items:center;gap:8px;background:var(--ios-fill);border-radius:10px;padding:8px 12px}
.ios-search input{flex:1;background:none;border:none;outline:none;font-size:16px;color:var(--ios-label);font-family:inherit}
.ios-search input::placeholder{color:var(--ios-gray)}
/* ── EMPTY STATE ── */
.ios-empty{text-align:center;padding:60px 20px;color:var(--ios-gray)}
.ios-empty-icon{font-size:48px;margin-bottom:12px}
.ios-empty-title{font-size:17px;font-weight:600;color:var(--ios-label);margin-bottom:4px}
.ios-empty-sub{font-size:15px;color:var(--ios-gray)}
/* ── SHEET ── */
.ios-sheet-ov{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}
.ios-sheet-ov.open{display:block}
.ios-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:401;
  background:var(--ios-bg2);border-radius:14px 14px 0 0;
  padding-bottom:calc(var(--safe-bot)+8px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1);
  max-height:92vh;overflow-y:auto;
}
.ios-sheet.open{transform:none}
.ios-sheet-handle{width:36px;height:5px;border-radius:3px;background:var(--ios-fill);margin:8px auto 12px}
.ios-sheet-title{font-size:17px;font-weight:600;text-align:center;padding:0 20px 16px;color:var(--ios-label)}
/* ── FAB ── */
.ios-fab{
  position:fixed;bottom:calc(var(--safe-bot)+24px);right:20px;z-index:200;
  width:56px;height:56px;border-radius:28px;
  background:var(--ios-blue);color:#fff;border:none;
  font-size:28px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 16px rgba(0,122,255,.4);transition:.15s;
}
.ios-fab:active{transform:scale(.93);opacity:.9}
/* ── TOAST ── */
#ios-toast{
  position:fixed;bottom:calc(var(--tabbar-h)+24px);left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:.3s;
  pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;
}
#ios-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ── SPINNER ── */
@keyframes ios-spin{to{transform:rotate(360deg)}}
.ios-spinner{
  width:20px;height:20px;border:2.5px solid var(--ios-sep);
  border-top-color:var(--ios-blue);border-radius:50%;
  animation:ios-spin .7s linear infinite;display:inline-block;
}
/* ── STATUS BAR SAFE AREA ── */
.ios-scroll{padding-bottom:calc(var(--safe-bot)+24px)}
/* ── KANBAN CARD (manutenção) ── */
.ios-kcard{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  padding:12px 14px;margin-bottom:8px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:3px solid transparent;
  cursor:pointer;transition:.1s;
}
.ios-kcard:active{opacity:.7}
/* ── AVATAR CIRCLE ── */
.ios-av{
  width:36px;height:36px;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;flex-shrink:0;
}
/* ── DIVIDER ── */
.ios-div{height:1px;background:var(--ios-sep);margin:0 16px}
/* ── SCROLL CONTENT ── */
.ios-content{padding:0 0 32px}


.page{display:none;min-height:100vh}
.page.active{display:block}

/* STATUS PILLS */
.st-pend  {background:rgba(255,149,0,.15);color:#FF9500}
.st-aprov {background:rgba(52,199,89,.15);color:#34C759}
.st-repr  {background:rgba(255,59,48,.15);color:#FF3B30}
.st-orc   {background:rgba(0,122,255,.15);color:#007AFF}
.st-compr {background:rgba(175,82,222,.15);color:#AF52DE}

/* PEDIDO CARD */
.ped-card{
  background:var(--ios-bg2);border-radius:var(--ios-radius);
  margin:0 16px 8px;padding:14px 16px;cursor:pointer;
  transition:.1s;border-left:4px solid var(--ios-orange);
}
.ped-card:active{opacity:.7}
.ped-card.aprov{border-left-color:#34C759}
.ped-card.repr {border-left-color:#FF3B30}
.ped-card.orc  {border-left-color:#007AFF}
.ped-card.compr{border-left-color:#AF52DE}
.ped-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ped-id{font-size:11px;font-weight:700;color:var(--ios-gray);font-family:monospace}
.ped-frota{font-size:18px;font-weight:700;color:var(--ios-label)}
.ped-desc{font-size:14px;color:var(--ios-label2);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ped-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ped-data{font-size:12px;color:var(--ios-gray)}
.ped-solicitante{font-size:12px;color:var(--ios-gray)}

/* FOTO PREVIEW */
.foto-thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;cursor:pointer}
.fotos-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* FILTER CHIPS */
.chips{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;font-family:inherit;background:var(--ios-fill);color:var(--ios-label2);transition:.15s}
.chip.active{background:var(--ios-blue);color:#fff}

/* MODAL */
#ped-modal-ov{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
#ped-modal-ov.open{display:flex;align-items:flex-end}
#ped-modal{background:var(--ios-bg);width:100%;border-radius:14px 14px 0 0;max-height:94vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom)+16px);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
#ped-modal-ov.open #ped-modal{transform:none}

/* NOVO PEDIDO SHEET */
#novo-ov{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);backdrop-filter:blur(8px)}
#novo-ov.open{display:flex;align-items:flex-end}
#novo-sheet{background:var(--ios-bg);width:100%;border-radius:14px 14px 0 0;max-height:96vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom)+16px);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1,.23,1)}
#novo-sheet.open{transform:none}

/* UPLOAD AREA */
.upload-area{border:2px dashed var(--ios-sep);border-radius:var(--ios-radius);padding:24px;text-align:center;cursor:pointer;color:var(--ios-gray)}
.upload-area:active{background:var(--ios-fill2)}
</style>
</head>
<body>

<!-- ══ PAGE LISTA ═══════════════════════════════════════════ -->
<div id="page-lista" class="page active">
  <div class="ios-nav">
    <button class="ios-nav-back" onclick="history.back()">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Central
    </button>
    <span class="ios-nav-title">Compras</span>
    <button class="ios-nav-action" onclick="carregarPedidos()" style="font-size:18px">↻</button>
  </div>

  <div style="padding:8px 20px 0"><div class="ios-large-title">Solicitações</div></div>

  <div class="ios-search-wrap">
    <div class="ios-search">
      <span style="color:var(--ios-gray);font-size:15px">🔍</span>
      <input id="srch-ped" placeholder="Buscar pedido, frota, item..." oninput="filtrarPedidos(this.value)">
    </div>
  </div>

  <div class="chips">
    <button class="chip active" onclick="setChip('todos',this)">Todos</button>
    <button class="chip" onclick="setChip('pendente',this)">⏳ Pendente</button>
    <button class="chip" onclick="setChip('orc',this)">💬 Orçando</button>
    <button class="chip" onclick="setChip('aprovado',this)">✅ Aprovado</button>
    <button class="chip" onclick="setChip('comprado',this)">🛒 Comprado</button>
    <button class="chip" onclick="setChip('reprovado',this)">❌ Reprovado</button>
  </div>

  <div id="lista-pedidos">
    <div class="ios-empty"><div class="ios-spinner" style="margin:40px auto"></div></div>
  </div>

  <button class="ios-fab" onclick="abrirNovoPedido()">+</button>
</div>

<!-- ══ MODAL DETALHE ════════════════════════════════════════ -->
<div id="ped-modal-ov" onclick="fecharModal()">
  <div id="ped-modal" onclick="event.stopPropagation()">
    <div style="width:36px;height:5px;border-radius:3px;background:var(--ios-fill);margin:8px auto 0"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0">
      <div id="modal-frota" style="font-size:20px;font-weight:700">—</div>
      <button onclick="fecharModal()" style="background:var(--ios-fill);border:none;border-radius:14px;width:28px;height:28px;color:var(--ios-gray);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>
    </div>
    <div id="modal-body" style="padding:0 16px 16px"></div>
  </div>
</div>

<!-- ══ NOVO PEDIDO SHEET ════════════════════════════════════ -->
<div id="novo-ov" onclick="fecharNovo()"></div>
<div id="novo-sheet">
  <div style="width:36px;height:5px;border-radius:3px;background:var(--ios-fill);margin:8px auto 0"></div>
  <div style="font-size:17px;font-weight:700;text-align:center;padding:12px 16px 8px;color:var(--ios-label)">Nova Solicitação</div>

  <div class="ios-form" style="margin:0 16px 8px">
    <div class="ios-field">
      <div class="ios-field-label">Frota / Setor</div>
      <input id="n-frota" placeholder="VP-183, Oficina..." style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit">
    </div>
    <div class="ios-field">
      <div class="ios-field-label">Item(ns) Solicitado(s)</div>
      <textarea id="n-desc" placeholder="Descreva os itens necessários..." rows="3" style="font-size:15px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit;resize:none"></textarea>
    </div>
    <div class="ios-field">
      <div class="ios-field-label">Urgência</div>
      <select id="n-urgencia" style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit">
        <option value="normal">Normal</option>
        <option value="urgente">Urgente</option>
        <option value="critico">Crítico</option>
      </select>
    </div>
    <div class="ios-field">
      <div class="ios-field-label">Observações</div>
      <input id="n-obs" placeholder="Opcional..." style="font-size:17px;color:var(--ios-label);background:none;border:none;width:100%;outline:none;font-family:inherit">
    </div>
  </div>

  <!-- Upload Fotos -->
  <div style="padding:0 16px 8px">
    <div class="ios-field-label" style="margin-bottom:8px">FOTOS (opcional)</div>
    <div class="upload-area" onclick="document.getElementById('n-foto-file').click()">
      <div style="font-size:32px;margin-bottom:6px">📷</div>
      <div style="font-size:15px;font-weight:500">Toque para adicionar foto</div>
      <div style="font-size:13px;margin-top:2px">Câmera ou galeria</div>
    </div>
    <input type="file" id="n-foto-file" accept="image/*" multiple style="display:none" onchange="previewFotosNovo(this)">
    <div id="n-fotos-preview" class="fotos-row" style="margin-top:8px"></div>
  </div>

  <div class="ios-btn-wrap">
    <button class="ios-btn ios-btn-primary" onclick="enviarNovoPedido()">📤 Enviar Solicitação</button>
    <button class="ios-btn ios-btn-gray" onclick="fecharNovo()">Cancelar</button>
  </div>
</div>

<div id="ios-toast"></div>

<script>
// O script precisa aceitar: action=getPedidos | action=savePedido | action=updateStatus
// IMPORTANTE: após republicar o Apps Script, rode no console:
//   localStorage.setItem('twm_compras_script', 'https://script.google.com/macros/s/SUA_NOVA_URL/exec')
var SCRIPT_URL = localStorage.getItem('twm_compras_script') || 'https://script.google.com/macros/s/AKfycbyEG37aoa1NuTtmyeXRNeNYa7-BvOiK5WwBdr2jsfdppoexxZ5yeFiULWORO47BCQPZ/exec';

// Aba da planilha com pedidos
var SHEET_NAME = 'Planilha1';

// Cache local
var CACHE_KEY = 'twm_compras_pedidos';
var FILTRO_KEY = 'twm_compras_filtro';

// ══════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════
var pedidos       = [];
var filtroAtual   = localStorage.getItem(FILTRO_KEY) || 'todos';
var nivelAtual    = 'NORMAL';
var itensPedido   = [];
var pedidoDetalhe = null;
var fotosNovas    = [];   // fotos do formulário novo
var viewerFotos   = [];   // URLs no viewer
var viewerIdx     = 0;

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
(function init() {
  // Aplica tema
  aplicarTema();

  // Restaura usuário
  try {
    var u = JSON.parse(localStorage.getItem('twm_user_cache') || '{}');
    if (u.nome) {
      (document.getElementById('hd-sub-user')||{textContent:''}).textContent = u.nome.split(' ')[0] + ' — TWM Transportes';
      (document.getElementById('f-solicitante')||{value:''}).value = u.nome || '';
    }
  } catch(e) {}

  // Carrega do cache primeiro
  try {
    var cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
    if (cached.length) { pedidos = cached; renderLista(); renderStats(); }
  } catch(e) {}

  // Aplica filtro salvo
  aplicarChip(filtroAtual);

  // Busca dados frescos
  buscarPedidos();
})();

// ══════════════════════════════════════════════
//  TEMA
// ══════════════════════════════════════════════
function aplicarTema() {
  var p = localStorage.getItem('twm_tema') || 'auto';

var SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(SHEET_NAME);

function buscarPedidos() {
  if (!SCRIPT_URL) {
    if (pedidos.length === 0) {
      var _lx = document.getElementById('lista-pedidos') || document.getElementById('lista-wrap');
      if(_lx) _lx.innerHTML =
        '<div class="empty"><div class="empty-ico">⚙️</div><div class="empty-txt">Script não configurado</div><div class="empty-sub">SCRIPT_URL não definida</div></div>';
    }
    return;
  }
  var xhr = new XMLHttpRequest();
  xhr.timeout = 15000;
  xhr.open('GET', SCRIPT_URL + '?action=getPedidos&_=' + Date.now(), true);
  xhr.onload = function() {
    try {
      var res = JSON.parse(xhr.responseText);
      if (res.ok && Array.isArray(res.pedidos)) {
        var novos = res.pedidos;
        if (novos.length > 0 || pedidos.length === 0) {
          pedidos = novos;
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(pedidos)); } catch(e) {}
          renderLista();
          renderStats();
          if (novos.length > 0) showSyncDot();
        }
      } else {
        console.warn('[TWM Compras] getPedidos retornou erro:', res.msg);
        if (pedidos.length === 0) renderListaVazia();
      }
    } catch(e) {
      console.error('[TWM Compras] Erro ao parsear resposta:', e);
      if (pedidos.length === 0) renderListaVazia();
    }
  };
  xhr.onerror = xhr.ontimeout = function() {
    if (pedidos.length === 0) renderListaVazia();
  };
  xhr.send();
}

function renderListaVazia() {
  var _el = document.getElementById('lista-pedidos') || document.getElementById('lista-wrap');
  if(!_el) return;
  _el.innerHTML =
    '<div class="empty"><div class="empty-ico">📡</div><div class="empty-txt">Sem conexão</div><div class="empty-sub">Verifique sua internet e sincronize</div></div>';
}

// Parser CSV da planilha
// Colunas esperadas (conforme imagem):
// 0:nº ped, 1:data, 2:NIVEL, 3:UND, 4:PRODUTO, 5:FROTA, 6:STATUS, 7:H(data compra), 8:I(vazio), 9:FORNECEDOR, 10:VALOR, 11:COMPRADOR, 12:NOTA FISCAL, 13:TOTAL ITEM
function parsePlanilha(csv) {
  var rows = [];
  var lines = csv.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');

  // Detecta header
  var headerLine = 0;
  for (var i = 0; i < Math.min(5, lines.length); i++) {
    if (lines[i].toLowerCase().indexOf('produto') >= 0 || lines[i].toLowerCase().indexOf('frota') >= 0) {
      headerLine = i; break;
    }
  }

  // Agrupa por nº pedido
  var grupos = {};
  var ordem = [];

  for (var li = headerLine + 1; li < lines.length; li++) {
    var line = lines[li];
    if (!line.trim()) continue;
    var cols = parseCSVLine(line);
    if (cols.length < 5) continue;

    var nPed = (cols[0] || '').replace(/"/g, '').trim();
    var data = (cols[1] || '').replace(/"/g, '').trim();
    var nivel = (cols[2] || 'NORMAL').replace(/"/g, '').trim().toUpperCase();
    var und = (cols[3] || 'UN').replace(/"/g, '').trim();
    var produto = (cols[4] || '').replace(/"/g, '').trim();
    var frota = (cols[5] || '').replace(/"/g, '').trim();
    var status = normStatus(cols[6] || '');
    var fornecedor = (cols[9] || '').replace(/"/g, '').trim();
    var valor = (cols[10] || '').replace(/"/g, '').replace('R$', '').replace(',', '.').trim();
    var comprador = (cols[11] || '').replace(/"/g, '').trim();
    var notaFiscal = (cols[12] || '').replace(/"/g, '').trim();

    if (!nPed || !produto) continue;

    if (!grupos[nPed]) {
      grupos[nPed] = {
        id: nPed,
        data: data,
        nivel: nivel,
        frota: frota,
        status: status,
        obs: '',
        fornecedor: fornecedor,
        valor: valor,
        comprador: comprador,
        notaFiscal: notaFiscal,
        itens: []
      };
      ordem.push(nPed);
    }

    grupos[nPed].itens.push({ prod: produto, qty: cols[3] || '1', und: und });
  }

  // Reconstrói com quantidade correta
  for (var li2 = headerLine + 1; li2 < lines.length; li2++) {
    var l2 = lines[li2];
    if (!l2.trim()) continue;
    var c2 = parseCSVLine(l2);
    if (c2.length < 5) continue;
    var np2 = (c2[0] || '').replace(/"/g, '').trim();
    if (!np2 || !grupos[np2]) continue;
    // A coluna 3 pode ser quantidade
    var qty2 = parseFloat((c2[3] || '1').replace(/"/g,'').trim()) || 1;
    var und2 = isNaN(parseFloat((c2[3]||'').replace(/"/g,'').trim())) ? (c2[3]||'UN').replace(/"/g,'').trim() : 'UN';
    // Corrige itens com qty
    var idx = grupos[np2].itens.findIndex ? grupos[np2].itens.findIndex(function(x){ return x.prod === (c2[4]||'').replace(/"/g,'').trim(); }) : -1;
    if (idx >= 0) { grupos[np2].itens[idx].qty = qty2; grupos[np2].itens[idx].und = und2; }
  }

  ordem.forEach(function(k) { rows.push(grupos[k]); });

  // Ordena por nº pedido desc
  rows.sort(function(a, b) { return parseInt(b.id) - parseInt(a.id) || b.data.localeCompare(a.data); });

  return rows;
}

function parseCSVLine(line) {
  var cols = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
    else { cur += c; }
  }
  cols.push(cur);
  return cols;
}

function normStatus(s) {
  var v = (s || '').toUpperCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (v.includes('ORC') || v.includes('COTAC')) return 'orc';
  if (v.includes('FINAL') || v.includes('COMPRAD') || v.includes('OK')) return 'fin';
  if (v.includes('CANCEL')) return 'can';
  return 'sol';
}

function renderLista() {
  var busca = ((document.getElementById('search-inp')||{value:''}).value || '').toLowerCase().trim();
  var lista = pedidos.filter(function(p) {
    if (filtroAtual === 'sol' && p.status !== 'sol') return false;
    if (filtroAtual === 'orc' && p.status !== 'orc') return false;
    if (filtroAtual === 'fin' && p.status !== 'fin') return false;
    if (filtroAtual === 'can' && p.status !== 'can') return false;
    if (filtroAtual === 'urg' && p.nivel !== 'URGENTE') return false;
    if (busca) {
      var texto = (p.id + ' ' + p.frota + ' ' + p.itens.map(function(i){ return i.prod; }).join(' ')).toLowerCase();
      if (texto.indexOf(busca) < 0) return false;
    }
    return true;
  });

  if (!lista.length) {
    var _ly = document.getElementById('lista-pedidos') || document.getElementById('lista-wrap');
    if(_ly) _ly.innerHTML =
      '<div class="empty"><div class="empty-ico">' + (pedidos.length ? '🔍' : '📦') + '</div>' +
      '<div class="empty-txt">' + (pedidos.length ? 'Nenhum resultado' : 'Sem pedidos') + '</div>' +
      '<div class="empty-sub">' + (pedidos.length ? 'Tente outros filtros' : 'Clique em + para criar um pedido') + '</div></div>';
    return;
  }

  var html = '';
  lista.forEach(function(p) {
    var prods = p.itens.map(function(i) { return i.prod; }).join(' · ');
    var urg = p.nivel === 'URGENTE';
    var dateStr = (p.data || '').split(' ')[0];

    html += '<div class="pedido-card st-' + p.status + (urg ? ' urg' : '') + '" onclick="abrirDetalhe(\'' + esc(p.id) + '\')">' +
      '<div class="pc-top">' +
        '<span class="pc-num">#' + p.id + '</span>' +
        '<span class="pc-frota">' + esc(p.frota) + '</span>' +
        (urg ? '<span class="pc-urg">⚡ URGENTE</span>' : '') +
        '<span class="pc-date">' + dateStr + '</span>' +
      '</div>' +
      '<div class="pc-produto">' + esc(prods) + '</div>' +
      '<div class="pc-bot">' +
        badgeHtml(p.status) +
        (p.fornecedor ? '<span class="pc-user">' + esc(p.fornecedor) + '</span>' : '') +
        (p.fotos && p.fotos.length ? '<span class="pc-foto" onclick="event.stopPropagation();abrirViewerPedido(\'' + esc(p.id) + '\',0)" title="Ver fotos" style="cursor:pointer;background:rgba(6,182,212,.15);border-radius:4px;padding:2px 5px;display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#22D3EE;font-weight:700">📷 ' + p.fotos.length + '</span>' : '') +
        '<span class="pc-qty">' +
          '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>' +
          ' ' + p.itens.length + ' item' + (p.itens.length > 1 ? 'ns' : '') +
        '</span>' +
      '</div>' +
    '</div>';
  });

  var _lw = document.getElementById('lista-pedidos') || document.getElementById('lista-wrap');
  if(_lw) _lw.innerHTML = html;
}

function badgeHtml(s) {
  if (s === 'fin') return '<span class="badge badge-fin">✓ Finalizado</span>';
  if (s === 'can') return '<span class="badge badge-can">✕ Cancelado</span>';
  if (s === 'orc') return '<span class="badge badge-orc">🔍 Orçando</span>';
  return '<span class="badge badge-sol">⏳ Pendente</span>';
}

}

}

function parseDateBR(s) {
  if (!s) return null;
  var m = (s + '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if (m) return new Date(m[3], parseInt(m[2]) - 1, parseInt(m[1]));
  return null;
}

// ══════════════════════════════════════════════
//  SALVAR PEDIDO → GOOGLE SHEETS via Apps Script
// ══════════════════════════════════════════════
// ══════════════════════════════════════════════
//  ImgBB — upload de uma foto, retorna URL pública
// ══════════════════════════════════════════════
var IMGBB_KEY = '4a02e2a2c68223fd6a37ebbffefe4501';

function comprimirFoto(dataUrl, maxPx, qualidade, cb) {
  var img = new Image();
  img.onload = function() {
    var w = img.width, h = img.height;
    if (w > maxPx || h > maxPx) {
      if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
      else       { w = Math.round(w * maxPx / h); h = maxPx; }
    }
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', qualidade));
  };
  img.src = dataUrl;
}

function uploadFotoImgBB(base64, callback) {
  // Comprime para max 800px / qualidade 0.7 antes de enviar
  comprimirFoto(base64, 800, 0.7, function(compressed) {
    var b64 = compressed.indexOf(',') >= 0 ? compressed.split(',')[1] : compressed;
    console.log('[TWM] ImgBB upload, b64 length:', b64.length);
    var fd = new FormData();
    fd.append('key', IMGBB_KEY);
    fd.append('image', b64);
    var xhr = new XMLHttpRequest();
    xhr.timeout = 25000;
    xhr.open('POST', 'https://api.imgbb.com/1/upload', true);
    xhr.onload = function() {
      console.log('[TWM] ImgBB status:', xhr.status, xhr.responseText.slice(0,200));
      try {
        var r = JSON.parse(xhr.responseText);
        if (r.success) { console.log('[TWM] ImgBB OK:', r.data.url); callback(null, r.data.url); }
        else { console.error('[TWM] ImgBB falhou:', r); callback('ImgBB erro: ' + (r.error && r.error.message || 'desconhecido')); }
      } catch(e) { console.error('[TWM] ImgBB parse error:', e); callback('ImgBB: resposta inválida'); }
    };
    xhr.onerror = function() { console.error('[TWM] ImgBB onerror'); callback('ImgBB: erro de rede'); };
    xhr.ontimeout = function() { console.error('[TWM] ImgBB timeout'); callback('ImgBB: timeout'); };
    xhr.send(fd);
  });
}

function uploadTodasFotos(fotos, callback) {
  if (!fotos || !fotos.length) { callback([]); return; }
  var urls = [];
  var done = 0;
  // Timeout geral: se após 20s não terminou, segue sem as fotos
  var timedOut = false;
  var gTimeout = setTimeout(function() {
    if (done < fotos.length) {
      timedOut = true;
      console.warn('[TWM] ImgBB timeout geral — prosseguindo sem fotos');
      callback(urls);
    }
  }, 20000);
  fotos.forEach(function(f, i) {
    uploadFotoImgBB(f.dataUrl, function(err, url) {
      if (timedOut) return; // já disparou o timeout
      done++;
      if (err) { console.warn('[TWM] Foto ' + i + ' falhou:', err); }
      else urls.push(url);
      if (done === fotos.length) {
        clearTimeout(gTimeout);
        callback(urls);
      }
    });
  });
}

function salvarPedido() {
  var frota = (document.getElementById('f-frota')||{value:''}).value;
  var obs = ((document.getElementById('f-obs')||{value:''}).value || '').trim();
  var solicitante = ((document.getElementById('f-solicitante')||{value:''}).value || '').trim();
  var dataNec = (document.getElementById('f-data-nec')||{value:''}).value;

  // Captura item em edição se houver
  var prodAtual = ((document.getElementById('f-prod')||{value:''}).value || '').trim();
  if (prodAtual) {
    itensPedido.push({
      prod: prodAtual,
      qty: parseFloat((document.getElementById('f-qty')||{value:''}).value) || 1,
      und: (document.getElementById('f-und')||{value:''}).value
    });
    (document.getElementById('f-prod')||{value:''}).value = '';
    renderItens();
  }

  if (!frota) { showToast('⚠️ Selecione a frota/setor!', 'error'); return; }
  if (!itensPedido.length) { showToast('⚠️ Adicione ao menos 1 item!', 'error'); return; }

  var agora = new Date();
  var dataStr = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  var idTemp = 'L' + Date.now().toString().slice(-6);

  // Snapshot das fotos e itens antes de limpar
  var fotosSnap = fotosNovas.slice();
  var itensSnap = itensPedido.slice();
  var nivelSnap = nivelAtual;

  var novo = {
    id: idTemp, data: dataStr, nivel: nivelSnap, frota: frota, status: 'sol',
    obs: obs, solicitante: solicitante, dataNec: dataNec,
    fornecedor: '', valor: '', comprador: '', notaFiscal: '',
    fotos: fotosSnap.map(function(f){ return { dataUrl: f.dataUrl }; }),
    itens: itensSnap
  };

  // Mostra localmente imediatamente
  pedidos.unshift(novo);
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(pedidos)); } catch(e) {}
  renderLista();
  renderStats();
  irTela('tela-lista');
  itensPedido = []; fotosNovas = [];

  if (!SCRIPT_URL) {
    showToast('✓ Salvo localmente (script não configurado)', '');
    return;
  }

  // PASSO 1 — faz upload das fotos no ImgBB (se houver)
  var temFotos = fotosSnap.length > 0;
  if (temFotos) {
    showLoading('Enviando fotos (' + fotosSnap.length + ')...');
  } else {
    showLoading('Salvando pedido...');
  }

  uploadTodasFotos(fotosSnap, function(urlsFotos) {
    // Atualiza preview local com URLs públicas
    var idxLocal = pedidos.findIndex(function(p){ return p.id === idTemp; });
    if (idxLocal >= 0) {
      pedidos[idxLocal].fotos = urlsFotos.map(function(u){ return { url: u }; });
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(pedidos)); } catch(e) {}
    }

    // PASSO 2 — salva pedido + URLs no Apps Script
    if (temFotos) showLoading('Salvando pedido na planilha...');
    var payload = {
      action: 'savePedido',
      nivel: nivelSnap,
      frota: frota,
      obs: obs,
      solicitante: solicitante,
      dataNec: dataNec,
      itens: JSON.stringify(itensSnap),
      fotos: JSON.stringify(urlsFotos)
    };
    // Usa fetch com no-cors não funciona — usa XHR com mode cors via GET para Apps Script
    // Apps Script só aceita POST com redirect; usamos GET com params curtos (sem fotos em base64)
    var qs = 'action=savePedido'
      + '&nivel='       + encodeURIComponent(payload.nivel)
      + '&frota='       + encodeURIComponent(payload.frota)
      + '&obs='         + encodeURIComponent(payload.obs)
      + '&solicitante=' + encodeURIComponent(payload.solicitante)
      + '&dataNec='     + encodeURIComponent(payload.dataNec)
      + '&itens='       + encodeURIComponent(payload.itens)
      + '&fotos='       + encodeURIComponent(payload.fotos);

    var xhr = new XMLHttpRequest();
    xhr.timeout = 45000;
    xhr.open('GET', SCRIPT_URL + '?' + qs, true);
    xhr.onload = function() {
      hideLoading();
      console.log('[TWM] savePedido status:', xhr.status, xhr.responseText.slice(0,300));
      try {
        var resp = JSON.parse(xhr.responseText);
        if (resp.ok) {
          var novoId = String(resp.id || idTemp);
          var idx2 = pedidos.findIndex(function(p){ return p.id === idTemp; });
          if (idx2 >= 0) pedidos[idx2].id = novoId;
          try { localStorage.setItem(CACHE_KEY, JSON.stringify(pedidos)); } catch(e) {}
          renderLista();
          if (urlsFotos.length > 0 && urlsFotos.length < fotosSnap.length) {
            showToast('✓ Pedido #' + novoId + ' salvo (' + (fotosSnap.length - urlsFotos.length) + ' foto(s) falharam)', '');
          } else {
            showToast('✓ Pedido #' + novoId + ' salvo na planilha!', 'success');
          }
          setTimeout(buscarPedidos, 3000);
        } else {
          showToast('⚠️ Script: ' + (resp.msg || 'erro desconhecido'), 'error');
          console.error('[TWM] savePedido erro:', resp);
        }
      } catch(ex) {
        console.error('[TWM] savePedido parse error:', ex, xhr.responseText.slice(0,500));
        showToast('⚠️ Resposta inválida do script', 'error');
      }
    };
    xhr.onerror = function() {
      hideLoading();
      console.error('[TWM] savePedido onerror');
      showToast('⚠️ Salvo local. Erro de rede.', '');
    };
    xhr.ontimeout = function() {
      hideLoading();
      console.error('[TWM] savePedido timeout');
      showToast('⚠️ Salvo local. Timeout.', '');
    };
    xhr.send();
  });
}

// ── FOTOS — FORMULÁRIO NOVO ──────────────────────────────────────
function adicionarFotos(input) {
  var files=Array.from(input.files||[]); if(!files.length) return;
  files.forEach(function(file) {
    var reader=new FileReader();
    reader.onload=function(ev) {
      var img=new Image();
      img.onload=function() {
        var MAX=1200, w=img.width, h=img.height;
        if(w>MAX||h>MAX){ var r=Math.min(MAX/w,MAX/h); w=Math.round(w*r); h=Math.round(h*r); }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        fotosNovas.push({ file:file, dataUrl:c.toDataURL('image/jpeg',0.75) });
        renderFotosPreview();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  input.value='';
}
function renderFotosPreview() {
  var wrap=document.getElementById('fotos-preview-novo'); if(!wrap) return;
  var html='';
  fotosNovas.forEach(function(f,i) {
    html+='<div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px">' +
      '<img class="foto-preview" src="'+f.dataUrl+'" onclick="abrirViewerLocal('+i+')">' +
      '<button class="foto-del" onclick="remFoto('+i+')">✕</button></div>';
  });
  wrap.innerHTML=html;
  // nenhuma referência a elementos antigos removidos
}
function remFoto(i) { fotosNovas.splice(i,1); renderFotosPreview(); }
function abrirViewerLocal(i) { abrirViewer(fotosNovas.map(function(f){ return f.dataUrl; }), i); }

function orcandoPedido(id) {
  var p=pedidos.find(function(x){ return x.id===id; }); if(!p) return;
  var forn=(document.getElementById('ed-fornecedor')||{}).value||'';
  var valor=(document.getElementById('ed-valor')||{}).value||'';
  var nf=(document.getElementById('ed-nf')||{}).value||'';
  var temFotos=(window._fotosDetTemp||[]).length>0;
  if(temFotos) showLoading('Enviando fotos...');
  uploadFotosDetTemp(function(urlsFotos) {
    var fotosObj=urlsFotos.map(function(u){ return {url:u}; });
    p.fotos=(p.fotos||[]).concat(fotosObj);
    p.status='orc'; p.fornecedor=forn; p.valor=valor; p.notaFiscal=nf;
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(pedidos)); }catch(e){}
    hideLoading(); renderStats(); abrirDetalhe(id);
    showToast('🔍 Status: Orçando', '');
    if(SCRIPT_URL) enviarStatusUpdate(id,'ORCANDO',{ fornecedor:forn, valor:valor, notaFiscal:nf, fotos:JSON.stringify(urlsFotos) });
  });
}

function finalizarPedido(id) {
  var p=pedidos.find(function(x){ return x.id===id; }); if(!p) return;
  var fornecedor=(document.getElementById('ed-fornecedor')||{}).value||'';
  var valor=(document.getElementById('ed-valor')||{}).value||'';
  var nf=(document.getElementById('ed-nf')||{}).value||'';
  var temFotos=(window._fotosDetTemp||[]).length>0;
  if(temFotos) showLoading('Enviando fotos...');
  uploadFotosDetTemp(function(urlsFotos) {
    var fotosObj=urlsFotos.map(function(u){ return {url:u}; });
    p.fotos=(p.fotos||[]).concat(fotosObj);
    p.status='fin'; p.fornecedor=fornecedor; p.valor=valor; p.notaFiscal=nf;
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(pedidos)); }catch(e){}
    hideLoading(); renderStats(); abrirDetalhe(id);
    showToast('✓ Pedido finalizado!', 'success');
    if(SCRIPT_URL) enviarStatusUpdate(id,'FINALIZADO',{ fornecedor:fornecedor, valor:valor, notaFiscal:nf, fotos:JSON.stringify(urlsFotos) });
  });

function cancelarPedido(id) {
  if (!confirm('Cancelar este pedido?')) return;
  var p=pedidos.find(function(x){ return x.id===id; }); if(!p) return;
  p.status='can';
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(pedidos)); }catch(e){}
  renderStats(); irTela('tela-lista'); renderLista();
  showToast('Pedido cancelado', '');
  if(SCRIPT_URL) enviarStatusUpdate(id,'CANCELADO',{});
}

function enviarStatusUpdate(id, status, extra) {
  var p = Object.assign({ action: 'updateStatus', id: id, status: status }, extra);
  var qs = 'action=updateStatus'
    + '&id='     + encodeURIComponent(p.id)
    + '&status=' + encodeURIComponent(p.status);
  if (p.fornecedor)  qs += '&fornecedor='  + encodeURIComponent(p.fornecedor);
  if (p.valor)       qs += '&valor='       + encodeURIComponent(p.valor);
  if (p.notaFiscal)  qs += '&notaFiscal='  + encodeURIComponent(p.notaFiscal);
  if (p.fotos)       qs += '&fotos='       + encodeURIComponent(p.fotos);
  var xhr = new XMLHttpRequest();
  xhr.timeout = 45000;
  xhr.open('GET', SCRIPT_URL + '?' + qs, true);
  xhr.onload = function() {
    console.log('[TWM] updateStatus:', xhr.status, xhr.responseText.slice(0,200));
    setTimeout(buscarPedidos, 2500);
  };
  xhr.onerror = xhr.ontimeout = function() { showToast('⚠️ Sem conexão. Status salvo local.', ''); };
  xhr.send();
}

var _toastTimer = null;
function showToast(msg, type) {
  var el = document.getElementById('ios-toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { el.classList.remove('show'); }, 3000);
}

function esc(s) {
  return (s + '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function objToQuery(obj) {
  return Object.keys(obj).map(function(k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]);
  }).join('&');
}

function formatDate(s) {
  if (!s) return '—';
  // yyyy-mm-dd → dd/mm/yyyy
  var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + '/' + m[2] + '/' + m[1];
  return s;
}

function renderPedidos() {
  var el = document.getElementById('lista-pedidos');
  var lista = (window.pedidos||[]).filter(function(p) {
    var st = normalizarStatus(p.status||'pendente');
    if(_chipAtivo !== 'todos' && st !== _chipAtivo) return false;
    if(_srchPed) {
      var txt = ((p.frota||'')+(p.descricao||p.item||'')+(p.id||'')).toLowerCase();
      if(!txt.includes(_srchPed)) return false;
    }
    return true;
  });

  if(!lista.length) {
    el.innerHTML = '<div class="ios-empty"><div class="ios-empty-icon">🛒</div>'
      + '<div class="ios-empty-title">Nenhuma solicitação</div>'
      + '<div class="ios-empty-sub">Toque em + para criar uma</div></div>';
    return;
  }

  el.innerHTML = '';
  lista.forEach(function(p) {
    var st = normalizarStatus(p.status||'pendente');
    var cfg = ST_MAP[st]||ST_MAP.pendente;
    var card = document.createElement('div');
    card.className = 'ped-card ' + cfg.cardCls;
    card.innerHTML = '<div class="ped-card-header">'
      + '<span class="ped-id">#' + (p.id||'—') + '</span>'
      + '<span class="ios-pill ' + cfg.cls + '">' + cfg.label + '</span>'
      + '</div>'
      + '<div class="ped-frota">' + (p.frota||'—') + '</div>'
      + '<div class="ped-desc">' + (p.descricao||p.item||'—') + '</div>'
      + '<div class="ped-footer">'
      + '<span class="ped-data">' + (p.data||p.dataAbertura||'') + '</span>'
      + '<span class="ped-solicitante">' + (p.solicitante||p.motorista||'') + '</span>'
      + '</div>';
    card.addEventListener('click', (function(pid){ return function(){ abrirModal(pid); }; })(p.id));
    el.appendChild(card);
  });
}

function abrirModal(pid) {
  var p = (window.pedidos||[]).find(function(x){ return x.id===pid; });
  if(!p) return;
  var st = normalizarStatus(p.status||'pendente');
  var cfg = ST_MAP[st]||ST_MAP.pendente;
  document.getElementById('modal-frota').textContent = p.frota||'—';

  var body = '<div style="margin:8px 0 14px"><span class="ios-pill ' + cfg.cls + '">' + cfg.label + '</span></div>';
  var rows = [
    ['ID', '#'+(p.id||'—')],
    ['Item(ns)', p.descricao||p.item||'—'],
    ['Urgência', p.urgencia||'normal'],
    ['Solicitante', p.solicitante||p.motorista||'—'],
    ['Data', p.data||p.dataAbertura||'—'],
    ['Obs.', p.obs||'—'],
  ];
  rows.forEach(function(r) {
    body += '<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--ios-sep)">'
      + '<span style="font-size:15px;color:var(--ios-label2)">' + r[0] + '</span>'
      + '<span style="font-size:15px;font-weight:500;color:var(--ios-label);text-align:right;max-width:65%">' + r[1] + '</span></div>';
  });

  // Fotos
  var fotos = p.fotos||[];
  if(p.foto_url) fotos = [p.foto_url];
  if(fotos.length) {
    body += '<div style="margin-top:12px"><div style="font-size:12px;font-weight:700;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Fotos</div>'
      + '<div class="fotos-row">';
    fotos.forEach(function(url) {
      var imgEl = document.createElement('img');
      imgEl.className = 'foto-thumb'; imgEl.src = url;
      imgEl.addEventListener('click', (function(u){ return function(){ window.open(u,'_blank'); }; })(url));
      body += imgEl.outerHTML;
    });
    body += '</div></div>';
  }

  // Mudar status
  body += '<div style="margin-top:16px"><div style="font-size:12px;font-weight:700;color:var(--ios-gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Alterar Status</div>'
    + '<div id="st-btn-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div></div>';

  document.getElementById('modal-body').innerHTML = body;

  // Botões de status via DOM
  var grid = document.getElementById('st-btn-grid');
  Object.keys(ST_MAP).filter(function(s){ return s!==st; }).forEach(function(s) {
    var cfg2 = ST_MAP[s];
    var btn = document.createElement('button');
    btn.style.cssText = 'padding:10px;border:none;border-radius:10px;background:var(--ios-fill2);color:var(--ios-label);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit';
    btn.textContent = cfg2.label;
    btn.addEventListener('click', (function(ppid,ss){ return function(){ mudarStatus(ppid,ss); }; })(pid,s));
    grid.appendChild(btn);
  });
}

function mudarStatus(pid, novoSt) {
  fecharModal();
  atualizarStatusPedido(pid, novoSt, function(ok) {
    if(ok) {
      showToast('✅ Status atualizado');
      renderPedidos();
    } else {
      showToast('⚠ Erro ao atualizar');
    }
  });
}

function fecharModal() {
  document.getElementById('ped-modal-ov').classList.remove('open');
}

function abrirNovoPedido() {
  _fotosNovo = [];
  document.getElementById('n-fotos-preview').innerHTML = '';
  document.getElementById('novo-ov').classList.add('open');
  document.getElementById('novo-sheet').classList.add('open');
  setTimeout(function(){ document.getElementById('n-frota').focus(); }, 300);
}

function fecharNovo() {
  document.getElementById('novo-ov').classList.remove('open');
  document.getElementById('novo-sheet').classList.remove('open');
}

function previewFotosNovo(input) {
  if(!input.files) return;
  Array.from(input.files).forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      _fotosNovo.push(e.target.result);
      var img = document.createElement('img');
      img.className = 'foto-thumb';
      img.src = e.target.result;
      document.getElementById('n-fotos-preview').appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

function enviarNovoPedido() {
  var frota   = document.getElementById('n-frota').value.trim();
  var desc    = document.getElementById('n-desc').value.trim();
  var urgencia= document.getElementById('n-urgencia').value;
  var obs     = document.getElementById('n-obs').value.trim();
  if(!frota||!desc) { showToast('⚠ Preencha frota e descrição'); return; }

  showToast('⏳ Enviando...');
  
  var pedido = {
    frota: frota, descricao: desc, urgencia: urgencia,
    obs: obs, status: 'pendente',
    fotos: _fotosNovo,
    data: new Date().toLocaleDateString('pt-BR'),
  };
  
  enviarPedido(pedido, function(ok, id) {
    if(ok) {
      fecharNovo();
      showToast('✅ Solicitação enviada!');
      document.getElementById('n-frota').value='';
      document.getElementById('n-desc').value='';
      carregarPedidos();
    } else {
      showToast('⚠ Erro ao enviar. Tente novamente.');
    }
  });
}

// Hook renderização
var _origRender = typeof renderLista === 'function' ? renderLista : null;
function renderLista() {
  if(_origRender) _origRender();
  renderPedidos();
}


// ═══════════ PATCH: corrige funções quebradas / indefinidas ═══════════

// 1. renderLista: override final — usa só renderPedidos (ignora versão antiga que crashava em lista-wrap)
renderLista = function() { try{ renderPedidos(); }catch(e){} };

// 2. renderListaVazia: usa lista-pedidos em vez de lista-wrap
renderListaVazia = function() {
  var el = document.getElementById('lista-pedidos');
  if(el) el.innerHTML = '<div class="ios-empty">'
    + '<div class="ios-empty-icon">🛒</div>'
    + '<div class="ios-empty-title">Nenhuma solicitação</div>'
    + '<div class="ios-empty-sub">Toque em + para criar</div></div>';
};

// 3. showLoading / hideLoading — elementos não existem, usa toast
showLoading = function(txt){ showToast('⏳ '+(txt||'Aguarde...')); };
hideLoading = function(){};

// 4. normalizarStatus — usada por renderPedidos mas nunca definida no HTML
normalizarStatus = function(s) {
  var v = String(s||'').toUpperCase().trim();
  if(v==='FIN'||v==='FINALIZADO'||v.indexOf('COMPRAD')>=0||v.indexOf('FINAL')>=0) return 'comprado';
  if(v==='CAN'||v.indexOf('CANCEL')>=0||v==='REPROVADO') return 'reprovado';
  if(v==='ORC'||v.indexOf('ORC')>=0||v.indexOf('COTAC')>=0) return 'orc';
  if(v==='APROVADO'||v==='APROV') return 'aprovado';
  return 'pendente';
};

// 5. carregarPedidos — chamada 3x mas nunca definida
function carregarPedidos(){ buscarPedidos(); }

// 6. enviarPedido — chamada por enviarNovoPedido mas nunca definida
function enviarPedido(pedido, callback) {
  var linhas = (pedido.descricao||pedido.item||'Item').split('\n').filter(function(l){ return l.trim(); });
  if(!linhas.length) linhas = ['Item'];
  var itens = linhas.map(function(l){ return {prod:l.trim(), qty:1}; });
  var params = new URLSearchParams({
    action:'savePedido',
    nivel:(pedido.urgencia||'NORMAL').toUpperCase(),
    frota:pedido.frota||'',
    obs:pedido.obs||'',
    solicitante:'',
    dataNec:'',
    itens:JSON.stringify(itens),
    fotos:JSON.stringify([])
  });
  fetch(SCRIPT_URL+'?'+params.toString())
    .then(function(r){ return r.json(); })
    .then(function(res){ callback(res.ok, res.nPed); })
    .catch(function(){ callback(false,null); });
}

// 7. atualizarStatusPedido — chamada por mudarStatus mas nunca definida
function atualizarStatusPedido(pid, novoSt, callback) {
  var stMap = {pendente:'PENDENTE',orc:'ORCANDO',aprovado:'APROVADO',comprado:'FINALIZADO',reprovado:'CANCELADO'};
  var params = new URLSearchParams({
    action:'updateStatus',
    id:pid,
    status:stMap[novoSt]||novoSt.toUpperCase()
  });
  fetch(SCRIPT_URL+'?'+params.toString())
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res.ok){
        var p = (window.pedidos||[]).find(function(x){ return x.id===pid; });
        if(p) p.status = novoSt;
        try{ localStorage.setItem(CACHE_KEY, JSON.stringify(window.pedidos||[])); }catch(e){}
      }
      callback(res.ok);
    })
    .catch(function(){ callback(false); });
}

// 8. abrirModal — não abria o overlay; adiciona .open ao ped-modal-ov
var _origAbrirModal = abrirModal;
abrirModal = function(pid) {
  _origAbrirModal(pid);
  document.getElementById('ped-modal-ov').classList.add('open');
};

// ─────────────────────────────────────────────────────────────────────
// Boot
carregarPedidos();
</script>
